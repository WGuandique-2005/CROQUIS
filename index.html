      ul.appendChild(h);
      hits.forEach(({b, r}) => {
        const cat = catOf(r.cat);
        const li = document.createElement('li');
        li.className = 'rhit' + (DET.open && DET.bId === b.id && DET.sel === r.id ? ' sel' : '');
        li.innerHTML = `<span class="zsw" style="background:${roomColor(r)}"></span>
          <span class="rcol">

            <span class="zname">${escapeHtml(r.name || cat.name)}</span></span>
            <span class="rmeta">${escapeHtml(b.name || 'Edificio')} · ${escapeHtml(lvlLabel(b, r.level || 0))}</span>
          </span>`;
        li.onclick = () => goToRoom(b.id, r.id);
        li.onmouseenter = () => { if (b.visible !== false){ hoverZone = b.id; applyZoneStyle(b); } };
        li.onmouseleave = () => { hoverZone = null; applyZoneStyle(b); };
        ul.appendChild(li);

    } else if (!zones.length){
      const li = document.createElement('li');
      li.className = 'zempty';
      li.textContent = `Ninguna zona ni ambiente coincide con «${q}».`;
      ul.appendChild(li);
    }
  }

/* =====================================================================
   VISTA DE DETALLE · AMBIENTES INTERIORES DE UN EDIFICIO
   - Los rooms viven dentro del item (z.rooms) en el MISMO espacio local
     del poly del edificio (sin rotación): viajan con mover/escalar y se
     dibujan rotados junto al edificio automáticamente.
===================================================================== */
const DET = {open:false, bId:null, level:0, tool:'select', sel:null, stampCat:null,
  byType:false, filter:null, burst:false, pendingSel:null, view:{k:1, tx:0, ty:0}};
let dHover = null, dDrag = null, dRaf = 0, dGhostRaf = 0, dGhostP = null, dblHintShown = false;
const detailWrap = $('detailWrap'), dsvg = $('dsvg'), dRoot = $('dRoot');
const lvlName = i => i === 0 ? 'PB' : 'N' + i;
const lvlLabel = (b, i) => (b && Array.isArray(b.levelNames) && b.levelNames[i]) || lvlName(i);
const bld = () => itemById(DET.bId);
const roomById = id => { const b = bld(); return (b && Array.isArray(b.rooms)) ? b.rooms.find(r => r.id === id) : null; };
const roomsAt = lvl => { const b = bld(); return (b && Array.isArray(b.rooms)) ? b.rooms.filter(r => (r.level || 0) === lvl) : []; };
function catOf(key){
  const c = doc().catalog;
  return (Array.isArray(c) && c.find(x => x.key === key)) ||
    {key:'otro', name:'Otro', code:'—', color:'#8F8A74', icon:'otro'};
}
const roomColor = r => r.color || catOf(r.cat).color;
function nextRoomCode(b){
  const base = String(b.code || 'ED');
  const used = new Set((b.rooms || []).map(r => String(r.code || '').toUpperCase()));
  let i = 1;
  while (used.has(base + '-' + String(i).padStart(2, '0'))) i++;
  return base + '-' + String(i).padStart(2, '0');
}

/* ---- transformación propia de la vista de detalle ---- */
function dApplyView(){
  dRoot.setAttribute('transform',
    `translate(${DET.view.tx.toFixed(1)} ${DET.view.ty.toFixed(1)}) scale(${(+DET.view.k).toFixed(4)})`);
}
function dPt(e){
  const r = dsvg.getBoundingClientRect();
  return {x:(e.clientX - r.left - DET.view.tx)/DET.view.k, y:(e.clientY - r.top - DET.view.ty)/DET.view.k};
}
function dSchedule(){ if (dRaf) return; dRaf = requestAnimationFrame(() => { dRaf = 0; detailRenderCanvas(); }); }
function dGhostSchedule(p){
  dGhostP = p;
  if (dGhostRaf) return;
  dGhostRaf = requestAnimationFrame(() => {
    dGhostRaf = 0;
    if (!DET.open) return;
    dRoot.querySelectorAll('.dghost').forEach(n => n.remove());
    if (!dGhostP) return;
    if (DET.tool === 'stampRoom') drawDetailGhost(dGhostP);
    else if (DET.tool === 'draw' && DET.drawing) drawDrawPreview(dGhostP);
  });
}
function dZoomAt(sx, sy, factor){
  const k2 = clamp(DET.view.k * factor, .15, 12);
  const f = k2 / DET.view.k;
  DET.view.tx = sx - (sx - DET.view.tx) * f;
  DET.view.ty = sy - (sy - DET.view.ty) * f;
  DET.view.k = k2;
  dApplyView(); dSchedule();
}
function detailFit(){
  const b = bld(); if (!b || !DET.open) return;
  const r = dsvg.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const bb = polyBBox(b.poly), pad = 90;
  const k = clamp(Math.min((r.width - pad*2)/Math.max(bb.w, 40), (r.height - pad*2)/Math.max(bb.h, 40)), .15, 4);
  DET.view.k = k;
  DET.view.tx = r.width/2 - k*(bb.x + bb.w/2);
  DET.view.ty = r.height/2 - k*(bb.y + bb.h/2);
  dApplyView(); detailRenderCanvas();
  /* T6: si se llegó desde la búsqueda global, seleccionar y centrar el ambiente pedido */
  const pid = DET.pendingSel; DET.pendingSel = null;
  if (pid){
    const rp = roomById(pid);
    if (rp){ DET.sel = pid; renderRoomList(); detailRenderProp(); dCenterRoom(rp); }
  }
}
function dCenterRoom(r){
  const rc = dsvg.getBoundingClientRect();
  const c = polyCentroid(r.poly);
  DET.view.tx = rc.width/2 - c.x*DET.view.k;
  DET.view.ty = rc.height/2 - c.y*DET.view.k;
  dApplyView(); detailRenderCanvas();
}

/* ---- dibujo del plano de detalle ---- */
function detailRenderCanvas(){
  if (!DET.open) return;
  const b = bld(); if (!b) return;
  const cp = $('dClipPath'); if (cp) cp.setAttribute('d', polyPath(b.poly));
  dApplyView();
  dRoot.innerHTML = '';
  if (doc().grid) el('rect', {x:-2500, y:-2500, width:7000, height:7000, fill:'url(#dgrid)'}, dRoot);
  el('path', {d: polyPath(b.poly), transform:'translate(7 8)', fill:'rgba(36,39,29,.13)'}, dRoot);
  el('path', {d: polyPath(b.poly), fill:'#FBF7EC'}, dRoot);
  roomsAt(DET.level).forEach(r => drawRoomNode(r));
  el('path', {d: polyPath(b.poly), fill:'none', stroke:'#24271D', 'stroke-width':2.5, 'stroke-linejoin':'round'}, dRoot);
  drawDetailHandles();
  if (DET.tool === 'draw' && DET.drawing) drawDrawPreview(null);
}
function drawRoomNode(r){
  const cat = catOf(r.cat);
  const col = DET.byType ? cat.color : roomColor(r);
  const sel = DET.sel === r.id, hov = dHover === r.id;
  const g = el('g', {'data-rid': r.id}, dRoot);
  el('path', {d: polyPath(r.poly), fill: col, 'fill-opacity': sel ? .55 : .45,
    stroke: sel || hov ? '#B04A26' : '#24271D', 'stroke-width': sel ? 2.5 : hov ? 2 : 1.4,
    'stroke-linejoin':'round', 'clip-path':'url(#dClip)'}, g);
  const bb = polyBBox(r.poly);
  const u = 1/DET.view.k;
  const wScr = bb.w * DET.view.k, hScr = bb.h * DET.view.k;
  const isStair = r.cat === 'escala' || cat.icon === 'escala';
  if (isStair && wScr >= 40 && hScr >= 34){
    /* T3b: escalera arquitectónica — escalones grandes + flecha SUBE */
    if (wScr >= 54){
      const lg = el('g', {transform:`translate(${bb.x.toFixed(1)} ${bb.y.toFixed(1)}) scale(${u.toFixed(3)})`}, g);
      txt(lg, r.code || '', {x:5, y:11.5, class:'ft-m', 'font-weight':700, 'font-size':11,
        fill:'#24271D', stroke:'#F4F0E1', 'stroke-width':3, 'paint-order':'stroke', 'stroke-linejoin':'round'});
    }
    const cx = bb.x + bb.w/2, cy = bb.y + bb.h/2;
    const s = Math.min(bb.w, bb.h) * .58;
    const ink = 'rgba(36,39,29,.82)';
    roomIcon(g, 'escala', cx - s/2, cy - s/2 - 3*u, s, ink);
    const ty = cy + s/2 + 9*u;
    el('line', {x1:cx.toFixed(1), y1:(ty - 2.5*u).toFixed(1), x2:cx.toFixed(1), y2:(ty - 9*u).toFixed(1),
      stroke:ink, 'stroke-width':(1.6*u).toFixed(2)}, g);
    el('path', {d:`M${(cx - 2.8*u).toFixed(1)} ${(ty - 8*u).toFixed(1)} L${cx.toFixed(1)} ${(ty - 12.5*u).toFixed(1)} L${(cx + 2.8*u).toFixed(1)} ${(ty - 8*u).toFixed(1)} Z`, fill:ink}, g);
    txt(g, 'SUBE', {x:cx.toFixed(1), y:(ty + 3.5*u).toFixed(1), 'text-anchor':'middle', class:'ft-m', 'font-weight':700,
      'font-size':(10*u).toFixed(2), fill:'#24271D', 'letter-spacing':(1.4*u).toFixed(2),
      stroke:'#F4F0E1', 'stroke-width':(3*u).toFixed(2), 'paint-order':'stroke'});
  } else if (wScr >= 70 && hScr >= 24){
    const lg = el('g', {transform:`translate(${bb.x.toFixed(1)} ${bb.y.toFixed(1)}) scale(${u.toFixed(3)})`}, g);
    roomIcon(lg, cat.icon, 5, 5, 15, 'rgba(36,39,29,.85)');
    txt(lg, r.code || '', {x:24, y:11.5, class:'ft-m', 'font-weight':700, 'font-size':11,
      fill:'#24271D', stroke:'#F4F0E1', 'stroke-width':3, 'paint-order':'stroke', 'stroke-linejoin':'round'});
    if (wScr >= 130 && hScr >= 52 && r.name){
      wrapText(r.name, Math.max(8, Math.floor(wScr/6.4)), 2).forEach((ln, i) =>
        txt(lg, ln, {x:5, y: i ? 38 : 27, class:'ft-s', 'font-weight':600, 'font-size':10.5,
          fill:'#23261C', stroke:'#F4F0E1', 'stroke-width':3, 'paint-order':'stroke', 'stroke-linejoin':'round'}));
    }
  }
}
function drawDetailHandles(){
  const r = roomById(DET.sel);
  if (!r || DET.tool !== 'select') return;
  const u = 1/DET.view.k;
  if (r.poly.length <= 14){
    r.poly.forEach((p, i) => {
      const q = r.poly[(i + 1) % r.poly.length];
      const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2, s = 4.5 * u;
      el('path', {d:`M${mx-s},${my} L${mx},${my-s} L${mx+s},${my} L${mx},${my+s} Z`,
        fill:'#F8F4E7', stroke:'#7A7D6A', 'stroke-width':1.2*u, 'data-dmid':i, style:'cursor:copy'}, dRoot);
    });
  }
  r.poly.forEach((p, i) =>
      el('circle', {cx:p.x, cy:p.y, r:5.5*u, fill:'#F8F4E7', stroke:'#B04A26', 'stroke-width':2*u,
        'data-dv':i, style:'cursor:move'}, dRoot));
  const b = polyBBox(r.poly), s = 9*u;
  DETAIL_SCALE_KEYS.forEach(k => {
    const hx = k.includes('w') ? b.x : k.includes('e') ? b.x + b.w : b.x + b.w / 2;
    const hy = k.includes('n') ? b.y : k.includes('s') ? b.y + b.h : b.y + b.h / 2;
    const cursor = k === 'e' || k === 'w' ? 'ew-resize' : k === 'n' || k === 's' ? 'ns-resize' : 'nwse-resize';
    el('rect', {x:hx - s/2, y:hy - s/2, width:s, height:s, fill:'#F8F4E7', stroke:'#20241A',
      'stroke-width':1.5*u, 'data-dsc':k, style:`cursor:${cursor}`}, dRoot);
  });
  const c = polyCentroid(r.poly), ry = b.y - 27*u;
  el('line', {x1:c.x, y1:b.y, x2:c.x, y2:ry, stroke:'#20241A', 'stroke-width':1.4*u, opacity:.75, 'pointer-events':'none'}, dRoot);
  el('circle', {cx:c.x, cy:ry, r:7*u, fill:'#F8F4E7', stroke:'#B04A26', 'stroke-width':2*u,
    'data-drot':'1', style:'cursor:grab'}, dRoot);
  txt(dRoot, 'R', {x:c.x, y:ry + 3*u, 'text-anchor':'middle', class:'ft-m', 'font-weight':700,
    'font-size':9*u, fill:'#B04A26', 'pointer-events':'none'});
}
function drawDetailGhost(p){
  const b = bld(); if (!b) return;
  const cat = catOf(DET.stampCat);
  if (!pointInPoly(p.x, p.y, b.poly)) return;
  const gx = grid(p.x), gy = grid(p.y);
  const clipped = clipPolyRect(b.poly, {x: gx - 32, y: gy - 24, w: 64, h: 48});
  const g = el('g', {class:'dghost', opacity:.9}, dRoot);
  if (clipped.length >= 3)
    el('path', {d: polyPath(clipped), fill:cat.color, 'fill-opacity':.45, stroke:'#B04A26',
      'stroke-width':1.6, 'stroke-dasharray':'6 4'}, g);
  else
    el('rect', {x:gx - 32, y:gy - 24, width:64, height:48, fill:cat.color, 'fill-opacity':.3,
      stroke:'#B04A26', 'stroke-width':1.4, 'stroke-dasharray':'6 4'}, g);
  const u = 1/DET.view.k;
  const lg = el('g', {transform:`translate(${(gx - 32).toFixed(1)} ${(gy - 24 - 16*u).toFixed(1)}) scale(${u.toFixed(3)})`}, g);
  roomIcon(lg, cat.icon, 0, 0, 13, 'rgba(36,39,29,.85)');
  txt(lg, cat.name, {x:17, y:11, class:'ft-s', 'font-weight':600, 'font-size':11,
    fill:'#23261C', stroke:'#F4F0E1', 'stroke-width':3, 'paint-order':'stroke'});
}

/* ---- cabecera / panel lateral / propiedades ---- */
function detailRenderHead(){
  const b = bld(); if (!b) return;
  $('dName').textContent = b.name || 'Sin nombre';
  $('dCode').textContent = b.code || '—';
  const n = Math.max(1, Math.round(+b.nLevels || 1));
  const lvChip = $('dLvChip');
  if (lvChip){
    if (n > 1){ lvChip.style.display = ''; lvChip.textContent = '×' + n + ' niveles'; }
    else lvChip.style.display = 'none';
  }
  const tabs = $('dTabs'); tabs.innerHTML = '';
  for (let i = 0; i < n; i++){
    const t = document.createElement('button');
    t.className = 'dtab' + (i === DET.level ? ' on' : '');
    t.textContent = lvlLabel(b, i);
    t.title = 'Nivel ' + lvlLabel(b, i);
    t.onclick = () => { DET.level = i; DET.sel = null; DET.burst = false; detailRenderAll(); };
    tabs.appendChild(t);
  }
  const plus = document.createElement('button');
  plus.className = 'dtab';
  plus.textContent = 'Niveles +';
  plus.title = 'Gestionar niveles: añadir, renombrar, eliminar (los eliminados bajan a PB)';
  plus.onclick = openLevelsModal;
  tabs.appendChild(plus);
  $('dToolSelect').classList.toggle('on', DET.tool === 'select');
  $('dToolStamp').classList.toggle('on', DET.tool === 'stampRoom');
  $('dToolCut').classList.toggle('on', DET.tool === 'cut');
  $('dToolDraw').classList.toggle('on', DET.tool === 'draw');
  $('dByType').checked = DET.byType;
  $('dSideTitle').textContent = 'AMBIENTES · ' + lvlLabel(b, DET.level);
}
function detailRenderSide(){ renderRoomList(); detailRenderProp(); renderCatChips(); }
function renderRoomList(){
  const b = bld(), ul = $('dList'), chips = $('dChips');
  if (!b || !ul || !chips) return;
  const all = roomsAt(DET.level);
  const catsPresent = [];
  all.forEach(r => { if (!catsPresent.includes(r.cat)) catsPresent.push(r.cat); });
  chips.innerHTML = '';
  const mkChip = (key, lbl) => {
    const c = document.createElement('button');
    c.className = 'chip' + ((DET.filter || 'all') === key ? ' on' : '');
    c.textContent = lbl;
    c.onclick = () => { DET.filter = key === 'all' ? null : key; renderRoomList(); };
    chips.appendChild(c);
  };
  mkChip('all', 'Todas (' + all.length + ')');
  catsPresent.forEach(k => mkChip(k, catOf(k).name));
  $('dCount').textContent = all.length;
  if (!all.length){
    ul.innerHTML = '<li class="dempty">Sin ambientes en este nivel.<br>Elegí una categoría del catálogo (abajo) o la herramienta <b>Estampar ambiente</b> y hacé clic dentro del edificio.</li>';
    return;
  }
  ul.innerHTML = '';
  const shown = all.filter(r => !DET.filter || r.cat === DET.filter);
  if (!shown.length){
    ul.innerHTML = '<li class="dempty">Ningún ambiente coincide con el filtro.</li>';
    return;
  }
  shown.forEach(r => {
    const li = document.createElement('li');
    li.className = 'ditem' + (DET.sel === r.id ? ' sel' : '');
    li.dataset.rid = r.id;
    li.innerHTML = `<span class="zsw" style="background:${roomColor(r)}"></span>
      <span class="zcode">${escapeHtml(r.code || '—')}</span>
      <span class="zname">${escapeHtml(r.name || catOf(r.cat).name)}</span>
      <button class="mini del" title="Eliminar ambiente (⌫)">×</button>`;
    li.onclick = e => {
      const del = e.target.closest('.del');
      if (del){
        e.stopPropagation();
        if (del.dataset.armed){ detailDeleteRoom(r.id); }
        else{
          del.dataset.armed = '1'; del.classList.add('confirm'); del.textContent = '¿borrar?';
          setTimeout(() => { if (del.isConnected){ del.dataset.armed = ''; del.classList.remove('confirm'); del.textContent = '×'; } }, 2600);
        }
        return;
      }
      DET.sel = r.id;
      renderRoomList(); detailRenderProp(); detailRenderCanvas(); dCenterRoom(r);
    };
    ul.appendChild(li);
  });
}
function detailRenderProp(){
  const box = $('dProp'), r = roomById(DET.sel);
  if (!r){ box.style.display = 'none'; box.innerHTML = ''; return; }
  box.style.display = '';
  box.innerHTML = `
    <div class="ed-title"><span class="sw" style="background:${roomColor(r)}"></span><b>${escapeHtml(r.code || '—')}</b></div>
    <div class="field"><label>Nombre del ambiente</label><input id="dpName" type="text" maxlength="60" value="${escapeHtml(r.name || '')}"></div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <div class="field" style="margin:0"><label>Código</label><input id="dpCode" class="code" type="text" maxlength="10" value="${escapeHtml(r.code || '')}"></div>
      <div class="field" style="margin:0;flex:1"><label>Categoría</label><select id="dpCat">${(doc().catalog || []).map(c => `<option value="${c.key}"${c.key === r.cat ? ' selected' : ''}>${escapeHtml(c.name)}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>Color</label>
      <div class="swatches" id="dpSw">
        ${PALETTE.map(c => `<button class="swb${c.toLowerCase() === String(roomColor(r)).toLowerCase() ? ' on' : ''}" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('')}
        <input type="color" id="dpColor" value="${/^#[0-9a-fA-F]{6}$/.test(roomColor(r)) ? roomColor(r) : '#888888'}" title="Color personalizado">
      </div>
    </div>
    <div class="field"><label>Descripción</label><textarea id="dpDesc" maxlength="200" style="min-height:40px">${escapeHtml(r.desc || '')}</textarea></div>
    <div class="ed-btns"><button class="btn danger" id="dpDel">Eliminar ambiente</button></div>
    <div class="meta-row">${r.poly.length} vértices · nivel ${escapeHtml(lvlLabel(bld(), r.level || 0))} · categoría: ${escapeHtml(catOf(r.cat).name)}</div>`;
  $('dpName').addEventListener('input', e => { r.name = e.target.value; save(); renderRoomList(); detailRenderCanvas(); });
  $('dpCode').addEventListener('input', e => {
    r.code = e.target.value.toUpperCase(); save();
    box.querySelector('.ed-title b').textContent = r.code || '—';
    renderRoomList(); detailRenderCanvas();
  });
  $('dpCat').addEventListener('change', e => { pushUndo(); r.cat = e.target.value; save(); detailRenderProp(); renderRoomList(); detailRenderCanvas(); });
  $('dpSw').addEventListener('click', e => {
    const btn = e.target.closest('.swb'); if (!btn) return;
    pushUndo(); r.color = btn.dataset.c; save(); detailRenderProp(); renderRoomList(); detailRenderCanvas();
  });
  $('dpColor').addEventListener('input', e => { r.color = e.target.value; save(); renderRoomList(); detailRenderCanvas(); });
  $('dpDesc').addEventListener('input', e => { r.desc = e.target.value; save(); });
  $('dpDel').onclick = () => detailDeleteRoom(r.id);
}
function renderCatChips(){
  const box = $('dCatBox'); if (!box) return;
  box.innerHTML = '<h4>CATÁLOGO · CLIC = ESTAMPAR</h4>';
  (doc().catalog || []).forEach(c => {
    const b = document.createElement('button');
    b.className = 'dcatg' + (DET.tool === 'stampRoom' && DET.stampCat === c.key ? ' on' : '');
    b.title = 'Estampar ambiente «' + c.name + '» — clic de nuevo para volver a Seleccionar';
    b.appendChild(iconEl(c.icon, 15, 'currentColor'));
    const nm = document.createElement('span');
    nm.textContent = c.name;
    nm.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    b.appendChild(nm);
    const sw = document.createElement('span');
    sw.style.cssText = `width:11px;height:11px;background:${c.color};border:1px solid rgba(20,22,16,.4);flex:none`;
    b.appendChild(sw);
    b.onclick = () => {
      if (DET.tool === 'stampRoom' && DET.stampCat === c.key) setDetailTool('select');
      else { DET.stampCat = c.key; setDetailTool('stampRoom'); }
    };
    box.appendChild(b);
  });
}

/* ---- entrar / salir / herramientas ---- */
function openDetail(id){
  const b = itemById(id);
  if (!b || (b.kind !== 'bldg' && b.kind !== 'aud')) return;
  cancelDrawing(); ttHide(); setHint('');
  DET.open = true; DET.bId = id;
  DET.level = clamp(DET.level || 0, 0, Math.max(1, Math.round(+b.nLevels || 1)) - 1);
  DET.sel = null; DET.filter = null; DET.burst = false; dHover = null; dGhostP = null;
  detailWrap.classList.add('on');
  setDetailTool('select');
  requestAnimationFrame(detailFit);
}
function closeDetail(){
  DET.open = false; DET.sel = null; dDrag = null; dHover = null; dGhostP = null; DET.drawing = null;
  detailWrap.classList.remove('on');
  dsvg.classList.remove('panning', 'stamping');
  renderHandles(); setHint(HINTS[state.tool] || '');
}
function setDetailTool(tool){
  DET.tool = tool; DET.burst = false; DET.drawing = null;
  if (tool === 'stampRoom' && !DET.stampCat) DET.stampCat = (doc().catalog[0] || {key:'otro'}).key;
  dsvg.classList.toggle('stamping', tool === 'stampRoom' || tool === 'cut' || tool === 'draw');
  detailRenderHead(); detailRenderSide(); detailRenderCanvas(); setDetailHint();
}
function setDetailHint(){
  const h = $('dHint');
  if (!DET.open){ h.classList.remove('on'); return; }
  if (DET.tool === 'stampRoom'){
    const c = catOf(DET.stampCat);
    h.innerHTML = `Estampando <b>&nbsp;${escapeHtml(c.name)}&nbsp;</b> — clic dentro del edificio · <kbd>ESC</kbd> terminar`;
  } else if (DET.tool === 'cut'){
    h.innerHTML = `Cortar: arrastrá una línea — divide <b>&nbsp;todos&nbsp;</b> los ambientes que cruce · <kbd>SHIFT</kbd> rectas de 45° · <kbd>ESC</kbd> terminar`;
  } else if (DET.tool === 'draw'){
    h.innerHTML = `Dibujar ambiente: <kbd>clic</kbd> añade vértices · <kbd>ENTER</kbd>/<kbd>doble clic</kbd> cierra · <kbd>⌫</kbd> quita el último · <kbd>ESC</kbd> cancela`;
  } else {
    h.innerHTML = `Clic: seleccionar · arrastrar: mover · manijas laterales: ancho/alto · <b>R</b>: rotar · ◇ añade vértice · <kbd>ALT</kbd> + clic: elimina · <kbd>ESC</kbd> volver al campus`;
  }
  h.classList.add('on');
}
function detailRenderAll(){
  if (!DET.open) return;
  detailRenderHead(); detailRenderSide(); detailRenderCanvas(); setDetailHint();
}
function detailRefreshAfterCatalog(){
  if (!DET.open) return;
  renderCatChips(); renderRoomList(); detailRenderProp(); detailRenderCanvas();
}
function detailStamp(p){
  const b = bld();
  if (!b || DET.tool !== 'stampRoom') return;
  if (!pointInPoly(p.x, p.y, b.poly)) return;
  const gx = grid(p.x), gy = grid(p.y);
  const poly = clipPolyRect(b.poly, {x: gx - 32, y: gy - 24, w: 64, h: 48});

function applyDetailGrid(rows, cols, catKey, scope, keepExisting){
  const b = bld(); if (!b) return;
  const cat = catOf(catKey);
  const target = scope === 'room' ? roomById(DET.sel) : null;
  if (scope === 'room' && !target){ toast('Primero seleccioná un ambiente.', 'warn'); return; }
  pushUndo();
  if (!Array.isArray(b.rooms)) b.rooms = [];
  const mk = poly => {
    const r = {id: uid(), level: DET.level, cat: cat.key, code: nextRoomCode(b), name: cat.name, color: cat.color, desc:'', poly};
    b.rooms.push(r);
    return r;
  };
  const cells = poly => {
    const bb = polyBBox(poly), cw = bb.w / cols, ch = bb.h / rows, out = [];
    for (let ry = 0; ry < rows; ry++)
      for (let cx = 0; cx < cols; cx++){
        const piece = cleanPoly(clipPolyRect(poly, {x: bb.x + cx*cw, y: bb.y + ry*ch, w: cw, h: ch}));
        if (piece.length >= 3 && polyArea(piece) >= 12) out.push(piece);
      }
    return out;
  };
  let created = 0;
  if (target){
    const pieces = cells(target.poly);
    if (pieces.length){
      const i = b.rooms.indexOf(target);
      if (i >= 0) b.rooms.splice(i, 1);
      pieces.forEach(mk); created = pieces.length;
    }
  } else {
    if (!keepExisting) b.rooms = b.rooms.filter(r => (r.level || 0) !== DET.level);
    cells(b.poly).forEach(p => { mk(p); created++; });
  }
  DET.sel = null;
  setDetailTool('select');
  bldgChipRefresh(b); save();
  toast(created ? `Grid creado: ${created} ambientes.` : 'El grid no produjo ambientes: celdas demasiado chicas.', created ? 'ok' : 'warn');
}

   T3b · CORTAR (línea libre que divide todos los ambientes cruzados)
===================================================================== */
function drawCutPreview(){
  dRoot.querySelectorAll('.dcutline').forEach(n => n.remove());
  if (!DET.open || !dDrag || dDrag.type !== 'dcut') return;
  const u = 1/DET.view.k;
  const g = el('g', {class:'dcutline'}, dRoot);
  el('line', {x1:dDrag.a.x.toFixed(1), y1:dDrag.a.y.toFixed(1), x2:dDrag.b.x.toFixed(1), y2:dDrag.b.y.toFixed(1),
    stroke:'#B04A26', 'stroke-width':(2.2*u).toFixed(2), 'stroke-dasharray':(9*u).toFixed(1) + ' ' + (6*u).toFixed(1),
    'stroke-linecap':'round'}, g);
  [dDrag.a, dDrag.b].forEach(p =>
    el('circle', {cx:p.x.toFixed(1), cy:p.y.toFixed(1), r:(3.5*u).toFixed(2), fill:'#F8F4E7', stroke:'#B04A26', 'stroke-width':(1.6*u).toFixed(2)}, g));
}
function doDetailCut(a, b2){
  const b = bld(); if (!b) return;
  const dx = b2.x - a.x, dy = b2.y - a.y, L2 = dx*dx + dy*dy;
  if (L2 < 4) return;
  const jobs = [];
  for (const r of roomsAt(DET.level).slice()){
    const sides = r.poly.map(p => dx*(p.y - a.y) - dy*(p.x - a.x));
    if (!sides.some(s => s > .01) || !sides.some(s => s < -.01)) continue;
    const ts = [];
    for (let i = 0; i < r.poly.length; i++){
      const s1 = sides[i], s2 = sides[(i + 1) % r.poly.length];
      if (!s1 || !s2 || (s1 > 0) === (s2 > 0)) continue;
      const p1 = r.poly[i], p2 = r.poly[(i + 1) % r.poly.length];
      const t = s1 / (s1 - s2);
      const ix = p1.x + (p2.x - p1.x)*t, iy = p1.y + (p2.y - p1.y)*t;
      ts.push(((ix - a.x)*dx + (iy - a.y)*dy) / L2);
    }
    ts.sort((p, q) => p - q);
    /* el segmento toca el polígono si el intervalo que la línea recorre
       dentro de él se superpone con [0,1] (admite puntas adentro) */
    if (ts.length < 2 || ts[0] > 1.002 || ts[ts.length - 1] < -.002) continue;
    const pieces = [cleanPoly(clipPolyHalfPlane(r.poly, a, b2, false)), cleanPoly(clipPolyHalfPlane(r.poly, a, b2, true))]
      .filter(p => p.length >= 3 && polyArea(p) >= 12);
    if (pieces.length >= 2) jobs.push({r, pieces});
  }
  if (!jobs.length){ toast('La línea no cruza ningún ambiente.', 'warn'); return; }
  pushUndo();
  if (!Array.isArray(b.rooms)) b.rooms = [];
  let count = 0;
  for (const j of jobs){
    const i = b.rooms.indexOf(j.r);
    if (i >= 0) b.rooms.splice(i, 1);
    const base = String(j.r.name || catOf(j.r.cat).name).replace(/\s+[AB]$/, '');
    j.pieces.forEach((p, k) => {
      b.rooms.push({id: uid(), level: DET.level, cat: j.r.cat, code: nextRoomCode(b),
        name: base + ' ' + (k === 0 ? 'A' : 'B'), color: j.r.color || catOf(j.r.cat).color, desc: j.r.desc || '', poly: p});
      count++;
    });
  }
  if (DET.sel && !roomById(DET.sel)) DET.sel = null;
  save(); renderRoomList(); detailRenderProp(); detailRenderCanvas(); bldgChipRefresh(b);
  toast(`${count} ambiente${count === 1 ? '' : 's'} dividido${count === 1 ? '' : 's'}.`);
}

function drawDrawPreview(cursorP){

      stroke:'#B04A26', 'stroke-width':(1.6*u).toFixed(2)}, g));

function dAddVertex(p){
  if (!DET.drawing) DET.drawing = [];
  const q = {x: grid(p.x), y: grid(p.y)};
  const last = DET.drawing[DET.drawing.length - 1];
  if (last && Math.hypot(q.x - last.x, q.y - last.y) < 2){ detailCloseDraw(); return; }  /* doble clic */
  if (DET.drawing.length >= 3){
    const f = DET.drawing[0];
    if (Math.hypot(q.x - f.x, q.y - f.y) < 14/DET.view.k){ detailCloseDraw(); return; }
  }
  DET.drawing.push(q);
  detailRenderCanvas();
  dGhostSchedule(q);
}
function detailCloseDraw(){
  if (!DET.drawing) return;
  const b = bld();
  const pts0 = DET.drawing; DET.drawing = null;
  if (pts0.length >= 2){
    const a = pts0[pts0.length - 1], c = pts0[pts0.length - 2];
    if (Math.hypot(a.x - c.x, a.y - c.y) < 3) pts0.pop();
  }
  dRoot.querySelectorAll('.dghost').forEach(n => n.remove());
  if (!b){ detailRenderCanvas(); return; }
  if (pts0.length < 3){ toast('Se necesitan al menos 3 vértices.', 'warn'); detailRenderCanvas(); return; }
  let pts = cleanPoly(pts0, .5);
  if (pts.length < 3) pts = pts0;
  if (isConvexPoly(b.poly)){
    const clipped = cleanPoly(clipPolyPoly(pts, b.poly), .5);
    if (clipped.length >= 3 && polyArea(clipped) > 1) pts = clipped;
    else { toast('El ambiente quedó fuera del edificio.', 'warn'); detailRenderCanvas(); return; }
  }
  openDrawRoomModal(pts);
}

  if (detailWrap.dataset.wired) return;

  $('dBack').onclick = closeDetail;
  $('dToolSelect').onclick = () => setDetailTool('select');
  $('dToolStamp').onclick = () => setDetailTool('stampRoom');
  $('dToolGrid').onclick = openGridModal;
  $('dToolCut').onclick = () => setDetailTool('cut');
  $('dToolDraw').onclick = () => setDetailTool('draw');
  $('dToolIso').onclick = () => openIsoModal(DET.bId);
  $('dCatBtn').onclick = openCatalogModal;
  $('dByType').onchange = e => { DET.byType = e.target.checked; detailRenderCanvas(); };
  $('dZoomIn').onclick  = () => { const r = dsvg.getBoundingClientRect(); dZoomAt(r.width/2, r.height/2, 1.3); };
  $('dZoomOut').onclick = () => { const r = dsvg.getBoundingClientRect(); dZoomAt(r.width/2, r.height/2, 1/1.3); };
  $('dFit').onclick = detailFit;

  dsvg.addEventListener('contextmenu', e => e.preventDefault());
  dsvg.addEventListener('pointerdown', e => {
    try{
      if (!DET.open) return;
      if (e.button === 2 || e.button === 1){
        dDrag = {type:'dpan', sx:e.clientX, sy:e.clientY, tx0:DET.view.tx, ty0:DET.view.ty};
        dsvg.classList.add('panning');
        return;
      }
      if (e.button !== 0) return;
      e.preventDefault();
      const t = e.target, p = dPt(e);
      if (DET.tool === 'stampRoom'){ detailStamp(p); return; }
      if (DET.tool === 'cut'){
        const a = {x: grid(p.x), y: grid(p.y)};
        dDrag = {type:'dcut', a, b:a};
        drawCutPreview();
        return;
      }
      if (DET.tool === 'draw'){ dAddVertex(p); return; }
      const dv = t.getAttribute && t.getAttribute('data-dv');
      if (dv !== null && dv !== undefined && !isNaN(+dv)){
        const r = roomById(DET.sel);
        if (e.altKey){ detailDeleteVertex(r, +dv); return; }
        if (r) dDrag = {type:'dvertex', r, idx:+dv, snap:snapshot(), moved:false};
        return;
      }
      const dmid = t.getAttribute && t.getAttribute('data-dmid');
      if (dmid !== null && dmid !== undefined && !isNaN(+dmid)){
        const r = roomById(DET.sel);
        if (r){
          const snap = snapshot(), i = +dmid, a = r.poly[i], b = r.poly[(i + 1) % r.poly.length];
          r.poly.splice(i + 1, 0, {x:grid((a.x + b.x) / 2), y:grid((a.y + b.y) / 2)});
          dDrag = {type:'dvertex', r, idx:i + 1, snap, moved:true};
          dSchedule();
        }
        return;
      }
      const dsc = t.getAttribute && t.getAttribute('data-dsc');
      if (dsc){
        const r = roomById(DET.sel);
        if (r) dDrag = {type:'dscale', r, key:dsc, orig:r.poly.map(q => ({...q})), snap:snapshot(), moved:false};
        return;
      }
      if (t.getAttribute && t.getAttribute('data-drot')){
        const r = roomById(DET.sel);
        if (r){
          const c = polyCentroid(r.poly);
          dDrag = {type:'drot', r, c, a0:Math.atan2(p.y-c.y, p.x-c.x), orig:r.poly.map(q => ({...q})), snap:snapshot(), moved:false};
        }
        return;
      }
      const rg = t.closest ? t.closest('[data-rid]') : null;
      if (rg){
        const r = roomById(rg.getAttribute('data-rid'));
        if (r){
          if (DET.sel !== r.id){ DET.sel = r.id; renderRoomList(); detailRenderProp(); detailRenderCanvas(); }
          dDrag = {type:'dmove', r, start:p, orig:r.poly.map(q => ({...q})), snap:snapshot(), moved:false};
        }
        return;
      }
      if (DET.sel){ DET.sel = null; renderRoomList(); detailRenderProp(); detailRenderCanvas(); }
      dDrag = {type:'dpan', sx:e.clientX, sy:e.clientY, tx0:DET.view.tx, ty0:DET.view.ty};
      dsvg.classList.add('panning');
    }catch(err){ fail('detalle (clic)', err); dDrag = null; dsvg.classList.remove('panning'); }
  });
  dsvg.addEventListener('pointermove', e => {
    if (!DET.open || dDrag) return;
    const t = e.target;
    const rg = t.closest ? t.closest('[data-rid]') : null;
    const id = rg ? rg.getAttribute('data-rid') : null;
    if (id !== dHover){
      dHover = id;
      dRoot.querySelectorAll('g[data-rid]').forEach(g => {
        const pth = g.querySelector('path'); if (!pth) return;
        const rid = g.getAttribute('data-rid'), sel = rid === DET.sel, hov = rid === dHover;
        pth.setAttribute('stroke', sel || hov ? '#B04A26' : '#24271D');
        pth.setAttribute('stroke-width', sel ? 2.5 : hov ? 2 : 1.4);
        pth.setAttribute('fill-opacity', sel ? .55 : .45);
      });
    }
    if (DET.tool === 'stampRoom' || DET.tool === 'draw') dGhostSchedule(dPt(e));
  });
  dsvg.addEventListener('pointerleave', () => {
    dGhostP = null;
    dRoot.querySelectorAll('.dghost').forEach(n => n.remove());
    if (dHover){ dHover = null; detailRenderCanvas(); }
  });
  dsvg.addEventListener('wheel', e => {
    if (!DET.open) return;
    e.preventDefault();
    const rc = dsvg.getBoundingClientRect();
    dZoomAt(e.clientX - rc.left, e.clientY - rc.top, Math.pow(1.0016, -e.deltaY));
  }, {passive:false});
  dsvg.addEventListener('dblclick', e => {
    if (DET.open && DET.tool === 'draw'){ e.preventDefault(); detailCloseDraw(); }
    else if (DET.open && DET.tool === 'select'){
      const dv = e.target.getAttribute && e.target.getAttribute('data-dv');
      if (dv !== null && dv !== undefined && !isNaN(+dv)){
        e.preventDefault(); detailDeleteVertex(roomById(DET.sel), +dv);
      }
    }
  });

  window.addEventListener('pointermove', e => {
    if (!DET.open || !dDrag) return;
    try{
      if (dDrag.type === 'dpan'){
        DET.view.tx = dDrag.tx0 + (e.clientX - dDrag.sx);
        DET.view.ty = dDrag.ty0 + (e.clientY - dDrag.sy);
        dApplyView();
      }
      else if (dDrag.type === 'dcut'){
        dDrag.b = cutSnap(dDrag.a, dPt(e), e.shiftKey);
        drawCutPreview();
      }
      else if (dDrag.type === 'dmove'){
        const p = dPt(e);
        let dx = p.x - dDrag.start.x, dy = p.y - dDrag.start.y;
        if (doc().snap){ dx = Math.round(dx/10)*10; dy = Math.round(dy/10)*10; }
        if (!dDrag.moved && Math.abs(dx) < 1 && Math.abs(dy) < 1) return;
        dDrag.moved = true;
        dDrag.r.poly = dDrag.orig.map(q => ({x: q.x + dx, y: q.y + dy}));
        dSchedule();
      }
      else if (dDrag.type === 'dvertex'){
        const p = dPt(e);
        dDrag.r.poly[dDrag.idx] = {x: grid(p.x), y: grid(p.y)};
        dDrag.moved = true;
        dSchedule();
      }
      else if (dDrag.type === 'dscale'){
        const p = dPt(e), o = polyBBox(dDrag.orig), key = dDrag.key;
        let x0 = o.x, x1 = o.x + o.w, y0 = o.y, y1 = o.y + o.h;
        if (key.includes('w')) x0 = Math.min(p.x, x1 - 20);
        if (key.includes('e')) x1 = Math.max(p.x, x0 + 20);
        if (key.includes('n')) y0 = Math.min(p.y, y1 - 20);
        if (key.includes('s')) y1 = Math.max(p.y, y0 + 20);
        const ax = key.includes('w') ? x1 : key.includes('e') ? x0 : o.x + o.w / 2;
        const ay = key.includes('n') ? y1 : key.includes('s') ? y0 : o.y + o.h / 2;
        const sx = (x1 - x0) / o.w, sy = (y1 - y0) / o.h;
        dDrag.r.poly = dDrag.orig.map(q => ({x: ax + (q.x - ax)*sx, y: ay + (q.y - ay)*sy}));
        dDrag.moved = true;
        dSchedule();
      }
      else if (dDrag.type === 'drot'){
        const p = dPt(e);
        let deg = (Math.atan2(p.y-dDrag.c.y, p.x-dDrag.c.x) - dDrag.a0) * 180 / Math.PI;
        if (e.shiftKey) deg = Math.round(deg / 15) * 15;
        dDrag.r.poly = dDrag.orig.map(q => rotatePoint(q, dDrag.c, deg));
        dDrag.moved = true;
        dSchedule();
      }
    }catch(err){ fail('detalle (movimiento)', err); }
  });
  window.addEventListener('pointerup', () => {
    if (!DET.open || !dDrag) return;
    try{
      const wasDrag = dDrag;
      dDrag = null;
      if (wasDrag.type === 'dpan'){ dsvg.classList.remove('panning'); return; }
      if (wasDrag.type === 'dcut'){
        dRoot.querySelectorAll('.dcutline').forEach(n => n.remove());
        if (Math.hypot(wasDrag.b.x - wasDrag.a.x, wasDrag.b.y - wasDrag.a.y) >= 3) doDetailCut(wasDrag.a, wasDrag.b);
        return;
      }
      if (wasDrag.moved){ pushUndoAt(wasDrag.snap); save(); renderRoomList(); detailRenderProp(); }
      detailRenderCanvas();
    }catch(err){ fail('detalle (soltar)', err); dDrag = null; }
  });
  window.addEventListener('resize', () => { if (DET.open) detailFit(); });
}

/* =====================================================================
   T4 · VISTA 3D ISOMÉTRICA APILADA (vista explotada de pisos)
   buildIsoSVG() es PURA: no muta estado y devuelve un nodo SVG detached
   (mismo patrón que buildExportSVG), sirve en la modal in-app y serializada
   a canvas para el PDF (T5 la reutiliza con opts.forExport).
===================================================================== */
const ISO = {angle:35, gapMul:1, bId:null};   /* estado transitorio de la modal (no se persiste) */

function buildIsoSVG(b, opts){
  opts = opts || {};
  const W = Math.round(+opts.W || 1000), H = Math.round(+opts.H || 640);
  const forExport = !!opts.forExport;
  const showLabels = opts.showLabels !== false;
  const ang = ((Math.round(+opts.angle || 0) % 360) + 360) % 360;
  const gapMul = clamp(+opts.gapMul || 1, .3, 3);
  const root = document.createElementNS(NS, 'svg');
  root.setAttribute('xmlns', NS);
  root.setAttribute('viewBox', `0 0 ${W} ${H}`);
  root.setAttribute('width', W); root.setAttribute('height', H);
  root.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  if (!b || !Array.isArray(b.poly) || b.poly.length < 3) return root;

  const st = document.createElementNS(NS, 'style');
  st.textContent = ".ft-s{font-family:'Archivo','Trebuchet MS',sans-serif}.ft-m{font-family:'IBM Plex Mono','Courier New',monospace}";
  root.appendChild(st);

  /* fondo papel para el PDF (trama de puntos propia: serializable standalone) */
  if (forExport){
    const defs = el('defs', {}, root);
    const pat = el('pattern', {id:'isoDots', width:14, height:14, patternUnits:'userSpaceOnUse'}, defs);
    el('circle', {cx:1.4, cy:1.4, r:.9, fill:'#D8D2BC'}, pat);
    el('rect', {x:0, y:0, width:W, height:H, fill:'#F2EDDF'}, root);
    el('rect', {x:0, y:0, width:W, height:H, fill:'url(#isoDots)'}, root);
  }

  const nL = clamp(Math.round(+b.nLevels || 1), 1, 20);
  const rooms = Array.isArray(b.rooms) ? b.rooms : [];
  const bb = polyBBox(b.poly);
  const cx = bb.x + bb.w/2, cy = bb.y + bb.h/2;
  const base = Math.max(bb.w, bb.h, 80);
  const slabH = clamp(base * .04, 6, 18);                  /* espesor de la losa */
  let gap = clamp(base * .15, 26, 64);                     /* aire entre losas (relativo al tamaño) */
  if (+opts.gap > 0) gap = +opts.gap;                      /* override absoluto opcional */
  gap *= gapMul;
  const rad = ang * Math.PI / 180, cA = Math.cos(rad), sA = Math.sin(rad);
  const rotP = p => ({x: cA*(p.x-cx) - sA*(p.y-cy), y: sA*(p.x-cx) + cA*(p.y-cy)});
  const C30 = Math.cos(Math.PI/6), S30 = .5;
  const zTop = i => i * (slabH + gap);                     /* cara superior del nivel i (0 = PB) */
  const PX = rp => (rp.x - rp.y) * C30;
  const PY = (rp, z) => (rp.x + rp.y) * S30 - z;

  const bldRot = b.poly.map(rotP);
  const roomRots = rooms.map(r => Array.isArray(r.poly) ? r.poly.map(rotP) : []);
  /* esquinas del bbox local del edificio, rotadas (conectores verticales) */
  const cornersL = [{x:bb.x,y:bb.y},{x:bb.x+bb.w,y:bb.y},{x:bb.x+bb.w,y:bb.y+bb.h},{x:bb.x,y:bb.y+bb.h}].map(rotP);

  /* --- bbox PROYECTADA exacta del contenido (T6): X=(x−y)·cos30 y suma (x+y) pre-z ---
     (antes se estimaba con extremos rotados sin proyectar: sobreestimaba el alto en
     plantas alargadas y dejaba el dibujo chico; ahora el fit es exacto) --- */
  let x0=1e9, x1=-1e9, s0=1e9, s1=-1e9;
  const acc = q => {
    const X = (q.x - q.y) * C30, S = q.x + q.y;
    if (X < x0) x0 = X; if (X > x1) x1 = X;
    if (S < s0) s0 = S; if (S > s1) s1 = S;
  };
  bldRot.forEach(acc);
  cornersL.forEach(acc);
  roomRots.forEach(rp => rp.forEach(acc));
  const zTopMax = zTop(nL - 1);
  const gy0 = s0 * S30 - zTopMax, gy1 = s1 * S30 + slabH;   /* techo más alto + faldón inferior */
  const bw = Math.max(x1 - x0, 1), bh = Math.max(gy1 - gy0, 1);
  const lvlMidY = i => (s0 + s1) * S30 / 2 - zTop(i);

  /* --- auto-fit: banda de título arriba + margen de etiquetas a la derecha ---
     márgenes justos (26px) para que el dibujo aproveche ~90% del lienzo --- */
  const pad = 26, titleBand = 48;
  let labW = 0;
  if (showLabels && !(nL === 1 && !rooms.length))
    for (let i = 0; i < nL; i++) labW = Math.max(labW, lvlLabel(b, i).length * 7.8 + 24);
  const availW = W - pad*2 - labW, availH = H - pad*2 - titleBand;
  const k = Math.max(Math.min(availW / bw, availH / bh), .02);
  const tx = pad + (availW - bw*k)/2 - x0*k;
  const ty = pad + titleBand + (availH - bh*k)/2 - gy0*k;
  const g = el('g', {transform:`translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${k.toFixed(4)})`}, root);
  const u = px => +(px / k).toFixed(3);                    /* px de pantalla → unidades de mundo */
  const sx = wx => (wx - tx) / k;                          /* pantalla → mundo (título) */
  const sy = wy => (wy - ty) / k;
  const INK = '#24271D';

  /* --- conectores discontinuos entre losas (efecto explotado) --- */
  if (nL > 1){
    const cg = el('g', {stroke:'rgba(36,39,29,.35)', 'stroke-width':u(1.2), 'stroke-dasharray':`${u(5)} ${u(4)}`}, g);
    cornersL.forEach(q => {
      const X = PX(q).toFixed(2);
      for (let i = 0; i < nL - 1; i++)
        el('line', {x1:X, y1:PY(q, zTop(i)).toFixed(2), x2:X, y2:PY(q, zTop(i+1)).toFixed(2)}, cg);
    });
  }

  /* --- losas de abajo hacia arriba (PB primero) --- */
  for (let i = 0; i < nL; i++){
    const z = zTop(i);
    /* faldón: solo caras frontales visibles (normal exterior hacia la cámara);
       2 tonos: cara "izquierda" (luz) más clara, cara "derecha" más oscura */
    const skirt = el('g', {stroke:'rgba(36,39,29,.55)', 'stroke-width':u(1), 'stroke-linejoin':'round'}, g);
    for (let e = 0; e < bldRot.length; e++){
      const p = bldRot[e], q = bldRot[(e+1)%bldRot.length];
      let nx = q.y - p.y, ny = -(q.x - p.x);
      if (nx*((p.x+q.x)/2) + ny*((p.y+q.y)/2) < 0){ nx = -nx; ny = -ny; }  /* normal hacia afuera */
      if (nx + ny <= .01) continue;                                        /* cara trasera: oculta */
      const dark = (nx - ny) > 0;
      const ax = PX(p), ay = PY(p, z), bx2 = PX(q), by2 = PY(q, z);
      el('path', {d:`M${ax.toFixed(2)} ${ay.toFixed(2)}L${bx2.toFixed(2)} ${by2.toFixed(2)}` +
        `L${bx2.toFixed(2)} ${(by2 + slabH).toFixed(2)}L${ax.toFixed(2)} ${(ay + slabH).toFixed(2)}Z`,
        fill: dark ? 'rgba(36,39,29,.45)' : 'rgba(36,39,29,.26)'}, skirt);
    }
    /* cara superior de la losa */
    el('path', {d:'M' + bldRot.map(p => PX(p).toFixed(2) + ' ' + PY(p, z).toFixed(2)).join('L') + 'Z',
      fill:'#F8F4E7', stroke:INK, 'stroke-width':u(2), 'stroke-linejoin':'round'}, g);

    /* ambientes del nivel proyectados sobre la cara superior */
    rooms.forEach((r, ri) => {
      if ((r.level || 0) !== i || roomRots[ri].length < 3) return;
      const pts = roomRots[ri].map(p => ({x:PX(p), y:PY(p, z)}));
      el('path', {d:'M' + pts.map(p => p.x.toFixed(2) + ' ' + p.y.toFixed(2)).join('L') + 'Z',
        fill:r.color || catOf(r.cat).color || '#8F8A74', 'fill-opacity':.55,
        stroke:INK, 'stroke-width':u(1), 'stroke-linejoin':'round'}, g);
      let mx0=1e9, mx1=-1e9, my0=1e9, my1=-1e9;
      pts.forEach(p => { if(p.x<mx0)mx0=p.x; if(p.x>mx1)mx1=p.x; if(p.y<my0)my0=p.y; if(p.y>my1)my1=p.y; });
      const wPx = Math.max(mx1 - mx0, my1 - my0) * k;
      const c = polyCentroid(pts);
      if (wPx >= 60) roomIcon(g, (catOf(r.cat) || {}).icon || 'otro', c.x - u(7), c.y - u(18), u(14), INK);
      if (wPx >= 34 && r.code)
        txt(g, String(r.code), {x:c.x.toFixed(1), y:(c.y + u(9)).toFixed(1), class:'ft-m', 'font-weight':700,
          'font-size':u(10.5), fill:INK, 'text-anchor':'middle', stroke:'#F8F4E7', 'stroke-width':u(3),
          'paint-order':'stroke', 'stroke-linejoin':'round'});
    });

    if (nL === 1 && !rooms.length)
      txt(g, 'Sin ambientes dibujados', {x:((x0 + x1)/2).toFixed(1), y:(((s0 + s1) * S30 / 2) + u(4)).toFixed(1),
        class:'ft-m', 'font-size':u(12), fill:'#565A4A', 'text-anchor':'middle', 'letter-spacing':u(.5)});
  }

  /* --- etiquetas de nivel a la derecha de cada losa --- */
  if (showLabels && !(nL === 1 && !rooms.length)){
    const lg = el('g', {}, g);
    for (let i = 0; i < nL; i++){
      const y = lvlMidY(i);
      el('line', {x1:(x1 + u(5)).toFixed(2), y1:y.toFixed(2), x2:(x1 + u(12)).toFixed(2), y2:y.toFixed(2),
        stroke:'rgba(36,39,29,.4)', 'stroke-width':u(1)}, lg);
      txt(lg, lvlLabel(b, i), {x:(x1 + u(16)).toFixed(2), y:(y + u(4.5)).toFixed(2), class:'ft-m',
        'font-weight':700, 'font-size':u(13), fill:INK});
    }
  }

  /* --- título arriba-izquierda: nombre + chip sigla + "×N niveles" --- */
  const nm = String(b.name || 'Edificio');
  txt(g, nm.length > 30 ? nm.slice(0, 29) + '…' : nm, {x:sx(24).toFixed(2), y:sy(32).toFixed(2),
    class:'ft-s', 'font-weight':800, 'font-size':u(19), fill:INK});
  const chipW = (String(b.code || 'ED').length * 7.6 + 14);
  const chipX = sx(24) + Math.min(nm.length, 30) * 10.8 + 12;
  el('rect', {x:chipX.toFixed(2), y:sy(18).toFixed(2), width:u(chipW).toFixed(2), height:u(20).toFixed(2), fill:INK}, g);
  txt(g, String(b.code || 'ED'), {x:(chipX + u(chipW/2)).toFixed(2), y:sy(32.5).toFixed(2), class:'ft-m',
    'font-weight':700, 'font-size':u(11.5), fill:'#F2EDDF', 'text-anchor':'middle', 'letter-spacing':u(1)});
  txt(g, `×${nL} nivel${nL > 1 ? 'es' : ''} · ${rooms.length} ambiente${rooms.length === 1 ? '' : 's'}`,
    {x:sx(24).toFixed(2), y:sy(52).toFixed(2), class:'ft-m', 'font-size':u(11), fill:'#565A4A', 'letter-spacing':u(.5)});
  return root;
}

/* =====================================================================
   T5 · GENERADOR DEL PLANO INTERIOR DE UN NIVEL (patrón buildIsoSVG:
   SVG detached, auto-fit y listo para serializar a canvas en el PDF)
===================================================================== */
let lvlPlanSeq = 0;
function buildLevelPlanSVG(b, level, opts){
  opts = opts || {};
  const W = Math.round(+opts.W || 1600), H = Math.round(+opts.H || 1000);
  const forExport = !!opts.forExport;
  const root = document.createElementNS(NS, 'svg');
  root.setAttribute('xmlns', NS);
  root.setAttribute('viewBox', `0 0 ${W} ${H}`);
  root.setAttribute('width', W); root.setAttribute('height', H);
  root.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  if (!b || !Array.isArray(b.poly) || b.poly.length < 3) return root;

  const st = document.createElementNS(NS, 'style');
  st.textContent = ".ft-s{font-family:'Archivo','Trebuchet MS',sans-serif}.ft-m{font-family:'IBM Plex Mono','Courier New',monospace}";
  root.appendChild(st);

  const INK = '#24271D', INK2 = '#565A4A', FILL = '#F8F4E7';
  /* fondo papel + borde de hoja fino para el PDF (patrón propio, serializable) */
  if (forExport){
    const defs = el('defs', {}, root);
    const pat = el('pattern', {id:'lvlDots', width:14, height:14, patternUnits:'userSpaceOnUse'}, defs);
    el('circle', {cx:1.4, cy:1.4, r:.9, fill:'#D8D2BC'}, pat);
    el('rect', {x:0, y:0, width:W, height:H, fill:'#F2EDDF'}, root);
    el('rect', {x:0, y:0, width:W, height:H, fill:'url(#lvlDots)'}, root);
    el('rect', {x:12, y:12, width:W-24, height:H-24, fill:'none', stroke:'rgba(36,39,29,.5)', 'stroke-width':1.4}, root);
    el('rect', {x:18, y:18, width:W-36, height:H-36, fill:'none', stroke:'rgba(36,39,29,.25)', 'stroke-width':.8}, root);
  }

  const nL = clamp(Math.round(+b.nLevels || 1), 1, 20);
  level = clamp(Math.round(+level || 0), 0, nL - 1);
  const rooms = (Array.isArray(b.rooms) ? b.rooms : [])
    .filter(r => (r.level || 0) === level && Array.isArray(r.poly) && r.poly.length >= 3);

  /* ---- leyenda inferior: chips de las categorías presentes en el nivel (máx 2 filas) ---- */
  const pad = 60, titleBand = 64, chipGap = 10;
  const present = [];
  rooms.forEach(r => { if (!present.some(c => c.key === r.cat)) present.push(catOf(r.cat)); });
  present.sort((a, c) =>
    doc().catalog.findIndex(x => x.key === a.key) - doc().catalog.findIndex(x => x.key === c.key));
  const chipOf = c => {
    const code = String(c.code || '—');
    const name = String(c.name || '').slice(0, 24);
    return {c, code, name, w: 56 + code.length * 7.6 + name.length * 7};
  };
  const maxLegW = W - pad*2 - 20;
  const legRows = [[]];
  let legOverflow = 0;
  present.forEach(cat => {
    const ch = chipOf(cat);
    const row = legRows[legRows.length - 1];
    const cur = row.reduce((s, x) => s + x.w + chipGap, 0);
    if (row.length && cur + ch.w > maxLegW){
      if (legRows.length >= 2){ legOverflow++; return; }
      legRows.push([ch]);
    } else row.push(ch);
  });

  /* ---- auto-fit del edificio: título arriba + leyenda abajo + padding ---- */
  const legH = rooms.length ? legRows.length * 32 : 0;
  const availW = W - pad*2;
  const availH = H - titleBand - legH - 26 - pad;
  const bb = polyBBox(b.poly);
  const k = Math.max(Math.min(availW / Math.max(bb.w, 1), availH / Math.max(bb.h, 1)), .02);
  const tx = (W - bb.w*k)/2 - bb.x*k;
  const ty = titleBand + (availH - bb.h*k)/2 - bb.y*k;
  const g = el('g', {transform:`translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${k.toFixed(4)})`}, root);
  const u = px => +(px / k).toFixed(3);          /* px de pantalla → unidades de mundo */

  /* clip de los ambientes contra el polígono del edificio */
  const cid = 'lvlClip' + (++lvlPlanSeq);
  const defs2 = el('defs', {}, root);
  const cp = el('clipPath', {id: cid}, defs2);
  el('path', {d: polyPath(b.poly)}, cp);

  /* sombra + relleno del edificio (local, sin rotar) */
  el('path', {d: polyPath(b.poly), transform:'translate(7 8)', fill:'rgba(36,39,29,.13)'}, g);
  el('path', {d: polyPath(b.poly), fill: FILL}, g);

  /* ambientes del nivel */
  const rg = el('g', {'clip-path': `url(#${cid})`}, g);
  rooms.forEach(r => {
    const cat = catOf(r.cat), col = r.color || cat.color || '#8F8A74';
    const rb = polyBBox(r.poly);
    el('path', {d: polyPath(r.poly), fill: col, 'fill-opacity': .45, stroke: INK,
      'stroke-width': u(1.4), 'stroke-linejoin':'round'}, rg);
    const wScr = rb.w * k, hScr = rb.h * k;
    if (wScr >= 76 && hScr >= 26){
      /* etiqueta completa: ícono en esquina + código + nombre si cabe */
      const lg = el('g', {transform:`translate(${rb.x.toFixed(1)} ${rb.y.toFixed(1)}) scale(${u(1).toFixed(4)})`}, rg);
      roomIcon(lg, cat.icon, 4, 4, 16, 'rgba(36,39,29,.85)');
      txt(lg, r.code || '', {x:25, y:12.5, class:'ft-m', 'font-weight':700, 'font-size':12.5,
        fill:INK, stroke:'#F4F0E1', 'stroke-width':3, 'paint-order':'stroke', 'stroke-linejoin':'round'});
      if (wScr >= 140 && hScr >= 56 && r.name)
        wrapText(r.name, Math.max(8, Math.floor(wScr/7.2)), 2).forEach((ln, i) =>
          txt(lg, ln, {x:5, y: i ? 44 : 29, class:'ft-s', 'font-weight':600, 'font-size':12,
            fill:'#23261C', stroke:'#F4F0E1', 'stroke-width':3, 'paint-order':'stroke', 'stroke-linejoin':'round'}));
    } else if (wScr >= 36 && r.code){
      const c = polyCentroid(r.poly);
      txt(rg, String(r.code), {x:c.x.toFixed(1), y:(c.y + u(4)).toFixed(1), 'text-anchor':'middle', class:'ft-m',
        'font-weight':700, 'font-size':u(10.5), fill:INK, stroke:'#F8F4E7', 'stroke-width':u(3),
        'paint-order':'stroke', 'stroke-linejoin':'round'});
    }
  });
  if (!rooms.length){
    const c = polyCentroid(b.poly);
    txt(g, 'Nivel sin ambientes', {x:c.x.toFixed(1), y:(c.y + u(4)).toFixed(1), 'text-anchor':'middle',
      class:'ft-m', 'font-size':u(13), fill:INK2, 'letter-spacing':u(.6)});
  }

  /* contorno del edificio por encima de todo */
  el('path', {d: polyPath(b.poly), fill:'none', stroke:INK, 'stroke-width':u(2.5), 'stroke-linejoin':'round'}, g);

  /* ---- título arriba-izquierda: nombre + sigla + nivel ---- */
  const nm = String(b.name || 'Edificio');
  const nmShort = nm.length > 28 ? nm.slice(0, 27) + '…' : nm;
  txt(root, nmShort, {x:24, y:36, class:'ft-s', 'font-weight':800, 'font-size':20, fill:INK});
  const chipW = String(b.code || 'ED').length * 7.6 + 14;
  const chipX = 24 + nmShort.length * 11.2 + 12;
  el('rect', {x:chipX.toFixed(1), y:21, width:chipW.toFixed(1), height:20, fill:INK}, root);
  txt(root, String(b.code || 'ED'), {x:(chipX + chipW/2).toFixed(1), y:35.5, class:'ft-m', 'font-weight':700,
    'font-size':11.5, fill:'#F2EDDF', 'text-anchor':'middle', 'letter-spacing':1});
  txt(root, `NIVEL ${String(lvlLabel(b, level)).toUpperCase()} · ${rooms.length} ambiente${rooms.length === 1 ? '' : 's'}`,
    {x:24, y:58, class:'ft-m', 'font-size':11, fill:INK2, 'letter-spacing':.8});

  /* ---- mini-leyenda abajo ---- */
  if (rooms.length){
    let ly = H - pad - legRows.length*32 + 8;
    legRows.forEach((row, ri) => {
      let x = pad - 6;
      row.forEach(ch => {
        el('rect', {x:x.toFixed(1), y:ly.toFixed(1), width:ch.w.toFixed(1), height:26, rx:3,
          fill:'#F6F2E3', stroke:'rgba(36,39,29,.4)', 'stroke-width':1}, root);
        el('rect', {x:(x+9).toFixed(1), y:(ly+6).toFixed(1), width:14, height:14,
          fill:ch.c.color, stroke:'rgba(20,22,16,.45)', 'stroke-width':1}, root);
        txt(root, ch.code, {x:x+28, y:ly+18, class:'ft-m',
          'font-weight':700, 'font-size':11.5, fill:INK});
        txt(root, ch.name, {x:(x+28+ch.code.length*7.6+6).toFixed(1), y:ly+18,
          class:'ft-m', 'font-size':11.5, fill:INK2});
        x += ch.w + chipGap;
      });
      if (legOverflow && ri === legRows.length - 1)
        txt(root, `+${legOverflow} categoría${legOverflow === 1 ? '' : 's'} más`,
          {x:(x+4).toFixed(1), y:ly+18, class:'ft-m', 'font-size':11.5, fill:INK2});
      ly += 32;
    });
  }
  return root;
}

        </div>
      </div>
      <div class="isoRow">
        <div class="field" style="flex:1;min-width:190px;margin:0">
          <label>Separación de pisos <b id="isoGapV">${ISO.gapMul.toFixed(1).replace('.', ',')}×</b></label>
          <input type="range" id="isoGap" min="0.5" max="2" step="0.1" value="${ISO.gapMul}">
        </div>

          <input type="checkbox" id="isoPdf"${doc().include3D !== false ? ' checked' : ''}> Incluir vistas 3D en el PDF</label>
      </div>
      <div class="m-btns" style="margin-top:8px">

    </div>`);
  $('modalCard').style.width = 'min(1000px, 86vw)';
  renderIso();

    .forEach(ch => ch.classList.toggle('on', +ch.dataset.a === ISO.angle));
  $('isoAngle').addEventListener('input', e => {
    ISO.angle = +e.target.value; $('isoAngV').textContent = ISO.angle + '°';
    markChips(); renderIso();
  });
  $('isoGap').addEventListener('input', e => {
    ISO.gapMul = +e.target.value; $('isoGapV').textContent = ISO.gapMul.toFixed(1).replace('.', ',') + '×';
    renderIso();
  });
  $('isoPresets').addEventListener('click', e => {
    const ch = e.target.closest('.ichip'); if (!ch) return;
    ISO.angle = +ch.dataset.a;
    $('isoAngle').value = ISO.angle; $('isoAngV').textContent = ISO.angle + '°';
    markChips(); renderIso();
  });
  $('isoPdf').onchange = e => {
    doc().include3D = !!e.target.checked; save();
    toast(e.target.checked ? 'Las vistas 3D se incluirán en el PDF.' : 'El PDF se generará sin vistas 3D.');
  };
  $('isoClose').onclick = closeModal;
}
function renderIso(){
  const b = itemById(ISO.bId);
  const stage = $('isoStage');
  if (!b || !stage) return;
  const t0 = performance.now();
  /* T6: el lienzo usa el aspecto REAL del stage (la modal es más ancha que alta:
     con el H fijo 620 el SVG quedaba letterboxed y el dibujo, chico) */
  const sr = stage.getBoundingClientRect();
  const W = 1000;
  const H = clamp(Math.round(W * (sr.height || 470) / Math.max(sr.width || 930, 240)), 380, 860);
  const node = buildIsoSVG(b, {angle: ISO.angle, gapMul: ISO.gapMul, W, H, forExport:false});
  stage.innerHTML = '';
  stage.appendChild(node);
  stage.dataset.ms = String(Math.round(performance.now() - t0));   /* diagnóstico de rendimiento */
}

===================================================================== */
const LS = 'croquis_campus_v4';
const snapshot = () => JSON.stringify({terrain: state.terrain, items: state.items, trees: state.trees, doc: state.doc});
const undoStack = [];
function pushUndoAt(snap){
  if (undoStack[undoStack.length-1] !== snap){ undoStack.push(snap); if (undoStack.length > 40) undoStack.shift(); }
  updateUndoBtn();
}
function pushUndo(){ pushUndoAt(snapshot()); }
function undo(){
  if (!undoStack.length){ toast('No hay cambios que deshacer.', 'warn'); return; }
  const s = JSON.parse(undoStack.pop());
  state.terrain = s.terrain; state.items = s.items; state.trees = s.trees; state.doc = s.doc;
  state.sel = state.sel && (state.sel === '__terrain' || itemById(state.sel)) ? state.sel : null;
  state.terrainEdit = false; setHint('');
  buildTerrain(); renderTrees(); renderItems(); renderEditor();
  if (DET.open){
    if (!itemById(DET.bId)){ DET.open = false; detailWrap.classList.remove('on'); }
    else{
      const b = bld();
      DET.level = clamp(DET.level, 0, Math.max(1, Math.round(+b.nLevels || 1)) - 1);
      if (DET.sel && !roomById(DET.sel)) DET.sel = null;
      detailRenderAll();
    }
  }
  setGrid(doc().grid); renderBrushOpts(); save(); updateUndoBtn();
  toast('Último cambio deshecho.');
}
function updateUndoBtn(){ const b = $('btnUndo'); if (b) b.disabled = !undoStack.length; }

let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try{ localStorage.setItem(LS, snapshot()); }catch(e){}
    $('savedLbl').textContent = 'Guardado localmente · ' + new Date().toLocaleTimeString('es-SV', {hour:'2-digit', minute:'2-digit'});
  }, 350);
}

function sanitizeRoom(r){
  if (!r || typeof r !== 'object' || !Array.isArray(r.poly) || r.poly.length < 3) return null;
  const poly = r.poly.filter(p => p && isFinite(+p.x) && isFinite(+p.y)).map(p => ({x:+p.x, y:+p.y}));
  if (poly.length < 3) return null;
  const cat = doc().catalog;
  const catEntry = (Array.isArray(cat) && cat.find(c => c && c.key === r.cat)) || null;
  return {
    id: r.id || uid(),
    level: clamp(Math.round(+r.level || 0), 0, 999),
    cat: catEntry ? r.cat : 'otro',
    code: String(r.code || '').slice(0, 12),
    name: String(r.name || '').slice(0, 80),
    color: /^#[0-9a-fA-F]{6}$/.test(r.color) ? r.color : (catEntry ? (catEntry.color || '#8F8A74') : '#8F8A74'),
    desc: String(r.desc || ''),
    poly
  };
}
function sanitizeItem(z){
  const nLevels = clamp(Math.round(+z.nLevels || 1), 1, 20);
  const rooms = (Array.isArray(z.rooms) ? z.rooms.map(sanitizeRoom) : [])
    .filter(Boolean)
    .map(r => ({...r, level: clamp(r.level, 0, nLevels - 1)}));
  const out = {
    id: z.id || uid(), kind: KIND_LABEL[z.kind] ? z.kind : 'area',
    code: String(z.code || 'Z'), name: String(z.name || 'Sin nombre'), desc: String(z.desc || ''),
    color: /^#[0-9a-fA-F]{6}$/.test(z.color) ? z.color : '#6E6E66',
    visible: z.visible !== false, locked: !!z.locked,
    rot: clamp(+z.rot || 0, 0, 359), opacity: z.opacity != null ? clamp(+z.opacity, 0, .68) : .24,
    poly: (Array.isArray(z.poly) && z.poly.length >= 3) ? z.poly : rectPts(300, 300, 200, 120),
    nLevels,
    rooms
  };
  /* T3b: nombres de niveles personalizados (si no hay, se usan PB/N1/N2…) */
  if (Array.isArray(z.levelNames)) out.levelNames = z.levelNames.map(s => String(s || '').slice(0, 24)).slice(0, nLevels);
  return out;
}
function loadState(){
  const d = DOC_DEFAULT();
  try{
    const raw = localStorage.getItem(LS) || localStorage.getItem('croquis_campus_v3');
    if (raw){
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.items) && s.terrain && Array.isArray(s.terrain.points)){
        state.terrain = s.terrain;
        Object.assign(d, s.doc || {});   /* el catálogo queda disponible antes de sanitizar */
        state.doc = d;
        state.items = s.items.map(sanitizeItem);
        state.trees = Array.isArray(s.trees) ? s.trees : TREES_DEFAULT();
        return;
      }
    }
    const old = localStorage.getItem('ugb_croquis_libre_v1');
    if (old){
      const s = JSON.parse(old);
      if (s && Array.isArray(s.items) && s.terrain){
        state.terrain = s.terrain;
        state.items = s.items.map(sanitizeItem);
        state.trees = TREES_DEFAULT();
        state.doc = d;
        toast('Croquis anterior migrado a la nueva versión.');
        return;
      }
    }
  }catch(e){ fail('carga de datos', e); }
  state.terrain = {points: TERRAIN_DEFAULT(), name: 'Campus'};
  state.items = ITEMS_DEFAULT().map(sanitizeItem);
  state.trees = TREES_DEFAULT();
  state.doc = d;
}

function downloadBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

/* =====================================================================
   EXPORTACIÓN — reconstrucción desde los datos (nunca fotografía de
   pantalla) con encuadre automático a TODO el contenido
===================================================================== */

/* rectángulo real que ocupa todo el dibujo */
function contentBounds(){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; };
  state.terrain.points.forEach(p => add(p.x, p.y));
  state.items.forEach(z => {
    if (z.visible === false) return;
    z.poly.forEach(p => { const w = worldPt(z, p); add(w.x, w.y); });
  });
  state.trees.forEach(t => add(t.x, t.y));
  if (x0 === Infinity) return {x:0, y:0, w:W, h:H};
  const pad = 80;
  x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
  if (x1 - x0 < 300){ const cx = (x0+x1)/2; x0 = cx-150; x1 = cx+150; }
  if (y1 - y0 < 240){ const cy = (y0+y1)/2; y0 = cy-120; y1 = cy+120; }
  return {x:x0, y:y0, w:x1-x0, h:y1-y0};
}

/* SVG nuevo y limpio, dibujado desde el estado */
function buildExportSVG(b, withCartela){
  const root = document.createElementNS(NS, 'svg');
  root.setAttribute('xmlns', NS);
  const defs = document.createElementNS(NS, 'defs');
  const liveDefs = svg.querySelector('defs');
  if (liveDefs){
    const dc = liveDefs.cloneNode(true);
    const cs = dc.querySelector('#clipStore'); if (cs) cs.remove();
    while (dc.firstChild) defs.appendChild(dc.firstChild);
  }
  const clips = el('g', {id:'clipStore'}, defs);
  root.appendChild(defs);
  const st = document.createElementNS(NS, 'style');
  st.textContent = ".ft-s{font-family:'Archivo','Trebuchet MS',sans-serif}.ft-m{font-family:'IBM Plex Mono','Courier New',monospace}";
  root.appendChild(st);

  const paperY = withCartela ? b.y - 176 : b.y;
  const paperH = b.h + (withCartela ? 176 : 0);
  el('rect', {x:b.x, y:paperY, width:b.w, height:paperH, fill:'#F2EDDF'}, root);
  el('rect', {x:b.x, y:paperY, width:b.w, height:paperH, fill:'url(#dots)'}, root);

  buildTerrainInto(root, state.terrain);
  state.trees.forEach(t => drawTreeAt(root, t.x, t.y, t.r, t.tone));
  const itemsG = el('g', {}, root);
  state.items.forEach(z => { if (z.visible !== false) itemsG.appendChild(buildItemNodeInto(z, clips, true)); });

  if (withCartela) root.appendChild(buildCartela(b));
  return root;
}

/* cartela para el PNG, relativa al encuadre real */
function buildCartela(b){
  const g = el('g');
  const d = doc();
  const items = state.items.filter(z => z.visible !== false);
  const top = b.y - 176;
  el('rect', {x:b.x, y:top, width:b.w, height:176, fill:'#F2EDDF'}, g);
  el('rect', {x:b.x, y:b.y - 3, width:b.w, height:3, fill:'#24271D'}, g);
  txt(g, (d.title || 'CROQUIS DEL CAMPUS').toUpperCase(), {x:b.x+36, y:top+56, class:'ft-s', 'font-weight':800, 'font-size':30, fill:'#24271D'}, g);
  txt(g, d.subtitle || 'Plano de delimitación libre', {x:b.x+36, y:top+79, class:'ft-m', 'font-size':12, fill:'#565A4A', 'letter-spacing':1.8}, g);
  const fecha = new Date().toLocaleDateString('es-SV', {day:'numeric', month:'long', year:'numeric'});
  txt(g, `${items.length} zonas delimitadas · ${state.trees.length} árboles registrados · generado el ${fecha}${d.author ? ' · ' + d.author : ''}`,
    {x:b.x+36, y:top+134, class:'ft-m', 'font-size':11, fill:'#565A4A'}, g);
  const lx = b.x + Math.max(b.w - 660, 430);
  txt(g, 'LEYENDA', {x:lx, y:top+18, class:'ft-m', 'font-weight':700, 'font-size':10, fill:'#565A4A', 'letter-spacing':2}, g);
  const shown = items.slice(0, 18);
  const cols = Math.min(3, Math.max(1, Math.ceil(shown.length / 6)));
  const colW = 660 / cols;
  shown.forEach((z, i) => {
    const col = Math.floor(i/6), row = i % 6;
    const x = lx + col*colW, y = top + 42 + row*22;
    el('rect', {x, y:y-10, width:13, height:13, fill:z.color, stroke:'rgba(20,22,16,.45)', 'stroke-width':1}, g);
    txt(g, `${z.code || '—'} — ${(z.name || '').slice(0, 30)}`, {x:x+19, y, class:'ft-m', 'font-size':11, fill:'#24271D'}, g);
  });
  if (items.length > 18) txt(g, `… y ${items.length-18} más`, {x:lx, y:top+42+6*22, class:'ft-m', 'font-size':11, fill:'#565A4A'}, g);
  return g;
}

/* CSS de fuentes con data-URLs, calculado UNA sola vez (el PDF multipágina
   serializa varios SVG) y reutilizado por embedFonts */
let _fontsCSSPromise = null;
function fontsCSS(){
  if (!_fontsCSSPromise){
    _fontsCSSPromise = (async () => {
      try{
        const cssURL = 'https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;700&display=swap';
        let css = await (await fetch(cssURL)).text();
        const urls = [...new Set([...css.matchAll(/url\((https:\/\/[^)]+)\)/g)].map(m => m[1]))];
        for (const u of urls){
          const blob = await (await fetch(u)).blob();
          const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
          css = css.split(u).join(dataUrl);
        }
        return css;
      }catch(e){ return ''; }
    })();
  }
  return _fontsCSSPromise;
}
async function embedFonts(svgRoot){
  const css = await fontsCSS();
  if (!css){ console.warn('Fuentes no incrustadas en la exportación.'); return; }
  const st = document.createElementNS(NS, 'style');
  st.textContent = css;
  svgRoot.insertBefore(st, svgRoot.firstChild);
}

async function renderMapCanvas(targetLong, withCartela){
  const b = contentBounds();
  const totalH = b.h + (withCartela ? 176 : 0);
  const scale = targetLong / Math.max(b.w, totalH);
  const root = buildExportSVG(b, withCartela);
  const vbY = withCartela ? b.y - 176 : b.y;
  root.setAttribute('viewBox', `${b.x} ${vbY} ${b.w} ${totalH}`);
  const pw = Math.round(b.w * scale), ph = Math.round(totalH * scale);
  root.setAttribute('width', pw); root.setAttribute('height', ph);
  await embedFonts(root);
  const xml = new XMLSerializer().serializeToString(root);
  const url = URL.createObjectURL(new Blob([xml], {type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const cv = document.createElement('canvas');
  cv.width = pw; cv.height = ph;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#F2EDDF';
  ctx.fillRect(0, 0, pw, ph);
  ctx.drawImage(img, 0, 0, pw, ph);
  URL.revokeObjectURL(url);
  return cv;
}

/* T5 · SVG detached → canvas PNG (mismo enfoque que renderMapCanvas:
   XMLSerializer → blob URL → Image → canvas). Reutilizable por las
   páginas de planos interiores y vistas 3D del PDF. */
async function svgNodeToCanvas(svgRoot, pw, ph){
  pw = Math.round(pw); ph = Math.round(ph);
  svgRoot.setAttribute('width', pw); svgRoot.setAttribute('height', ph);
  await embedFonts(svgRoot);
  const xml = new XMLSerializer().serializeToString(svgRoot);
  const url = URL.createObjectURL(new Blob([xml], {type:'image/svg+xml;charset=utf-8'}));
  try{
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
    const cv = document.createElement('canvas');
    cv.width = pw; cv.height = ph;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#F2EDDF';
    ctx.fillRect(0, 0, pw, ph);
    ctx.drawImage(img, 0, 0, pw, ph);
    return cv;
  } finally { URL.revokeObjectURL(url); }
}
