<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Croquis — Editor de plano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#F2EDDF; --paper2:#E7E0CC; --paper3:#F8F4E7;
    --ink:#24271D; --ink2:#565A4A; --line:#C8C0A8;
    --accent:#B04A26; --danger:#A32814;
    --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
    --sans:'Archivo','Trebuchet MS',sans-serif;
    --hard:3px 3px 0 rgba(36,39,29,.22);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:var(--paper2); color:var(--ink); font-family:var(--sans); overflow:hidden}

  #errbar{
    position:fixed; top:0; left:0; right:0; z-index:300; display:none;
    background:var(--danger); color:#FBF8EE; font:600 12px var(--mono);
    padding:8px 14px; letter-spacing:.3px; cursor:pointer;
  }
  #errbar.on{display:block}

  header{
    height:62px; display:flex; align-items:center; gap:16px; padding:0 18px;
    background:var(--paper); border-bottom:2px solid var(--ink); position:relative; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0}
  .brand-mark{width:40px;height:40px;flex:none;background:var(--ink);display:grid;place-items:center;color:var(--paper)}
  .brand h1{font-size:17px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;line-height:1.1;white-space:nowrap}
  .brand .sub{font:400 10px var(--mono);color:var(--ink2);letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap}
  .actions{margin-left:auto;display:flex;gap:10px;align-items:center}

  .btn{
    display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--ink);
    background:var(--paper3);color:var(--ink);padding:8px 13px;font:600 12px var(--sans);
    letter-spacing:.3px;cursor:pointer;box-shadow:2.5px 2.5px 0 rgba(36,39,29,.2);
    transition:transform .12s, box-shadow .12s; user-select:none; touch-action:manipulation;
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:3.5px 3.5px 0 rgba(36,39,29,.26)}
  .btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(36,39,29,.2)}
  .btn.primary{background:var(--ink);color:var(--paper)}
  .btn.accent{background:var(--accent);color:#FBF8EE;border-color:#6E2D12}
  .btn.icon{padding:8px 9px}
  .btn:disabled{opacity:.4;pointer-events:none}
  .btn svg{display:block}
  .btn .lbl{white-space:nowrap}
  @media (max-width:1150px){ .btn .lbl{display:none} .brand .sub{display:none} }

  .dd{position:relative}
  .dd-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:225px;background:var(--paper3);
    border:1.5px solid var(--ink);box-shadow:var(--hard);display:none;z-index:40}
  .dd.open .dd-menu{display:block}
  .dd-menu button{display:flex;gap:10px;align-items:center;width:100%;padding:11px 14px;background:none;border:none;
    border-bottom:1px solid var(--line);font:600 12px var(--sans);color:var(--ink);cursor:pointer;text-align:left}
  .dd-menu button:last-child{border-bottom:none}
  .dd-menu button:hover{background:var(--ink);color:var(--paper)}

  main{display:grid;grid-template-columns:1fr 358px;height:calc(100vh - 62px)}
  #stage{position:relative;background:var(--paper);overflow:hidden;user-select:none}
  #stage svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #stage.panning svg{cursor:grabbing}
  #gItems g[data-id]{cursor:move}

  #toolbar{
    position:absolute;top:14px;left:14px;z-index:30;display:flex;flex-direction:column;
    background:var(--paper3);border:1.5px solid var(--ink);box-shadow:var(--hard);
  }
  .tool{
    width:44px;height:42px;display:grid;place-items:center;border:none;background:none;cursor:pointer;
    color:var(--ink);border-bottom:1px solid var(--line);position:relative;touch-action:manipulation;
  }
  .tool:last-child{border-bottom:none}
  .tool:hover{background:rgba(36,39,29,.09)}
  .tool.active{background:var(--ink);color:var(--paper)}
  .tool.active::before{content:'';position:absolute;left:-6px;top:12px;width:4px;height:18px;background:var(--accent)}
  .tsep{height:9px;background:var(--paper2);border-bottom:1px solid var(--line)}

  #brushOpts{
    position:absolute;left:68px;top:14px;z-index:30;display:none;width:216px;
    background:var(--paper3);border:1.5px solid var(--ink);box-shadow:var(--hard);padding:10px 12px 12px;
  }
  #brushOpts.on{display:block}
  #brushOpts b{display:block;font:700 9.5px var(--mono);letter-spacing:2px;color:var(--ink2);margin-bottom:8px}
  #brushOpts label{display:flex;justify-content:space-between;font:600 11px var(--sans);margin-bottom:4px}
  #brushOpts label span{font:700 11px var(--mono);color:var(--accent)}
  #brushOpts .tip{font:400 10px var(--mono);color:var(--ink2);line-height:1.5;margin-top:7px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:5px;background:var(--line);border:1px solid var(--ink)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;background:var(--ink);border:1.5px solid var(--paper3);margin-top:-6px;box-shadow:1.5px 1.5px 0 rgba(36,39,29,.3)}
  input[type=range]::-moz-range-track{height:5px;background:var(--line);border:1px solid var(--ink)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;background:var(--ink);border:1.5px solid var(--paper3);border-radius:0}

  #tooltip{
    position:absolute;pointer-events:none;z-index:6;background:var(--ink);color:var(--paper);
    font:400 12px var(--mono);padding:9px 11px;border:1px solid #10120C;max-width:280px;
    opacity:0;transition:opacity .12s;line-height:1.45;
  }
  #tooltip.on{opacity:1}
  #tooltip .tt-code{display:inline-block;font-weight:700;padding:1px 6px;margin-bottom:5px;font-size:12px}
  #tooltip .tt-name{font-weight:700;font-family:var(--sans);font-size:12.5px}
  #tooltip .tt-desc{color:#CFCBB8;margin-top:2px}
  #tooltip .tt-hint{color:#9BA08C;margin-top:6px;font-size:10px;letter-spacing:.5px}

  #zoomctrl{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px;z-index:29}
  #zoomctrl .btn{padding:9px 10px;box-shadow:2px 2px 0 rgba(36,39,29,.22)}

  #legend{
    position:absolute;left:68px;bottom:14px;z-index:29;background:rgba(248,244,231,.95);
    border:1.5px solid var(--ink);box-shadow:var(--hard);width:min(262px,calc(100% - 82px));
  }
  #legend .lg-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 12px;
    border-bottom:1.5px solid var(--ink);cursor:pointer}
  #legend .lg-head b{font:700 11px var(--mono);letter-spacing:2.5px}
  #legend .lg-head svg{transition:transform .2s}
  #legend.closed .lg-head svg{transform:rotate(-90deg)}
  #legend .lg-body{max-height:232px;overflow-y:auto;padding:6px 0}
  #legend.closed .lg-body{display:none}
  .lg-item{display:flex;align-items:center;gap:9px;padding:4px 12px;cursor:pointer}
  .lg-item:hover{background:rgba(36,39,29,.08)}
  .lg-item .sw{width:13px;height:13px;flex:none;border:1px solid rgba(20,22,16,.4)}
  .lg-item .cd{font:700 11px var(--mono);width:36px;flex:none}
  .lg-item .nm{font:500 11px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #drawhint{
    position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:28;display:none;
    background:var(--accent);color:#FBF8EE;border:1.5px solid #6E2D12;padding:9px 16px;
    font:600 12px var(--sans);letter-spacing:.3px;box-shadow:var(--hard);max-width:66vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
  }
  #drawhint.on{display:block}
  #drawhint kbd{font:700 10px var(--mono);background:rgba(0,0,0,.28);padding:2px 6px;margin:0 2px}

  body.presenting main{grid-template-columns:1fr}
  body.presenting aside,
  body.presenting #toolbar,
  body.presenting #legend,
  body.presenting #zoomctrl,
  body.presenting #brushOpts,
  body.presenting #drawhint{display:none}
  #exitPresent{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;display:none}
  body.presenting #exitPresent{display:inline-flex}

  aside{background:var(--paper3);border-left:2px solid var(--ink);overflow-y:auto;display:flex;flex-direction:column}
  aside::-webkit-scrollbar{width:9px}
  aside::-webkit-scrollbar-thumb{background:var(--line);border:2px solid var(--paper3)}
  .p-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1.5px solid var(--ink);
    position:sticky;top:0;background:var(--paper3);z-index:2}
  .p-head b{font:700 12px var(--mono);letter-spacing:2.5px}
  .p-head .count{font:700 10px var(--mono);background:var(--ink);color:var(--paper);padding:2px 7px}

  .p-search{padding:10px 14px 8px;border-bottom:1px solid var(--line)}
  .p-search .box{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--paper);padding:7px 10px}
  .p-search input{border:none;outline:none;background:none;font:500 12px var(--sans);width:100%;color:var(--ink)}
  .p-search svg{color:var(--ink2);flex:none}
  .chips{display:flex;flex:0 0 auto;flex-wrap:wrap;gap:5px;padding:8px 12px 10px;border-bottom:1px solid var(--line);max-height:96px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .chips::-webkit-scrollbar{width:6px}
  .chips::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .chips::-webkit-scrollbar-thumb:hover{background:var(--ink2)}
  .chip{font:600 10px var(--sans);border:1px solid var(--ink);background:var(--paper);padding:3px 8px;cursor:pointer;color:var(--ink2)}
  .chip.on{background:var(--ink);color:var(--paper)}

  #zoneList{list-style:none;padding:6px 8px}
  .zitem{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:8px 9px;cursor:pointer;
    border:1.5px solid transparent;margin-bottom:3px}
  .zitem:hover{border-color:var(--line)}
  .zitem.sel{background:var(--ink);color:var(--paper)}
  .zitem.sel .zname{color:var(--paper)}
  .zitem.hidden-zone{opacity:.45}
  .zsw{width:15px;height:15px;flex:none;border:1px solid rgba(20,22,16,.45)}
  .zitem.sel .zsw{border-color:rgba(248,244,231,.7)}
  .zcode{font:700 12px var(--mono);width:32px;flex:none}
  .zname{font:500 11.5px var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .zmeta{flex-basis:100%;font:500 9.5px var(--mono);letter-spacing:.4px;color:var(--ink2);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:63px;margin-top:-3px}
  .zitem.sel .zmeta{color:rgba(248,244,231,.72)}
  .zitem .mini{border:none;background:none;cursor:pointer;padding:3px;color:inherit;display:flex;flex:none}
  .zitem .mini:hover{color:var(--accent)}
  /* resultados globales de ambientes (T6) */
  .rhead{font:700 9.5px var(--mono);letter-spacing:1.5px;color:var(--ink2);padding:10px 9px 5px;
    border-bottom:1px dashed var(--line);margin-bottom:2px}
  .rhit{display:flex;align-items:center;gap:8px;padding:6px 9px;cursor:pointer;
    border:1.5px solid transparent;margin-bottom:2px}
  .rhit:hover{border-color:var(--line)}
  .rhit.sel{background:var(--ink);color:var(--paper)}
  .rcol{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .rrow{display:flex;align-items:baseline;gap:8px;min-width:0}
  .rrow .zname{font-size:11px}
  .rmeta{font:400 9.5px var(--mono);color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rhit.sel .rmeta{color:rgba(248,244,231,.72)}
  .zempty{padding:14px 10px;font:500 11.5px var(--sans);color:var(--ink2);text-align:center;
    border:1.5px dashed var(--line)}

  #editor{padding:12px 16px 18px;border-top:1.5px solid var(--ink);flex:1}
  .ed-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .ed-title .sw{width:18px;height:18px;border:1.5px solid var(--ink)}
  .ed-title b{font:700 13px var(--sans)}
  .ed-empty{border:1.5px dashed var(--line);padding:22px 16px;text-align:center;color:var(--ink2);
    font:500 12px var(--sans);line-height:1.65}
  .field{margin-bottom:12px}
  .field label{display:block;font:700 9.5px var(--mono);letter-spacing:2px;color:var(--ink2);margin-bottom:5px;text-transform:uppercase}
  .field input[type=text],.field textarea,.field select{
    width:100%;border:1.5px solid var(--ink);background:var(--paper);padding:8px 10px;
    font:600 13px var(--sans);color:var(--ink);outline:none;
  }
  .field select{font:600 12px var(--sans);cursor:pointer}
  .field textarea{font:500 12px var(--sans);resize:vertical;min-height:50px}
  .field input.code{font:700 14px var(--mono);letter-spacing:1px;text-transform:uppercase;width:110px}
  .field :focus{box-shadow:2px 2px 0 rgba(36,39,29,.25)}
  .rot-row{display:flex;gap:8px;align-items:center}
  .rot-row input[type=number]{width:64px;border:1.5px solid var(--ink);background:var(--paper);padding:6px 6px;
    font:700 13px var(--mono);outline:none;text-align:right}
  .rot-row .btn{padding:6px 8px;font-size:12px;font-family:var(--mono)}
  .swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .swb{width:23px;height:23px;border:1.5px solid rgba(20,22,16,.5);cursor:pointer}
  .swb.on{outline:2px solid var(--ink);outline-offset:2px}
  .swatches input[type=color]{width:29px;height:26px;border:1.5px dashed var(--ink);background:var(--paper);cursor:pointer;padding:2px}
  .meta-row{font:400 10.5px var(--mono);color:var(--ink2);line-height:1.75;border-top:1px dashed var(--line);padding-top:9px;margin-top:4px}
  .ed-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .ed-btns .btn{padding:7px 11px;font-size:11.5px}
  .btn.danger{border-color:var(--danger);color:var(--danger)}
  .btn.danger:hover{background:var(--danger);color:#FBF8EE}
  .btn.danger.confirm{background:var(--danger);color:#FBF8EE}
  .locknote{border:1.5px dashed var(--accent);color:var(--accent);padding:9px 11px;font:600 11.5px var(--sans);margin-bottom:12px}
  .p-foot{padding:10px 16px;border-top:1.5px solid var(--ink);font:400 10px var(--mono);color:var(--ink2);letter-spacing:.6px}
  .p-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4E8C3A;margin-right:6px}

  #modalWrap{position:fixed;inset:0;background:rgba(30,33,25,.55);display:none;place-items:center;z-index:60}
  #modalWrap.on{display:grid}
  .modal{background:var(--paper3);border:2px solid var(--ink);box-shadow:7px 7px 0 rgba(30,33,25,.35);
    width:min(480px,92vw);padding:22px;max-height:88vh;overflow-y:auto;position:relative}
  .mclose{position:absolute;top:8px;right:8px;width:30px;height:30px;border:1.5px solid var(--ink);
    background:var(--paper);font:700 16px var(--sans);cursor:pointer;line-height:1}
  .mclose:hover{background:var(--ink);color:var(--paper)}
  .modal h3{font:800 16px var(--sans);letter-spacing:.3px;text-transform:uppercase;margin-bottom:4px;padding-right:30px}
  .modal .m-sub{font:400 11px var(--mono);color:var(--ink2);letter-spacing:1px;margin-bottom:16px}
  .modal p{font:500 13px var(--sans);line-height:1.6}
  .modal .m-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .help-keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font:500 12px var(--sans);margin:6px 0 4px}
  .help-keys kbd{font:700 10px var(--mono);background:var(--paper);border:1px solid var(--ink);padding:2px 7px;box-shadow:1.5px 1.5px 0 rgba(36,39,29,.25)}
  .check{display:flex;align-items:center;gap:9px;font:600 12.5px var(--sans);padding:7px 0;cursor:pointer}
  .check input{width:15px;height:15px;accent-color:var(--ink);cursor:pointer}
  .pvbox{border:1.5px solid var(--ink);background:#fff;padding:6px;margin-bottom:10px}
  .pvbox img{width:100%;display:block}

  /* ===== vista 3D isométrica (T4) ===== */
  .isoStage{border:1.5px solid var(--ink);background:var(--paper);height:min(56vh,500px);margin-bottom:12px}
  .isoStage svg{width:100%;height:100%;display:block}
  .isoCtrls .isoRow{display:flex;gap:14px;align-items:center;margin-bottom:4px;flex-wrap:wrap}
  .isoCtrls .field{margin-bottom:4px}
  .isoCtrls .field label b{font:700 11px var(--mono);color:var(--accent);text-transform:none;letter-spacing:0}
  .isoChips{display:flex;gap:5px;flex-wrap:wrap;flex:1;min-width:220px}
  .ichip{font:700 10px var(--mono);letter-spacing:.6px;border:1.5px solid var(--ink);background:var(--paper3);
    color:var(--ink);padding:5px 8px;cursor:pointer;box-shadow:1.5px 1.5px 0 rgba(36,39,29,.18)}
  .ichip:hover{background:rgba(36,39,29,.09)}
  .ichip.on{background:var(--ink);color:var(--paper)}

  #toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:250;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--ink);color:var(--paper);font:600 12px var(--sans);padding:11px 18px;
    border:1px solid #10120C;box-shadow:var(--hard);opacity:0;transform:translateY(12px);transition:all .25s;max-width:78vw}
  .toast.on{opacity:1;transform:translateY(0)}
  .toast.warn{background:var(--accent);border-color:#6E2D12}
  .toast.err{background:var(--danger)}

  /* ===== vista de detalle (ambientes interiores) ===== */
  #detailWrap{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;background:var(--paper2)}
  #detailWrap.on{display:flex}
  #dHead{display:flex;align-items:center;gap:9px;padding:0 14px;height:58px;flex:none;
    background:var(--paper);border-bottom:2px solid var(--ink);position:relative;z-index:5;
    overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
  #dHead::-webkit-scrollbar{height:6px}
  #dHead::-webkit-scrollbar-thumb{background:var(--line)}
  #dTitleBox{display:flex;align-items:center;gap:9px;min-width:0}
  #dTitleBox b{font-size:14.5px;font-weight:800;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
  .dchip{font:700 11px var(--mono);background:var(--ink);color:var(--paper);padding:3px 7px;letter-spacing:1px;flex:none}
  .dtabs{display:flex;gap:4px;align-items:center;border-left:1.5px solid var(--line);padding-left:12px;flex:none}
  .dtab{font:700 11px var(--mono);border:1.5px solid var(--ink);background:var(--paper3);color:var(--ink);
    padding:6px 9px;cursor:pointer;letter-spacing:.5px}
  .dtab:hover{background:rgba(36,39,29,.09)}
  .dtab.on{background:var(--ink);color:var(--paper)}
  .dtab:disabled{opacity:.4;cursor:not-allowed;background:var(--paper3);color:var(--ink)}
  .dsep{width:1.5px;height:26px;background:var(--line);flex:none}
  .dspring{flex:1}
  .btn.on{background:var(--ink);color:var(--paper)}
  .dcheck{white-space:nowrap;font-size:11.5px;padding:0;flex:none}
  #dMain{flex:1;display:flex;min-height:0}
  #dSide{width:280px;flex:none;background:var(--paper3);border-right:2px solid var(--ink);overflow-y:auto;display:flex;flex-direction:column}
  #dSide::-webkit-scrollbar{width:9px}
  #dSide::-webkit-scrollbar-thumb{background:var(--line);border:2px solid var(--paper3)}
  #dStage{flex:1;position:relative;background:var(--paper3);overflow:hidden;user-select:none}
  #dsvg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #dsvg.panning{cursor:grabbing}
  #dsvg.stamping{cursor:crosshair}
  #dsvg [data-rid]{cursor:move}
  #dHint{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:4;display:none;
    background:var(--accent);color:#FBF8EE;border:1.5px solid #6E2D12;padding:8px 15px;
    font:600 12px var(--sans);letter-spacing:.3px;box-shadow:var(--hard);max-width:62vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
  #dHint.on{display:block}
  #dHint kbd{font:700 10px var(--mono);background:rgba(0,0,0,.28);padding:2px 6px;margin:0 2px}
  .dlist{list-style:none;padding:4px 0 8px}
  .ditem{display:flex;align-items:center;gap:8px;padding:8px 9px;cursor:pointer;
    border:1.5px solid transparent;margin:0 7px 3px}
  .ditem:hover{border-color:var(--line)}
  .ditem.sel{background:var(--ink);color:var(--paper)}
  .ditem.sel .zname{color:var(--paper)}
  .ditem .mini{border:none;background:none;cursor:pointer;padding:2px 4px;color:inherit;display:flex;flex:none;
    font:700 14px var(--sans);line-height:1}
  .ditem .mini:hover{color:var(--accent)}
  .ditem .mini.confirm{background:var(--danger);color:#FBF8EE;font:700 10px var(--mono);padding:4px 7px}
  .dempty{border:1.5px dashed var(--line);margin:6px 10px 2px;padding:13px 10px;font:500 11px var(--sans);
    color:var(--ink2);line-height:1.65;text-align:center;list-style:none}
  #dProp{border-top:1.5px solid var(--ink);padding:12px 14px 16px}
  .dcat{margin-top:auto;border-top:1.5px solid var(--ink);padding:11px 12px 14px}
  .dcat h4{font:700 9.5px var(--mono);letter-spacing:2px;color:var(--ink2);margin-bottom:8px}
  .dcatg{display:flex;align-items:center;gap:8px;width:100%;border:1.5px solid var(--ink);background:var(--paper);
    padding:6px 9px;margin-bottom:5px;cursor:pointer;font:600 11.5px var(--sans);color:var(--ink);text-align:left}
  .dcatg:hover{background:rgba(36,39,29,.08)}
  .dcatg.on{background:var(--ink);color:var(--paper)}
  .catrow{border:1.5px solid var(--ink);background:var(--paper);margin-bottom:8px;padding:9px 10px}
  .catrow .cr1{display:flex;align-items:center;gap:8px}
  .cat-ic{width:32px;height:32px;flex:none;border:1.5px solid var(--ink);background:var(--paper3);
    display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
  .cat-ic:hover{background:var(--ink);color:var(--paper)}
  .catrow input.cat-name{flex:1;min-width:60px;border:1.5px solid var(--ink);background:var(--paper3);
    padding:6px 8px;font:600 12.5px var(--sans);outline:none}
  .catrow input.cat-code{width:58px;border:1.5px solid var(--ink);background:var(--paper3);padding:6px 4px;
    font:700 12px var(--mono);text-transform:uppercase;outline:none;text-align:center}
  .catrow .crdel{border:1.5px solid var(--danger);color:var(--danger);background:none;font:700 11px var(--sans);
    padding:6px 9px;cursor:pointer;flex:none}
  .catrow .crdel:hover{background:var(--danger);color:#FBF8EE}
  .catrow .cr2{display:flex;align-items:center;gap:5px;margin-top:8px;flex-wrap:wrap}
  .catrow .cr2 .swb{width:19px;height:19px}
  .catrow .cr2 input[type=color]{width:27px;height:24px;border:1.5px dashed var(--ink);background:var(--paper3);cursor:pointer;padding:2px}
  .iconpick{display:none;gap:4px;flex-wrap:wrap;margin-top:9px;border-top:1px dashed var(--line);padding-top:9px}
  .iconpick.on{display:flex}
  .iconpick button{width:31px;height:31px;border:1.5px solid var(--line);background:var(--paper3);
    display:grid;place-items:center;cursor:pointer;color:var(--ink);padding:0}
  .iconpick button:hover{border-color:var(--ink)}
  .iconpick button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

  /* T3b · gestor de niveles + modales de grid/dibujo */
  .lvnum{font:700 11px var(--mono);width:22px;text-align:center;color:var(--ink2);flex:none}
  .lvcount{font:400 10.5px var(--mono);color:var(--ink2);flex:none;white-space:nowrap}
  .lvfixed{font:700 9px var(--mono);color:var(--ink2);letter-spacing:1px;flex:none}
  .lvwarn{font:600 11px var(--sans);color:var(--danger);padding:6px 2px 0 30px}
  .catrow .crdel.confirm{background:var(--danger);color:#FBF8EE}
  .m-note{font:400 11px var(--mono);color:var(--ink2);line-height:1.65;margin-top:10px}

  @media (max-width:900px){
    main{grid-template-columns:1fr;grid-template-rows:60vh 1fr}
    aside{border-left:none;border-top:2px solid var(--ink)}
  }
</style>
</head>
<body>

<div id="errbar" title="Clic para cerrar el aviso"></div>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2.5h6.5l3.5 3.5V13.5H3z"/><path d="M9.5 2.5v3.5H13"/><path d="M5.5 8.5h5M5.5 11h5" stroke-width="1.1"/></svg>
    </div>
    <div>
      <h1>Croquis</h1>
      <div class="sub">Editor de plano</div>
    </div>
  </div>
  <div class="actions">
    <button class="btn icon" id="btnPresent" title="Modo presentación: plano a pantalla completa (ESC para salir)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="3" width="12" height="8.5" rx="1"/><path d="M6 14h4M8 11.5V14"/></svg>
    </button>
    <button class="btn icon" id="btnHelp" title="Guía de uso y atajos">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6.4"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.8c-.6.25-.8.6-.8 1.3"/><circle cx="8" cy="11.6" r=".4" fill="currentColor"/></svg>
    </button>
    <button class="btn" id="btnPNG" title="Exportar PNG: el plano completo con cartela y leyenda">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v8M5 7.5 8 10.5 11 7.5M3 13.5h10"/></svg>
      <span class="lbl">PNG</span>
    </button>
    <button class="btn accent" id="btnPDF" title="Guardar PDF (con vista previa): plano completo + registro de zonas">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 2h7l3 3v9H3z"/><path d="M10 2v3h3M5.5 11.5h5M5.5 9h5" stroke-width="1.1"/></svg>
      <span class="lbl">PDF</span>
    </button>
    <div class="dd" id="ddData">
      <button class="btn" id="btnData" title="Datos y ajustes del documento">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/><circle cx="5.5" cy="4" r="1.4" fill="currentColor"/><circle cx="10.5" cy="8" r="1.4" fill="currentColor"/><circle cx="6.5" cy="12" r="1.4" fill="currentColor"/></svg>
        <span class="lbl">Datos</span>
      </button>
      <div class="dd-menu">
        <button id="miSettings"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6 11 5M5 11l-1.4 1.4"/></svg>Ajustes del documento</button>
        <button id="miExport"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v8M5 7.5 8 10.5 11 7.5M3 13.5h10"/></svg>Exportar JSON</button>
        <button id="miImport"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 10V2M5 4.5 8 1.5l3 3M3 13.5h10"/></svg>Importar JSON…</button>
      </div>
    </div>
    <button class="btn icon" id="btnUndo" title="Deshacer (Ctrl+Z)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 7h6.5a3.5 3.5 0 0 1 0 7H7M3.5 7 6 4.5M3.5 7 6 9.5"/></svg>
    </button>
    <button class="btn icon" id="btnReset" title="Restablecer el croquis original">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 8A5 5 0 1 1 11.4 4.3M13 2.5v3.2H9.8"/></svg>
    </button>
  </div>
</header>

<main>
  <section id="stage">
    <svg id="map" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
          <circle cx="3" cy="3" r="0.7" fill="#8F8A74" opacity="0.09"/>
        </pattern>
        <pattern id="grass" width="15" height="15" patternUnits="userSpaceOnUse">
          <circle cx="4" cy="4" r="1.2" fill="#A9BC84"/><circle cx="11.5" cy="11" r="1.2" fill="#A9BC84"/>
        </pattern>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="#3A3E30" stroke-width="1" stroke-opacity="0.16"/>
        </pattern>
        <pattern id="shedHatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="7" stroke="#24271D" stroke-width="1.1" stroke-opacity="0.18"/>
        </pattern>
        <pattern id="pav" width="13" height="13" patternUnits="userSpaceOnUse">
          <path d="M13 0H0V13" fill="none" stroke="#D8D0B8" stroke-width="0.7"/>
        </pattern>
        <pattern id="gridp" width="50" height="50" patternUnits="userSpaceOnUse">
          <path d="M50 0H0V50" fill="none" stroke="#8F8A74" stroke-width="0.6" opacity="0.35"/>
        </pattern>
        <g id="clipStore"></g>
      </defs>
      <style>
        .ft-s{font-family:'Archivo','Trebuchet MS',sans-serif}
        .ft-m{font-family:'IBM Plex Mono','Courier New',monospace}
      </style>
      <g id="gBase"></g>
      <g id="gTerrain"></g>
      <g id="gTrees"></g>
      <g id="gItems"></g>
      <g id="gUi"></g>
      <g id="gPreview"></g>
    </svg>

    <div id="toolbar">
      <button class="tool active" data-tool="select" title="Seleccionar, mover, rotar y editar (V)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.2 12 10.1l-3.2.6 1.8 3.6-1.8.9-1.8-3.7-2.5 2V2.2z"/></svg>
      </button>
      <button class="tool" data-tool="poly" title="Dibujar zona por vértices, clic a clic (P)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 2.2 13.6 6.3 11.5 12.8H4.5L2.4 6.3Z"/><circle cx="8" cy="2.2" r="1.3" fill="currentColor" stroke="none"/><circle cx="13.6" cy="6.3" r="1.3" fill="currentColor" stroke="none"/><circle cx="4.5" cy="12.8" r="1.3" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="tool" data-tool="free" title="Trazo libre / mano alzada (F)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.3 12.2C4.8 4.4 9.3 13.6 13.4 5.2"/><circle cx="13.4" cy="5.2" r="1.4" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="tool" data-tool="terrainDraw" title="Redibujar el límite del campus (T)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 2"><path d="M3 10.5 5.8 5 10 6.8 12.8 3.6 14 9.2 10.8 13 5 12.2Z"/></svg>
      </button>
      <button class="tool" data-tool="brush" title="Pincel de vegetación: plantá árboles arrastrando (N)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="6" r="4.2"/><path d="M8 10.2v3.3" stroke-linecap="round"/></svg>
      </button>
      <button class="tool" data-tool="eraser" title="Goma de vegetación: borrá árboles arrastrando (X)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9.6 2.8 13.2 6.4 6.4 13.2H3.2v-3.2z"/><path d="M7.4 5 11 8.6"/></svg>
      </button>
      <div class="tsep"></div>
      <button class="tool" data-stamp="bldg" title="Colocar edificio (B)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4.5" width="10" height="7.5"/><path d="M3 8.3h10M5.6 4.5 3.4 12M10.4 4.5l2.2 7.5" stroke-width=".9"/></svg>
      </button>
      <button class="tool" data-stamp="aud" title="Colocar auditorio (A)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2.5 12.5a5.5 5.5 0 0 1 11 0Z"/><path d="M5 12.5a3 3 0 0 1 6 0M6.6 12.5a1.4 1.4 0 0 1 2.8 0" stroke-width=".9"/></svg>
      </button>
      <button class="tool" data-stamp="pitch" title="Colocar cancha deportiva (C)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.6" y="4.6" width="10.8" height="6.8"/><path d="M8 4.6v6.8"/><circle cx="8" cy="8" r="1.3"/></svg>
      </button>
      <button class="tool" data-stamp="lot" title="Colocar estacionamiento (E)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.6" y="3.6" width="10.8" height="8.8"/><rect x="4.2" y="5.2" width="2.6" height="2" rx=".7" stroke-width=".9"/><rect x="9" y="5.2" width="2.6" height="2" rx=".7" stroke-width=".9"/><rect x="4.2" y="8.6" width="2.6" height="2" rx=".7" stroke-width=".9"/><rect x="9" y="8.6" width="2.6" height="2" rx=".7" stroke-width=".9"/></svg>
      </button>
      <button class="tool" data-stamp="plaza" title="Colocar plaza / glorieta (G)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="5.6"/><circle cx="8" cy="8" r="1.5" stroke-width=".9"/></svg>
      </button>
      <button class="tool" data-stamp="bath" title="Colocar baño / sanitario (H)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 8.6h11v.9a3.2 3.2 0 0 1-3.2 3.2H5.7a3.2 3.2 0 0 1-3.2-3.2z"/><path d="M4.3 8.6V4.7c0-1 .8-1.7 1.7-1.7.8 0 1.5.6 1.7 1.4"/><path d="M4.7 12.7 4.1 14M11.3 12.7l.6 1.3" stroke-width=".9"/></svg>
      </button>
      <button class="tool" data-stamp="pool" title="Colocar piscina (S)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.2 10.6V4.4M9.8 10.6V4.4M6.2 6.2h3.6M6.2 8.5h3.6"/><path d="M2.2 12.7q1.45-1.4 2.9 0t2.9 0 2.9 0 2.9 0" stroke-width="1.2"/></svg>
      </button>
      <button class="tool" data-stamp="shed" title="Colocar bodega (D)">
        <svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4.4" width="10" height="7.6"/><path d="M8 4.4v7.6M3 6.9h10" stroke-width=".9"/></svg>
      </button>
    </div>

    <div id="brushOpts"></div>
    <div id="tooltip"></div>

    <div id="zoomctrl">
      <button class="btn" id="zin" title="Acercar"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3 8h10"/></svg></button>
      <button class="btn" id="zout" title="Alejar"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10"/></svg></button>
      <button class="btn" id="zfit" title="Ver TODO el contenido del croquis"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
    </div>

    <div id="legend">
      <div class="lg-head" id="lgHead">
        <b>LEYENDA</b>
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6l5 5 5-5"/></svg>
      </div>
      <div class="lg-body" id="lgBody"></div>
    </div>

    <div id="drawhint"></div>
  </section>

  <aside>
    <div class="p-head"><b>ZONAS</b><span class="count" id="zcount">0</span></div>
    <div class="p-search">
      <div class="box">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="search" type="text" placeholder="Buscar zona o ambiente…">
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <ul id="zoneList"></ul>
    <div id="editor"></div>
    <div class="p-foot"><span class="dot"></span><span id="savedLbl">Cambios sin guardar</span></div>
  </aside>
</main>

<div id="detailWrap">
  <div id="dHead">
    <button class="btn" id="dBack" title="Volver al campus (ESC)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9.5 3 4.5 8l5 5M4.5 8H14"/></svg>
      <span class="lbl">Campus</span>
    </button>
    <div id="dTitleBox">
      <b id="dName">—</b>
      <span class="dchip" id="dCode">—</span>
      <span class="dchip" id="dLvChip" style="display:none;background:var(--accent)"></span>
    </div>
    <div class="dtabs" id="dTabs"></div>
    <div class="dsep"></div>
    <button class="btn" id="dToolSelect" title="Seleccionar, mover y editar ambientes">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M4.5 2.2 12 10.1l-3.2.6 1.8 3.6-1.8.9-1.8-3.7-2.5 2V2.2z"/></svg>
      <span class="lbl">Seleccionar</span>
    </button>
    <button class="btn" id="dToolStamp" title="Estampar un ambiente con la categoría elegida en el panel">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.6" y="4.4" width="10.8" height="7.2"/><path d="M8 6.4v3.2M6.4 8h3.2"/></svg>
      <span class="lbl">Estampar ambiente</span>
    </button>
    <button class="btn" id="dToolGrid" title="Dividir en grid: filas × columnas recortadas a la forma real (G)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.2" y="2.2" width="11.6" height="11.6"/><path d="M6.1 2.2v11.6M9.9 2.2v11.6M2.2 6.1h11.6M2.2 9.9h11.6"/></svg>
      <span class="lbl">Grid</span>
    </button>
    <button class="btn" id="dToolCut" title="Cortar ambientes arrastrando una línea (C)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="4.3" cy="12.3" r="1.7"/><circle cx="11.7" cy="12.3" r="1.7"/><path d="M5.5 10.9 10.9 2.6M10.5 10.9 5.1 2.6"/></svg>
      <span class="lbl">Cortar</span>
    </button>
    <button class="btn" id="dToolDraw" title="Dibujar un ambiente vértice a vértice (D)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 13.2l.9-3.4 7-7 2.3 2.3-7 7L3 13.2z"/><path d="M9.5 4.2l2.3 2.3"/></svg>
      <span class="lbl">Dibujar</span>
    </button>
    <button class="btn" id="dToolIso" title="Vista 3D isométrica: pisos apilados tipo vista explotada">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.8 14 5v6L8 14.2 2 11V5Z"/><path d="M2 5l6 3.2L14 5M8 8.2v6"/></svg>
      <span class="lbl">Vista 3D</span>
    </button>
    <button class="btn" id="dCatBtn" title="Editar el catálogo de ambientes">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.4" y="2.4" width="4.8" height="4.8"/><rect x="8.8" y="2.4" width="4.8" height="4.8"/><rect x="2.4" y="8.8" width="4.8" height="4.8"/><rect x="8.8" y="8.8" width="4.8" height="4.8"/></svg>
      <span class="lbl">Catálogo</span>
    </button>

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

const polyPath = pts => 'M' + pts.map(p => p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join('L') + 'Z';
function polyBBox(pts){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const p of pts){ if(p.x<x0)x0=p.x; if(p.y<y0)y0=p.y; if(p.x>x1)x1=p.x; if(p.y>y1)y1=p.y; }
  return {x:x0, y:y0, w:x1-x0, h:y1-y0};
}
function polyArea(pts){
  let a = 0;
  for (let i = 0; i < pts.length; i++){
    const p = pts[i], q = pts[(i+1)%pts.length];
    a += p.x*q.y - q.x*p.y;
  }
  return Math.abs(a)/2;
}
function polyCentroid(pts){
  let a=0, cx=0, cy=0;
  for (let i = 0; i < pts.length; i++){
    const p = pts[i], q = pts[(i+1)%pts.length];
    const cr = p.x*q.y - q.x*p.y;
    a += cr; cx += (p.x+q.x)*cr; cy += (p.y+q.y)*cr;
  }
  a *= .5;
  if (Math.abs(a) < 1e-6){ const b = polyBBox(pts); return {x:b.x+b.w/2, y:b.y+b.h/2}; }
  return {x: cx/(6*a), y: cy/(6*a)};
}
function pointInPoly(x, y, pts){
  let inn = false;
  for (let i = 0, j = pts.length-1; i < pts.length; j = i++){
    const a = pts[i], b = pts[j];
    if ((a.y > y) !== (b.y > y) && x < (b.x-a.x)*(y-a.y)/(b.y-a.y) + a.x) inn = !inn;
  }
  return inn;
}
function distToSeg(p, a, b){
  const dx = b.x-a.x, dy = b.y-a.y, L = dx*dx + dy*dy;
  if (!L) return Math.hypot(p.x-a.x, p.y-a.y);
  let t = ((p.x-a.x)*dx + (p.y-a.y)*dy) / L;
  t = clamp(t, 0, 1);
  return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
}
function douglasPeucker(pts, tol){
  if (pts.length < 3) return pts.slice();
  const keep = new Array(pts.length).fill(false);
  keep[0] = keep[pts.length-1] = true;
  const stack = [[0, pts.length-1]];
  while (stack.length){
    const [i, j] = stack.pop();
    let mx = 0, mi = -1;
    for (let k = i+1; k < j; k++){
      const d = distToSeg(pts[k], pts[i], pts[j]);
      if (d > mx){ mx = d; mi = k; }
    }
    if (mx > tol){ keep[mi] = true; stack.push([i, mi], [mi, j]); }
  }
  return pts.filter((_, k) => keep[k]);
}
const rectPts = (x, y, w, h) => [{x, y}, {x:x+w, y}, {x:x+w, y:y+h}, {x, y:y+h}];
function tfPoint(p, t){

}

/* recorte Sutherland–Hodgman de un polígono contra un rectángulo convexo.
   Lo usa el estampado de ambientes (T3a) y el grid automático (T3b). */
function clipPolyRect(poly, r){
  let out = poly.slice();
  const edges = [
    {f: p => p.x >= r.x,        i: (a,b) => ({x: r.x,     y: a.y + (b.y-a.y)*(r.x - a.x)/(b.x-a.x)})},
    {f: p => p.x <= r.x + r.w,  i: (a,b) => ({x: r.x+r.w, y: a.y + (b.y-a.y)*(r.x + r.w - a.x)/(b.x-a.x)})},
    {f: p => p.y >= r.y,        i: (a,b) => ({y: r.y,     x: a.x + (b.x-a.x)*(r.y - a.y)/(b.y-a.y)})},
    {f: p => p.y <= r.y + r.h,  i: (a,b) => ({y: r.y+r.h, x: a.x + (b.x-a.x)*(r.y + r.h - a.y)/(b.y-a.y)})},
  ];
  for (const e of edges){
    const inp = out; out = [];
    for (let k = 0; k < inp.length; k++){
      const cur = inp[k], prev = inp[(k + inp.length - 1) % inp.length];
      const cIn = e.f(cur), pIn = e.f(prev);
      if (cIn){ if (!pIn) out.push(e.i(prev, cur)); out.push(cur); }
      else if (pIn) out.push(e.i(prev, cur));
    }
    if (out.length < 3) return [];
  }
  return out;
}

/* T3b: limpieza de polígonos resultado de clips (vértices duplicados y casi colineales) */
function cleanPoly(pts, tol = .5){
  const ded = [];
  for (const p of pts){
    const q = ded[ded.length - 1];
    if (!q || Math.hypot(p.x - q.x, p.y - q.y) > tol) ded.push({x: p.x, y: p.y});
  }
  while (ded.length > 1 && Math.hypot(ded[0].x - ded[ded.length-1].x, ded[0].y - ded[ded.length-1].y) <= tol) ded.pop();
  const out = [], n = ded.length;
  for (let i = 0; i < n; i++){
    if (out.length + (n - i) <= 3){ out.push(ded[i]); continue; }
    const prev = out[out.length - 1] || ded[n - 1];
    const cur = ded[i], next = ded[(i + 1) % n];
    if (distToSeg(cur, prev, next) <= tol) continue;
    out.push(cur);
  }
  return out.length >= 3 ? out : ded;
}
/* T3b: intersección de un segmento p→q con la recta infinita a→b */
function lineIx(p, q, a, b){
  const dx = b.x - a.x, dy = b.y - a.y;
  const den = (q.x - p.x) * dy - (q.y - p.y) * dx;
  if (Math.abs(den) < 1e-9) return {x: p.x, y: p.y};
  const t = ((a.x - p.x) * dy - (a.y - p.y) * dx) / den;
  return {x: p.x + (q.x - p.x) * t, y: p.y + (q.y - p.y) * t};
}
/* T3b: recorte Sutherland–Hodgman contra un semiplano (línea a→b).
   keepNeg=false conserva el lado izquierdo (cross ≥ 0), true el derecho. */
function clipPolyHalfPlane(poly, a, b, keepNeg){
  const dx = b.x - a.x, dy = b.y - a.y;
  const side = p => dx * (p.y - a.y) - dy * (p.x - a.x);
  const out = [];
  for (let k = 0; k < poly.length; k++){
    const cur = poly[k], prev = poly[(k + poly.length - 1) % poly.length];
    const cs = side(cur), ps = side(prev);
    const cIn = keepNeg ? cs <= 1e-7 : cs >= -1e-7;
    const pIn = keepNeg ? ps <= 1e-7 : ps >= -1e-7;
    if (cIn){ if (!pIn) out.push(lineIx(prev, cur, a, b)); out.push(cur); }
    else if (pIn) out.push(lineIx(prev, cur, a, b));
  }
  return out;
}
/* T3b: recorte de un polígono arbitrario contra una ventana convexa (p.ej. el poly del edificio) */
function clipPolyPoly(subject, clip){
  let win = clip.slice(), area2 = 0;
  for (let i = 0; i < win.length; i++){ const p = win[i], q = win[(i+1) % win.length]; area2 += p.x*q.y - q.x*p.y; }
  if (area2 < 0) win.reverse();
  let out = subject.slice();
  for (let i = 0; i < win.length && out.length >= 3; i++)
    out = clipPolyHalfPlane(out, win[i], win[(i+1) % win.length], false);
  return out;
}
function isConvexPoly(pts){
  let sign = 0;
  for (let i = 0; i < pts.length; i++){
    const a = pts[i], b = pts[(i+1) % pts.length], c = pts[(i+2) % pts.length];
    const cr = (b.x - a.x) * (c.y - b.y) - (b.y - a.y) * (c.x - b.x);
    if (Math.abs(cr) < 1e-6) continue;
    const s = cr > 0 ? 1 : -1;
    if (!sign) sign = s; else if (s !== sign) return false;
  }
  return true;
}
/* T3b: ajusta el punto final del corte a múltiplos de 45° (con Shift o imán activado) */
function cutSnap(a, p, shift){
  let q = {x: grid(p.x), y: grid(p.y)};
  if (doc().snap || shift){
    const dx = q.x - a.x, dy = q.y - a.y, len = Math.hypot(dx, dy);
    if (len > 1){
      const st = Math.PI / 4, ang = Math.round(Math.atan2(dy, dx) / st) * st;
      q = {x: grid(a.x + Math.cos(ang) * len), y: grid(a.y + Math.sin(ang) * len)};
    }
  }
  return q;
}

function buildTerrainInto(parent, terrain){
  const d = polyPath(terrain.points);
  el('path', {d, transform:'translate(8 9)', fill:'rgba(36,39,29,.16)'}, parent);
  el('path', {d, fill:'#E3E9D1', stroke:'#AEBB90', 'stroke-width':1}, parent);
  el('path', {d, fill:'url(#grass)'}, parent);
  el('path', {d, fill:'none', stroke:'#F0EADA', 'stroke-width':7, opacity:.55}, parent);
  el('path', {d, fill:'none', stroke:'#C7351F', 'stroke-width':4, 'stroke-dasharray':'18 10', 'stroke-linejoin':'round'}, parent);
  let top = terrain.points[0];
  for (const p of terrain.points) if (p.y < top.y) top = p;
  txt(parent, 'LÍMITE DEL CAMPUS', {x: top.x, y: top.y - 16, class:'ft-m', 'font-size':11, 'letter-spacing':2.2,
    fill:'#A5301A', 'text-anchor':'middle', stroke:'#F2EDDF', 'stroke-width':4, 'paint-order':'stroke'});
}
function buildTerrain(){ gTerrain.innerHTML = ''; buildTerrainInto(gTerrain, state.terrain); }

function renderTrees(){ gTrees.innerHTML = ''; state.trees.forEach(t => drawTreeAt(gTrees, t.x, t.y, t.r, t.tone)); }
function plantTree(p){
  const t = {x: Math.round(p.x), y: Math.round(p.y), r: doc().brushR, tone: Math.random()};
  state.trees.push(t); drawTreeAt(gTrees, t.x, t.y, t.r, t.tone);
  return t;
}
function eraseNear(p, radius){
  const before = state.trees.length;
  state.trees = state.trees.filter(t => Math.hypot(t.x-p.x, t.y-p.y) > radius);
  if (state.trees.length !== before) renderTrees();
  return before - state.trees.length;
}

function fBld(g, b){
  const m = Math.min(b.w, b.h)*.06 + 4;
  const x = b.x+m, y = b.y+m, w = b.w-2*m, h = b.h-2*m;
  el('rect', {x:x+5, y:y+6, width:w, height:h, fill:'#CFC7B0'}, g);
  el('rect', {x, y, width:w, height:h, fill:'#FBF7EC', stroke:'#2C3024', 'stroke-width':1.4}, g);
  el('rect', {x, y, width:w, height:h, fill:'url(#hatch)'}, g);
}
function fPitch(g, b){
  const x = b.x+4, y = b.y+4, w = b.w-8, h = b.h-8;
  el('rect', {x, y, width:w, height:h, fill:'#5F8C46', stroke:'#F2F5E8', 'stroke-width':3}, g);
  for (let i = 0; i < 6; i++)
    if (i % 2) el('rect', {x:x + i*w/6, y, width:w/6, height:h, fill:'#F2F5E8', opacity:.05}, g);
  const cx = x+w/2, cy = y+h/2, L = {stroke:'#F2F5E8', 'stroke-width':2, fill:'none'};
  el('line', {x1:cx, y1:y, x2:cx, y2:y+h, ...L}, g);
  el('circle', {cx, cy, r:Math.min(w,h)*.13, ...L}, g);
  el('rect', {x, y:cy-h*.17, width:w*.12, height:h*.34, ...L}, g);
  el('rect', {x:x+w*.88, y:cy-h*.17, width:w*.12, height:h*.34, ...L}, g);
  el('circle', {cx:x+w*.06, cy, r:2.4, fill:'#F2F5E8'}, g);
  el('circle', {cx:x+w*.94, cy, r:2.4, fill:'#F2F5E8'}, g);
}
function fLot(g, b, z){
  const rnd = mulberry32(hashId(z.id));
  el('rect', {x:b.x+4, y:b.y+4, width:b.w-8, height:b.h-8, fill:'#DED8C4', stroke:'#C4BBA3', 'stroke-width':1}, g);
  const depth = Math.min(44, b.h*.22), aisle = depth*.65;
  let y = b.y + 10, flip = false;
  while (y + depth*2 + aisle < b.y + b.h - 12){
    for (let row = 0; row < 2; row++){
      const ry = y + row*(depth + aisle);
      for (let xx = b.x + 12; xx < b.x + b.w - 16; xx += 22){
        el('line', {x1:xx, y1:ry, x2:xx, y2:ry+depth, stroke:'#FBF7EC', 'stroke-width':2}, g);
        if (rnd() < .35){
          const cols = ['#B9B0A0','#8F9AA0','#A08F85','#93A08D','#B0A38F'];
          el('rect', {x:xx+3, y:ry+4, width:16, height:depth-8, rx:3.5,
            fill:cols[Math.floor(rnd()*cols.length)], stroke:'#6B6656', 'stroke-width':.6}, g);
        }
      }
    }
    const ay = y + depth + aisle*.5;
    [b.x+b.w*.32, b.x+b.w*.66].forEach((ax, i) => {
      const dir = (flip ? -1 : 1) * (i ? 1 : -1);
      el('path', {d:`M${ax-5},${ay-3} L${ax+5*dir},${ay} L${ax-5},${ay+3} Z`, fill:'#8F8A74'}, g);
    });
    flip = !flip;
    y += depth*2 + aisle;
  }
}
function fPlaza(g, b, z){
  const rnd = mulberry32(hashId(z.id));
  el('rect', {x:b.x+3, y:b.y+3, width:b.w-6, height:b.h-6, fill:'#EFE9D8', stroke:'#D8D0B8', 'stroke-width':1}, g);
  el('rect', {x:b.x+3, y:b.y+3, width:b.w-6, height:b.h-6, fill:'url(#pav)'}, g);
  const cx = b.x+b.w/2, cy = b.y+b.h/2, r = Math.min(b.w, b.h)*.32;
  el('circle', {cx, cy, r:r+7, fill:'#E4DCC6', stroke:'#C4BBA3', 'stroke-width':1}, g);
  el('circle', {cx, cy, r, fill:'#DCE3C4', stroke:'#B7C498', 'stroke-width':1.2}, g);
  el('circle', {cx, cy, r:r*.3, fill:'#EFE9D8', stroke:'#C4BBA3', 'stroke-width':1}, g);
  el('rect', {x:cx-2, y:cy-9, width:4, height:18, fill:'#24271D'}, g);
  [[.28,.86],[.72,.86],[.28,.12],[.72,.12]].forEach(p =>
    el('rect', {x:b.x+b.w*p[0]-8, y:b.y+b.h*p[1]-2.5, width:16, height:5, rx:1.5, fill:'#24271D', opacity:.6}, g));
  [[.08,.35],[.08,.68],[.92,.35],[.92,.68]].forEach(p =>
    drawTreeAt(g, b.x+b.w*p[0], b.y+b.h*p[1], 6.5 + rnd()*2, rnd()));
}
function fAud(g, b){
  const x = b.x+6, y = b.y+6, w = b.w-12, h = b.h-12;
  el('rect', {x:x+5, y:y+6, width:w, height:h, rx:10, fill:'#CFC7B0'}, g);
  el('rect', {x, y, width:w, height:h, rx:10, fill:'#FBF7EC', stroke:'#2C3024', 'stroke-width':1.5}, g);
  el('rect', {x, y, width:w, height:h, rx:10, fill:'url(#hatch)'}, g);
  const cx = x+w/2, cy = y+h*.5;
  el('rect', {x:x+w*.32, y:y+h*.1, width:w*.36, height:h*.2, fill:'#2C3024', opacity:.22}, g);
  for (let i = 1; i <= 3; i++)
    el('ellipse', {cx, cy, rx:w*(.42-i*.1), ry:h*(.38-i*.09), fill:'none', stroke:'#2C3024',
      'stroke-width':1, opacity:.32, 'stroke-dasharray':'4 4'}, g);
  el('rect', {x:x+w*.3, y:y+h*.78, width:w*.4, height:h*.15, fill:'#EFE9D8', stroke:'#2C3024', 'stroke-width':1.2}, g);
}
function fBath(g, b, z){
  const ink = 'rgba(36,39,29,.62)';
  const baseY = b.y + b.h*.6, ph = Math.min(b.h*.46, b.w*.5), hr = ph*.19;
  const shW = ph*.46, waW = ph*.28, sep = Math.min(b.w*.14, 12);
  [-1, 1].forEach(sg => {
    const px = b.x + b.w/2 + sg*sep;
    el('circle', {cx:px, cy:baseY-ph+hr, r:hr, fill:ink}, g);
    const ty = baseY - ph + hr*2.4;
    el('path', {d:`M${(px-shW/2).toFixed(1)},${ty.toFixed(1)} L${(px+shW/2).toFixed(1)},${ty.toFixed(1)} L${(px+waW/2).toFixed(1)},${baseY.toFixed(1)} L${(px-waW/2).toFixed(1)},${baseY.toFixed(1)} Z`,
      fill:ink, stroke:ink, 'stroke-width':1, 'stroke-linejoin':'round'}, g);
  });
  /* puerta: hoja y arco de giro sobre el borde inferior */
  const dw = Math.min(b.w*.26, 16), dx = b.x + Math.max(b.w*.09, 6), dy = b.y + b.h - 2.5;
  el('line', {x1:dx, y1:dy, x2:dx, y2:dy-dw, stroke:ink, 'stroke-width':1.6}, g);
  el('path', {d:`M${dx},${(dy-dw).toFixed(1)} A${dw} ${dw} 0 0 1 ${(dx+dw).toFixed(1)},${dy}`,
    fill:'none', stroke:ink, 'stroke-width':.9, 'stroke-dasharray':'2.5 2'}, g);
}
function fPool(g, b, z){
  const x = b.x+4, y = b.y+4, w = b.w-8, h = b.h-8;
  el('rect', {x, y, width:w, height:h, rx:Math.min(14, h*.22), fill:'#8FC7D4', opacity:.85,
    stroke:'#4E93A6', 'stroke-width':1.2}, g);
  for (let i = 1; i <= 4; i++)
    el('line', {x1:x+w*i/5, y1:y+h*.08, x2:x+w*i/5, y2:y+h*.92, stroke:'#FFFFFF',
      'stroke-width':2, 'stroke-dasharray':'9 7', opacity:.85}, g);
  /* escalera de 3 peldaños en el borde izquierdo */
  const l1 = x+w*.055, l2 = l1+6, lt = y+h*.3, lb = lt+h*.4;
  el('line', {x1:l1, y1:lt, x2:l1, y2:lb, stroke:'#F4FBFD', 'stroke-width':1.7}, g);
  el('line', {x1:l2, y1:lt, x2:l2, y2:lb, stroke:'#F4FBFD', 'stroke-width':1.7}, g);
  for (let i = 1; i <= 3; i++)
    el('line', {x1:l1, y1:lt+(lb-lt)*i/4, x2:l2, y2:lt+(lb-lt)*i/4, stroke:'#F4FBFD', 'stroke-width':1.4}, g);
  /* ondas decorativas */
  [[.63,.2],[.68,.8]].forEach(p =>
    el('path', {d:`M${(x+w*p[0]).toFixed(1)},${(y+h*p[1]).toFixed(1)} q5,-5 10,0 q5,5 10,0`,
      fill:'none', stroke:'#FFFFFF', 'stroke-width':1.4, opacity:.85, 'stroke-linecap':'round'}, g));
}
function fShed(g, b, z){
  el('rect', {x:b.x+3, y:b.y+3, width:b.w-6, height:b.h-6, fill:'url(#shedHatch)'}, g);
  const cx = b.x+b.w/2, cy = b.y+b.h/2;
  const bw = Math.min(b.w*.36, 46), bh = Math.min(b.h*.21, 16), gap = 3;
  [[cy-bh-gap/2, bw], [cy+gap/2, bw*.8]].forEach(([ry, rw], i) => {
    el('rect', {x:cx-rw/2, y:ry, width:rw, height:bh, fill:'#FBF7EC', stroke:'#2C3024', 'stroke-width':1.3}, g);
    if (!i) el('line', {x1:cx, y1:ry, x2:cx, y2:ry+bh, stroke:'#2C3024', 'stroke-width':.9, opacity:.6}, g);
    else el('line', {x1:cx-rw/2, y1:ry+bh/2, x2:cx+rw/2, y2:ry+bh/2, stroke:'#2C3024', 'stroke-width':.8, opacity:.5}, g);
  });
}
const INTERIORS = {bldg:fBld, pitch:fPitch, lot:fLot, plaza:fPlaza, aud:fAud, bath:fBath, pool:fPool, shed:fShed};

const ICON_KEYS = ['aula','labComp','labRob','labIng','labArte','labSalud','oficina','bano','bodega','pasillo','escala','otro'];

      add('path', {d:'M10.1 12.4c0-2.7 4.4-2.7 4.4 0'});
      break;
    case 'labRob': /* brazo articulado */
      add('rect', {x:3, y:13, width:6, height:1.4});
      add('path', {d:'M6 13V9.2M6 9.2l4.6-3.6'});
      el('circle', Object.assign({cx:6, cy:9.2, r:1.15}, f), g);
      el('circle', Object.assign({cx:10.6, cy:5.6, r:1.15}, s), g);

    case 'labIng': /* engranaje */

      break;
    case 'labArte': /* paleta */
      add('path', {d:'M8 3.1c3.5 0 5.9 2.2 5.9 5 0 2.5-2 3.5-3.3 3.5-1.1 0-1.3-.8-2-.8-.8 0-.9 1.1-2.4 1.1-2.3 0-4-2-4-4 0-2.8 2.3-4.8 5.8-4.8Z'});
      el('circle', Object.assign({cx:5.4, cy:7.1, r:.95}, f), g);
      el('circle', Object.assign({cx:8, cy:5.6, r:.95}, f), g);
      el('circle', Object.assign({cx:10.6, cy:7.1, r:.95}, f), g);
      break;
    case 'labSalud': /* cruz */
      el('path', Object.assign({d:'M6.7 3h2.6v3.7H13v2.6H9.3V13H6.7V9.3H3V6.7h3.7Z'}, f), g);
      break;
    case 'oficina': /* escritorio + silla */
      add('rect', {x:2.4, y:6.6, width:7.4, height:1.7});
      add('path', {d:'M3.6 8.3v4.5M8.6 8.3v4.5M3.9 6.6V4.3h3.9'});
      add('rect', {x:11.2, y:8.9, width:2.8, height:1.5});
      add('path', {d:'M12.6 8.9V6.2M11.4 6.2h2.4M11.9 10.4v2.4M13.3 10.4v2.4'});

    case 'bano': /* pictogramas de persona */
      el('circle', Object.assign({cx:5.3, cy:4.2, r:1.35}, f), g);

      el('circle', Object.assign({cx:10.7, cy:4.2, r:1.35}, f), g);

function iconEl(key, size, ink){
  const s = document.createElementNS(NS, 'svg');
  s.setAttribute('width', size); s.setAttribute('height', size);

  roomIcon(s, key, 0, 0, 16, ink);

/* =====================================================================
   RENDER DE ÍTEMS (parameterizado: live y export comparten el dibujo)
==================================================================== */
function textOn(hex){
  try{
    const c = hex.replace('#','');
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    return (r*299 + g*587 + b*114)/1000 >= 150 ? '#20241A' : '#FBF8EE';
  } catch(e){ return '#FBF8EE'; }
}
function wrapText(str, maxChars, maxLines){
  const words = String(str || '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const lines = []; let cur = '';
  for (const w of words){
    if ((cur ? cur+' ' : '').length + w.length <= maxChars) cur = cur ? cur+' '+w : w;
    else { lines.push(cur); cur = w; if (lines.length >= maxLines) break; }
  }
  if (cur && lines.length < maxLines) lines.push(cur);
  if (lines.join(' ') !== words.join(' ')) lines[lines.length-1] += '…';
  return lines.slice(0, maxLines);
}

function buildItemNodeInto(z, clipParent, forExport){
  const g = el('g', {'data-id': z.id});
  const c = itemCenter(z), b = polyBBox(z.poly);
  const rw = el('g', {class:'rotwrap', transform: rotStr(z)}, g);

  const cid = 'clip-' + z.id;
  const old = clipParent.querySelector('#' + CSS.escape(cid));
  if (old) old.remove();
  const cp = el('clipPath', {id: cid}, clipParent);
  el('path', {d: polyPath(z.poly)}, cp);
  const inner = el('g', {'clip-path': `url(#${cid})`}, rw);
  (INTERIORS[z.kind] || (()=>{}))(inner, b, z);

  el('path', {d: polyPath(z.poly), fill: z.color, 'fill-opacity': z.opacity ?? .24, stroke: z.color,
    'stroke-width': 2.4, 'stroke-linejoin':'round', class:'ov'}, rw);

  const lm = doc().labelMode;
  if (lm !== 'none'){
    const code = String(z.code || '—'), cw = code.length*8.5 + 15;
    const lg = el('g', {transform:`translate(${c.x.toFixed(1)} ${c.y.toFixed(1)})`, class:'lbl'}, g);
    if (lm === 'code'){
      el('rect', {x:-cw/2, y:-10, width:cw, height:20, rx:3, fill:z.color, stroke:'rgba(20,22,16,.35)'}, lg);
      txt(lg, code, {x:0, y:4.5, 'text-anchor':'middle', class:'ft-m', 'font-weight':700,
        'font-size':12.5, fill:textOn(z.color), 'letter-spacing':.5});
    } else {
      el('rect', {x:-cw/2, y:-34, width:cw, height:20, rx:3, fill:z.color, stroke:'rgba(20,22,16,.35)'}, lg);
      txt(lg, code, {x:0, y:-19.5, 'text-anchor':'middle', class:'ft-m', 'font-weight':700,
        'font-size':12.5, fill:textOn(z.color), 'letter-spacing':.5});
      if (Math.max(b.w, b.h) > 105){
        const usable = Math.max(b.w, 110);
        wrapText(z.name, Math.floor(usable/6.3), 2).forEach((ln, i) =>
          txt(lg, ln, {x:0, y:(i ? 12 : -1), 'text-anchor':'middle', class:'ft-s', 'font-weight':600,
            'font-size':12.5, fill:'#23261C', stroke:'#F4F0E1', 'stroke-width':4, 'paint-order':'stroke', 'stroke-linejoin':'round'}));
      }
    }
  }
  /* chip de interiores (también en exportes PNG/PDF página 1 — T5) */
  if (z.kind === 'bldg' || z.kind === 'aud'){
    const nLv = Math.max(1, Math.round(+z.nLevels || 1));
    const nRm = Array.isArray(z.rooms) ? z.rooms.length : 0;
    if (nLv > 1 || nRm > 0){
      const lbl = nLv > 1 ? '×' + nLv : nRm + ' amb.';
      const iconW = nLv > 1 ? 13 : 0;   /* mini escalera para multi-nivel */
      const cw2 = lbl.length * 7 + 12 + iconW;
      const wb = polyBBox(z.poly.map(p => worldPt(z, p)));
      const bg = el('g', {class:'bbadge'}, g);
      el('title', {}, bg).textContent = 'Doble clic para editar los ambientes interiores';
      el('rect', {x:wb.x + wb.w - cw2 - 5, y:wb.y + 5, width:cw2, height:16, rx:2, fill:'#24271D',
        stroke:'rgba(248,244,231,.3)', 'stroke-width':1}, bg);
      if (nLv > 1){
        const ig = el('g', {transform:`translate(${(wb.x + wb.w - cw2 - 2).toFixed(1)} ${(wb.y + 8).toFixed(1)}) scale(0.7)`}, bg);
        el('path', {d:'M1 9h2.6V6.4h2.6V3.8h2.6V1.2h2.6', fill:'none', stroke:'#F8F4E7',
          'stroke-width':1.6, 'stroke-linecap':'square'}, ig);
      }

        'font-weight':700, 'font-size':10, fill:'#F8F4E7', 'letter-spacing':.5});

function applyZoneStyle(z){

const SCALE_KEYS = ['nw','ne','se','sw'];
const DETAIL_SCALE_KEYS = [...SCALE_KEYS, 'n', 'e', 's', 'w'];
function renderHandles(){
  gUi.innerHTML = '';
  if (state.terrainEdit){
    drawVertexHandles(gUi, state.terrain.points, 'terrain');
    return;
  }
  const z = getSel();
  if (!z || z.visible === false || state.tool !== 'select' || z.locked) return;
  drawVertexHandles(gUi, z.poly.map(p => worldPt(z, p)), 'item');
  const b = polyBBox(z.poly), c = itemCenter(z);
  SCALE_KEYS.forEach(k => {
    const hx = k.includes('w') ? b.x : b.x+b.w, hy = k.includes('n') ? b.y : b.y+b.h;
    const w = rotatePoint({x:hx, y:hy}, c, z.rot || 0);
    el('rect', {x:w.x-5.5, y:w.y-5.5, width:11, height:11, fill:'#F8F4E7', stroke:'#20241A',
      'stroke-width':1.5, 'data-scale':k, style:'cursor:nwse-resize'}, gUi);
  });
  const rh = rotatePoint({x:c.x, y:b.y-28}, c, z.rot || 0);
  el('line', {x1:c.x, y1:c.y, x2:rh.x, y2:rh.y, stroke:'#20241A', 'stroke-width':1.4, opacity:.75}, gUi);

}
function drawVertexHandles(g, pts, owner){
  if (pts.length <= 14){
    for (let i = 0; i < pts.length; i++){
      const a = pts[i], bp = pts[(i+1)%pts.length];
      const mx = (a.x+bp.x)/2, my = (a.y+bp.y)/2;
      el('path', {d:`M${mx-4},${my} L${mx},${my-4} L${mx+4},${my} L${mx},${my+4} Z`, fill:'#F8F4E7',
        stroke:'#7A7D6A', 'stroke-width':1.2, 'data-mid':i, 'data-owner':owner, style:'cursor:copy'}, g);
    }
  }
  pts.forEach((p, i) =>
    el('circle', {cx:p.x, cy:p.y, r:6, fill:'#F8F4E7', stroke:'#B04A26', 'stroke-width':2,
      'data-vidx':i, 'data-owner':owner, style:'cursor:move'}, g));
}

}

function addDrawVertex(p){
  if (!state.drawing) state.drawing = {pts: [], mode: 'click'};
  const d = state.drawing;
  if (d.pts.length >= 3){
    const f = d.pts[0];
    if (Math.hypot(p.x-f.x, p.y-f.y) < 14/screenScale()){ closeDrawing(); return; }
  }
  d.pts.push({x: grid(p.x), y: grid(p.y)});
}
function popDrawVertex(){ if (state.drawing && state.drawing.mode === 'click') state.drawing.pts.pop(); }
function cancelDrawing(){ state.drawing = null; gPreview.innerHTML = ''; if (state.tool !== 'select') setHint(HINTS[state.tool] || ''); }
function closeDrawing(){
  const d = state.drawing; if (!d) return;
  if (d.pts.length >= 2){
    const a = d.pts[d.pts.length-1], b = d.pts[d.pts.length-2];
    if (Math.hypot(a.x-b.x, a.y-b.y) < 6) d.pts.pop();
  }
  const pts = d.pts.slice();
  const isTerrain = state.tool === 'terrainDraw';
  state.drawing = null; gPreview.innerHTML = '';
  if (pts.length < 3){ setHint(HINTS[state.tool] || ''); toast('Se necesitan al menos 3 vértices.', 'warn'); return; }
  if (isTerrain){
    pushUndo();
    state.terrain.points = pts;
    buildTerrain(); save(); renderEditor(); renderHandles();
    toast('Límite del campus redibujado.');
    setTool('select');
  } else openNewZone(pts);
}
function drawDrawingPreview(cursorP){
  const d = state.drawing; if (!d) return;
  const col = state.tool === 'terrainDraw' ? '#C7351F' : '#B04A26';
  if (d.pts.length > 1)
    el('path', {d: 'M' + d.pts.map(p => p.x+' '+p.y).join('L'), fill:'none', stroke:col, 'stroke-width':2.2, 'stroke-dasharray':'9 6'}, gPreview);
  if (d.pts.length && cursorP)
    el('line', {x1:d.pts[d.pts.length-1].x, y1:d.pts[d.pts.length-1].y, x2:cursorP.x, y2:cursorP.y,

function drawStampGhost(p){

  const g = el('g', {transform:`translate(${p.x - s.w/2} ${p.y - s.h/2})`, opacity:.75}, gPreview);
  el('rect', {x:0, y:0, width:s.w, height:s.h, fill:'#B04A26', 'fill-opacity':.12,

function drawToolGhost(p){

    const r = doc().brushR;
    el('circle', {cx:p.x, cy:p.y, r:r+5, fill:'#3F8C4F', 'fill-opacity':.1, stroke:'#3F8C4F', 'stroke-width':1.2, 'stroke-dasharray':'4 4'}, gPreview);

function nextCode(prefix){
  let i = 1;
  while (state.items.some(z => z.code === prefix + i)) i++;
  return prefix + i;
}
function nextColor(){
  const used = state.items.map(z => (z.color||'').toLowerCase());
  return PALETTE.find(c => !used.includes(c.toLowerCase())) || '#6E6E66';
}
function placeStamp(p){
  const s = STAMPS[state.stampKind];
  const poly = rectPts(grid(p.x - s.w/2), grid(p.y - s.h/2), s.w, s.h);
  pushUndo();
  const n = state.items.filter(z => z.kind === state.stampKind).length + 1;
  const z = {id: uid(), kind: state.stampKind, code: nextCode(s.code), name: s.name + (n > 1 ? ' ' + n : ''),
    desc:'', color: nextColor(), visible:true, rot:0, poly};
  state.items.push(z);
  updateItemNode(z); select(z.id); save();
  toast(`Zona colocada: ${s.name} — girala con la manija R o tecleá grados exactos en el panel.`);
}

function select(id){

  if (id !== '__terrain') state.terrainEdit = false;
  state.items.forEach(applyZoneStyle);

  if (item) item.scrollIntoView({block:'nearest'});

  if (zz && (zz.kind === 'bldg' || zz.kind === 'aud') && !dblHintShown){

  }
}
function setTerrainEdit(on){
  state.terrainEdit = on; state.sel = on ? '__terrain' : state.sel;
  setHint(on ? 'Editá el contorno: arrastrá los puntos · ◇ inserta vértice · <kbd>ALT</kbd>+clic elimina · <kbd>ESC</kbd> termina' : '');

  renderHandles(); renderEditor();

svg.addEventListener('contextmenu', e => e.preventDefault());

svg.addEventListener('pointerdown', e => {
  try{
    if (e.button === 2 || e.button === 1){ drag = {type:'pan', start:{x:e.clientX, y:e.clientY}, orig:{...view}}; stage.classList.add('panning'); return; }
    if (e.button !== 0) return;
    e.preventDefault();
    const p = svgPoint(e);

    if (state.tool === 'stamp'){ placeStamp(p); return; }
    if (state.tool === 'poly' || state.tool === 'terrainDraw'){ addDrawVertex(p); return; }
    if (state.tool === 'brush'){ const snap = snapshot(); drag = {type:'brush', last: plantTree(p), added: 1, snap}; return; }
    if (state.tool === 'eraser'){ const snap = snapshot(); const n = eraseNear(p, doc().eraserR); drag = {type:'erase', erased: n, snap}; return; }
    if (state.tool === 'free'){ state.drawing = {pts:[{x:grid(p.x), y:grid(p.y)}], mode:'free'}; drag = {type:'free'}; return; }

    const t = e.target;
    const vAttr = t.getAttribute && t.getAttribute('data-vidx');
    if (vAttr !== null && vAttr !== undefined && !isNaN(+vAttr)){
      const owner = t.getAttribute('data-owner');
      if (e.altKey){ deleteVertex(owner, +vAttr); return; }
      const arr = owner === 'terrain' ? state.terrain.points : (getSel() && !getSel().locked ? getSel().poly : null);
      if (arr) drag = {type:'vertex', owner, idx:+vAttr, z: owner === 'item' ? getSel() : null, snap:snapshot(), moved:false};
      return;
    }
    const mAttr = t.getAttribute && t.getAttribute('data-mid');
    if (mAttr !== null && mAttr !== undefined && !isNaN(+mAttr)){
      const owner = t.getAttribute('data-owner');
      const arr = owner === 'terrain' ? state.terrain.points : (getSel() && !getSel().locked ? getSel().poly : null);
      if (arr){
        const i = +mAttr;
        pushUndo();
        arr.splice(i+1, 0, {x: arr[i].x, y: arr[i].y});
        drag = {type:'vertex', owner, idx:i+1, z: owner === 'item' ? getSel() : null, snap:null, moved:true};
        if (owner === 'terrain') buildTerrain(); else updateItemNode(getSel());
        renderHandles();
      }
      return;
    }
    const sAttr = t.getAttribute && t.getAttribute('data-scale');
    if (sAttr){
      const z = getSel(); if (!z || z.locked) return;
      drag = {type:'scale', z, key:sAttr, orig: z.poly.map(q => ({...q})),
        orooms: (z.rooms || []).map(r => ({...r, poly: r.poly.map(p => ({...p}))})), snap:snapshot()};
      return;
    }
    if (t.getAttribute && t.getAttribute('data-rot')){
      const z = getSel(); if (!z || z.locked) return;
      const c = itemCenter(z);
      drag = {type:'rot', z, c, a0: Math.atan2(p.y-c.y, p.x-c.x), rot0: z.rot || 0, snap:snapshot()};
      return;
    }

    const zg = t.closest ? t.closest('g[data-id]') : null;
    if (zg){
      const z = itemById(zg.getAttribute('data-id'));
      if (z){
        if (state.sel !== z.id) select(z.id);
        if (!z.locked) drag = {type:'move', z, start:p, snap:snapshot(), moved:false};
        else { drag = {type:'pan', start:{x:e.clientX, y:e.clientY}, orig:{...view}}; stage.classList.add('panning'); }
      }
      return;
    }
    if (t.closest && t.closest('#gTerrain')){
      if (state.sel !== '__terrain' || !state.terrainEdit) select('__terrain');
      if (state.terrainEdit) return;
    }
    drag = {type:'pan', start:{x:e.clientX, y:e.clientY}, orig:{...view}, moved:false};
    stage.classList.add('panning');
  }catch(err){ fail('plano (clic)', err); drag = null; stage.classList.remove('panning'); }
});

let fullRaf = null;
function scheduleFullItem(z){
  if (fullRaf) return;
  fullRaf = requestAnimationFrame(() => { fullRaf = null; updateItemNode(z); renderHandles(); });
}

window.addEventListener('pointermove', e => {
  try{
    if (drag){
      if (drag.type === 'pan'){
        const sc = screenScale();
        view.x = drag.orig.x - (e.clientX - drag.start.x)/sc;
        view.y = drag.orig.y - (e.clientY - drag.start.y)/sc;
        applyView();
      }
      else if (drag.type === 'free'){
        const p = svgPoint(e), d = state.drawing;
        if (d){
          const last = d.pts[d.pts.length-1];
          if (Math.hypot(p.x-last.x, p.y-last.y) > 6/screenScale()) d.pts.push({x:grid(p.x), y:grid(p.y)});
          gPreview.innerHTML = ''; drawDrawingPreview(p);
        }
      }
      else if (drag.type === 'brush'){
        const p = svgPoint(e);
        if (Math.hypot(p.x-drag.last.x, p.y-drag.last.y) > doc().brushR*1.05){ drag.last = plantTree(p); drag.added++; }
        gPreview.innerHTML = ''; drawToolGhost(p);
      }
      else if (drag.type === 'erase'){
        const p = svgPoint(e);
        drag.erased += eraseNear(p, doc().eraserR);
        gPreview.innerHTML = ''; drawToolGhost(p);
      }
      else if (drag.type === 'move'){
        const p = svgPoint(e), z = drag.z;
        if (!drag.moved && Math.hypot(p.x-drag.start.x, p.y-drag.start.y) < 4/screenScale()) return;
        drag.moved = true;
        const step = doc().snap ? 10 : 5;
        const dx = Math.round((p.x-drag.start.x)/step)*step, dy = Math.round((p.y-drag.start.y)/step)*step;
        drag.tf = {kind:'move', dx, dy};
        const g = gItems.querySelector(`g[data-id="${z.id}"]`);
        if (g) g.setAttribute('transform', tfAttr(drag.tf));
        gUi.setAttribute('transform', tfAttr(drag.tf));
        ttShow(`<span class="tt-name">${escapeHtml(z.name || 'Sin nombre')}</span>`, e.clientX, e.clientY);
      }
      else if (drag.type === 'vertex'){
        const p = svgPoint(e), z = drag.z;
        drag.moved = true;
        const arr = drag.owner === 'terrain' ? state.terrain.points : (z ? z.poly : null);
        if (arr){
          const lp = z ? localPt(z, p) : p;
          arr[drag.idx] = {x: grid(lp.x), y: grid(lp.y)};
          if (drag.owner === 'terrain'){
            buildTerrain();
          } else if (z){
            const g = gItems.querySelector(`g[data-id="${z.id}"]`);
            if (g){
              g.querySelector('.ov').setAttribute('d', polyPath(z.poly));
              const cp = document.getElementById('clip-'+z.id);
              if (cp) cp.querySelector('path').setAttribute('d', polyPath(z.poly));
              const c = itemCenter(z), lg = g.querySelector('.lbl');
              if (lg) lg.setAttribute('transform', `translate(${c.x.toFixed(1)} ${c.y.toFixed(1)})`);
            }
            scheduleFullItem(z);
          }
          renderHandles();
          const cur = drag.owner === 'terrain' ? state.terrain.points : z.poly;
          ttShow(`<span class="tt-name">${cur.length} vértices</span>`, e.clientX, e.clientY);
        }
      }
      else if (drag.type === 'scale'){
        const p = svgPoint(e), z = drag.z, o = polyBBox(drag.orig);
        const lp = localPt(z, p);
        let x0=o.x, y0=o.y, x1=o.x+o.w, y1=o.y+o.h;
        if (drag.key.includes('w')) x0 = Math.min(lp.x, x1-40);
        if (drag.key.includes('e')) x1 = Math.max(lp.x, x0+40);
        if (drag.key.includes('n')) y0 = Math.min(lp.y, y1-32);
        if (drag.key.includes('s')) y1 = Math.max(lp.y, y0+32);
        const ax = drag.key.includes('w') ? x1 : x0, ay = drag.key.includes('n') ? y1 : y0;
        const tf = {kind:'scale', ax, ay, sx:(x1-x0)/o.w, sy:(y1-y0)/o.h};
        drag.tf = tf;
        z.poly = drag.orig.map(q => tfPoint(q, tf));
        scheduleFullItem(z);
      }
      else if (drag.type === 'rot'){
        const p = svgPoint(e), z = drag.z;
        let deg = drag.rot0 + (Math.atan2(p.y-drag.c.y, p.x-drag.c.x) - drag.a0) * 180/Math.PI;
        if (e.shiftKey) deg = Math.round(deg/15)*15;
        z.rot = norm360(deg);
        const rw = gItems.querySelector(`g[data-id="${z.id}"] .rotwrap`);
        if (rw) rw.setAttribute('transform', rotStr(z));
        renderHandles();
        ttShow(`<span class="tt-name">${(z.rot).toFixed(1)}° · Shift: ajuste a 15°</span>`, e.clientX, e.clientY);
      }
      return;
    }
    if (e.target.closest && (e.target.closest('#toolbar') || e.target.closest('#legend') || e.target.closest('#brushOpts') || e.target.closest('aside') || e.target.closest('header'))) return;
    const p = svgPoint(e);
    if (state.tool === 'stamp'){ gPreview.innerHTML = ''; drawStampGhost(p); return; }
    if (state.tool === 'brush' || state.tool === 'eraser'){ gPreview.innerHTML = ''; drawToolGhost(p); return; }
    if (state.drawing){ gPreview.innerHTML = ''; drawDrawingPreview(p); return; }
    const zg = e.target.closest ? e.target.closest('g[data-id]') : null;
    if (zg){
      const id = zg.getAttribute('data-id'), z = itemById(id);
      if (z && z.visible !== false){
        if (hoverZone !== id){ hoverZone = id; state.items.forEach(applyZoneStyle); }
        const r = stage.getBoundingClientRect();
        ttShow(`<span class="tt-code" style="background:${z.color};color:${textOn(z.color)}">${escapeHtml(z.code || '—')}</span>
          <div class="tt-name">${escapeHtml(z.name || 'Sin nombre')}</div>
          ${z.desc ? `<div class="tt-desc">${escapeHtml(z.desc)}</div>` : ''}
          <div class="tt-hint">${z.rot ? z.rot.toFixed(0)+'° · ' : ''}${z.locked ? 'bloqueada' : (z.kind === 'bldg' || z.kind === 'aud') ? 'clic: editar · doble clic: interiores' : 'clic: editar · doble clic: enfocar'}</div>`, e.clientX - r.left, e.clientY - r.top);
        return;
      }
    }

});

window.addEventListener('pointerup', () => {
  if (!drag) return;
  try{
    if (drag.type === 'free'){
      const d = state.drawing;
      if (d && d.pts.length > 2){
        const pts = douglasPeucker(d.pts, 5);
        state.drawing = null; gPreview.innerHTML = '';
        if (pts.length >= 3) openNewZone(pts);
        else { toast('El trazo fue demasiado corto.', 'warn'); setHint(HINTS.free); }
      } else { cancelDrawing(); setHint(HINTS.free); }
    }
    else if (drag.type === 'brush'){
      if (drag.added > 0) pushUndoAt(drag.snap);
      gPreview.innerHTML = ''; save();
    }
    else if (drag.type === 'erase'){
      if (drag.erased > 0){ pushUndoAt(drag.snap); save(); toast(drag.erased === 1 ? '1 árbol eliminado.' : drag.erased + ' árboles eliminados.'); }
      gPreview.innerHTML = '';
    }
    else if (drag.type === 'move'){
      const g = gItems.querySelector(`g[data-id="${drag.z.id}"]`);
      if (g) g.removeAttribute('transform');
      gUi.removeAttribute('transform');
      if (drag.moved && drag.tf){
        drag.z.poly = drag.z.poly.map(p => tfPoint(p, drag.tf));
        if (drag.z.rooms && drag.z.rooms.length)
          drag.z.rooms.forEach(r => r.poly = r.poly.map(p => tfPoint(p, drag.tf)));
        updateItemNode(drag.z); pushUndoAt(drag.snap); save(); renderEditor();
      }
      renderHandles(); ttHide();
    }
    else if (drag.type === 'vertex' && drag.moved){
      if (drag.snap) pushUndoAt(drag.snap);
      if (drag.z) updateItemNode(drag.z);
      save(); renderHandles(); renderEditor();
      ttHide();
    }
    else if (drag.type === 'scale' && drag.tf){
      if (drag.orooms && drag.orooms.length)
        drag.z.rooms = drag.orooms.map(r => ({...r, poly: r.poly.map(q => tfPoint(q, drag.tf))}));
      updateItemNode(drag.z); pushUndoAt(drag.snap); save(); renderEditor();
      ttHide();
    }
    else if (drag.type === 'rot'){
      updateItemNode(drag.z); pushUndoAt(drag.snap); save(); renderEditor();
      ttHide();
    }
  }catch(err){ fail('plano (soltar)', err); }
  stage.classList.remove('panning');
  drag = null;
});

function deleteVertex(owner, idx){
  const arr = owner === 'terrain' ? state.terrain.points : (getSel() && !getSel().locked ? getSel().poly : null);
  if (!arr) return;
  if (arr.length <= 3){ toast('Un polígono necesita al menos 3 vértices.', 'warn'); return; }
  pushUndo();
  arr.splice(idx, 1);
  if (owner === 'terrain') buildTerrain();
  else updateItemNode(getSel());
  renderHandles(); save(); renderEditor();
}

/* =====================================================================
   PAN / ZOOM
==================================================================== */
function applyView(){ svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`); }
function zoomAt(mx, my, factor){
  const nw = clamp(view.w/factor, 140, 4000), nh = nw/RATIO;
  view.x = mx - (mx-view.x)*(nw/view.w);
  view.y = my - (my-view.y)*(nh/view.h);
  view.w = nw; view.h = nh;
  applyView();
}
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const p = svgPoint(e);
  zoomAt(p.x, p.y, Math.pow(1.0016, -e.deltaY));
}, {passive:false});

function animateViewTo(target){
  cancelAnimationFrame(animId);
  const s = {...view}, t0 = performance.now(), dur = 500;
  const step = t => {
    const k = Math.min(1, (t-t0)/dur), e = 1 - Math.pow(1-k, 3);
    view.x = s.x + (target.x-s.x)*e; view.y = s.y + (target.y-s.y)*e;
    view.w = s.w + (target.w-s.w)*e; view.h = s.h + (target.h-s.h)*e;
    applyView();
    if (k < 1) animId = requestAnimationFrame(step);
  };
  animId = requestAnimationFrame(step);
}
function fitBounds(b, padRatio){
  let w = b.w, h = b.h;
  if (w/h < RATIO) w = h*RATIO; else h = w/RATIO;
  if (w < 600){ w = 600; h = w/RATIO; }
  animateViewTo({x: b.x + b.w/2 - w/2, y: b.y + b.h/2 - h/2, w, h});
}
function focusPoly(poly, pad = 100){
  const b = polyBBox(poly);
  let w = b.w + pad*2, h = b.h + pad*2;
  if (w/h < RATIO) w = h*RATIO; else h = w/RATIO;
  animateViewTo({x: b.x + b.w/2 - w/2, y: b.y + b.h/2 - h/2, w, h});
}

/* ---- T6 · búsqueda global de ambientes (nombre, código y categoría) ---- */
const normTxt = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const ROOM_HIT_MAX = 30;
function globalRoomHits(qn){
  const out = [];
  state.items.forEach(z => {
    if (z.kind !== 'bldg' && z.kind !== 'aud') return;
    const rooms = Array.isArray(z.rooms) ? z.rooms : [];
    if (!rooms.length) return;
    rooms.forEach(r => {
      const cat = catOf(r.cat);
      const hay = normTxt([r.name, r.code, cat.name, cat.code, z.name].join(' '));
      if (hay.includes(qn)) out.push({b:z, r});
    });
  });
  /* ordenadas por edificio (orden del campus); dentro de cada uno, por nivel y código */
  out.sort((a, c) => a.b !== c.b ? 0 :
    ((a.r.level || 0) - (c.r.level || 0)) || String(a.r.code || '').localeCompare(String(c.r.code || '')));
  return out.slice(0, ROOM_HIT_MAX);
}
function goToRoom(bId, roomId){
  const b = itemById(bId); if (!b) return;
  const r = (Array.isArray(b.rooms) ? b.rooms : []).find(x => x.id === roomId); if (!r) return;
  const same = DET.open && DET.bId === bId;
  if (!same) openDetail(bId);
  DET.level = clamp(r.level || 0, 0, Math.max(1, Math.round(+b.nLevels || 1)) - 1);
  DET.sel = roomId; DET.filter = null; DET.burst = false;
  if (same){ setDetailTool('select'); dCenterRoom(r); }
  else {
    detailRenderHead(); detailRenderSide();
    DET.pendingSel = roomId;   /* detailFit centra el ambiente al terminar el encuadre */
  }
  toast(`Ambiente encontrado: ${r.name || catOf(r.cat).name} (${b.name || 'Edificio'}, ${lvlLabel(b, DET.level)})`);
}
