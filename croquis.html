<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Croquis — Editor de plano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#F2EDDF; --paper2:#E7E0CC; --paper3:#F8F4E7;
    --ink:#24271D; --ink2:#565A4A; --line:#C8C0A8;
    --accent:#B04A26; --danger:#A32814;
    --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
    --sans:'Archivo','Trebuchet MS',sans-serif;
    --hard:3px 3px 0 rgba(36,39,29,.22);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:var(--paper2); color:var(--ink); font-family:var(--sans); overflow:hidden}

  #errbar{
    position:fixed; top:0; left:0; right:0; z-index:300; display:none;
    background:var(--danger); color:#FBF8EE; font:600 12px var(--mono);
    padding:8px 14px; letter-spacing:.3px; cursor:pointer;
  }
  #errbar.on{display:block}

  header{
    height:62px; display:flex; align-items:center; gap:16px; padding:0 18px;
    background:var(--paper); border-bottom:2px solid var(--ink); position:relative; z-index:20;
  }
  .brand{display:flex; align-items:center; gap:12px; min-width:0}
  .brand-mark{width:40px;height:40px;flex:none;background:var(--ink);display:grid;place-items:center;color:var(--paper)}
  .brand h1{font-size:17px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;line-height:1.1;white-space:nowrap}
  .brand .sub{font:400 10px var(--mono);color:var(--ink2);letter-spacing:1.4px;text-transform:uppercase;white-space:nowrap}
  .actions{margin-left:auto;display:flex;gap:10px;align-items:center}

  .btn{
    display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--ink);
    background:var(--paper3);color:var(--ink);padding:8px 13px;font:600 12px var(--sans);
    letter-spacing:.3px;cursor:pointer;box-shadow:2.5px 2.5px 0 rgba(36,39,29,.2);
    transition:transform .12s, box-shadow .12s; user-select:none; touch-action:manipulation;
  }
  .btn:hover{transform:translate(-1px,-1px);box-shadow:3.5px 3.5px 0 rgba(36,39,29,.26)}
  .btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(36,39,29,.2)}
  .btn.primary{background:var(--ink);color:var(--paper)}
  .btn.accent{background:var(--accent);color:#FBF8EE;border-color:#6E2D12}
  .btn.icon{padding:8px 9px}
  .btn:disabled{opacity:.4;pointer-events:none}
  .btn svg{display:block}
  .btn .lbl{white-space:nowrap}
  @media (max-width:1150px){ .btn .lbl{display:none} .brand .sub{display:none} }

  .dd{position:relative}
  .dd-menu{position:absolute;right:0;top:calc(100% + 8px);min-width:225px;background:var(--paper3);
    border:1.5px solid var(--ink);box-shadow:var(--hard);display:none;z-index:40}
  .dd.open .dd-menu{display:block}
  .dd-menu button{display:flex;gap:10px;align-items:center;width:100%;padding:11px 14px;background:none;border:none;
    border-bottom:1px solid var(--line);font:600 12px var(--sans);color:var(--ink);cursor:pointer;text-align:left}
  .dd-menu button:last-child{border-bottom:none}
  .dd-menu button:hover{background:var(--ink);color:var(--paper)}

  main{display:grid;grid-template-columns:1fr 358px;height:calc(100vh - 62px)}
  #stage{position:relative;background:var(--paper);overflow:hidden;user-select:none}
  #stage svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #stage.panning svg{cursor:grabbing}
  #gItems g[data-id]{cursor:move}

  #toolbar{
    position:absolute;top:14px;left:14px;z-index:30;display:flex;flex-direction:column;
    background:var(--paper3);border:1.5px solid var(--ink);box-shadow:var(--hard);
  }
  .tool{
    width:44px;height:42px;display:grid;place-items:center;border:none;background:none;cursor:pointer;
    color:var(--ink);border-bottom:1px solid var(--line);position:relative;touch-action:manipulation;
  }
  .tool:last-child{border-bottom:none}
  .tool:hover{background:rgba(36,39,29,.09)}
  .tool.active{background:var(--ink);color:var(--paper)}
  .tool.active::before{content:'';position:absolute;left:-6px;top:12px;width:4px;height:18px;background:var(--accent)}
  .tsep{height:9px;background:var(--paper2);border-bottom:1px solid var(--line)}

  #brushOpts{
    position:absolute;left:68px;top:14px;z-index:30;display:none;width:216px;
    background:var(--paper3);border:1.5px solid var(--ink);box-shadow:var(--hard);padding:10px 12px 12px;
  }
  #brushOpts.on{display:block}
  #brushOpts b{display:block;font:700 9.5px var(--mono);letter-spacing:2px;color:var(--ink2);margin-bottom:8px}
  #brushOpts label{display:flex;justify-content:space-between;font:600 11px var(--sans);margin-bottom:4px}
  #brushOpts label span{font:700 11px var(--mono);color:var(--accent)}
  #brushOpts .tip{font:400 10px var(--mono);color:var(--ink2);line-height:1.5;margin-top:7px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:none;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:5px;background:var(--line);border:1px solid var(--ink)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;background:var(--ink);border:1.5px solid var(--paper3);margin-top:-6px;box-shadow:1.5px 1.5px 0 rgba(36,39,29,.3)}
  input[type=range]::-moz-range-track{height:5px;background:var(--line);border:1px solid var(--ink)}
  input[type=range]::-moz-range-thumb{width:13px;height:13px;background:var(--ink);border:1.5px solid var(--paper3);border-radius:0}

  #tooltip{
    position:absolute;pointer-events:none;z-index:6;background:var(--ink);color:var(--paper);
    font:400 12px var(--mono);padding:9px 11px;border:1px solid #10120C;max-width:280px;
    opacity:0;transition:opacity .12s;line-height:1.45;
  }
  #tooltip.on{opacity:1}
  #tooltip .tt-code{display:inline-block;font-weight:700;padding:1px 6px;margin-bottom:5px;font-size:12px}
  #tooltip .tt-name{font-weight:700;font-family:var(--sans);font-size:12.5px}
  #tooltip .tt-desc{color:#CFCBB8;margin-top:2px}
  #tooltip .tt-hint{color:#9BA08C;margin-top:6px;font-size:10px;letter-spacing:.5px}

  #zoomctrl{position:absolute;top:14px;right:14px;display:flex;flex-direction:column;gap:6px;z-index:29}
  #zoomctrl .btn{padding:9px 10px;box-shadow:2px 2px 0 rgba(36,39,29,.22)}

  #legend{
    position:absolute;left:14px;bottom:14px;z-index:29;background:rgba(248,244,231,.95);
    border:1.5px solid var(--ink);box-shadow:var(--hard);width:262px;
  }
  #legend .lg-head{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 12px;
    border-bottom:1.5px solid var(--ink);cursor:pointer}
  #legend .lg-head b{font:700 11px var(--mono);letter-spacing:2.5px}
  #legend .lg-head svg{transition:transform .2s}
  #legend.closed .lg-head svg{transform:rotate(-90deg)}
  #legend .lg-body{max-height:232px;overflow-y:auto;padding:6px 0}
  #legend.closed .lg-body{display:none}
  .lg-item{display:flex;align-items:center;gap:9px;padding:4px 12px;cursor:pointer}
  .lg-item:hover{background:rgba(36,39,29,.08)}
  .lg-item .sw{width:13px;height:13px;flex:none;border:1px solid rgba(20,22,16,.4)}
  .lg-item .cd{font:700 11px var(--mono);width:36px;flex:none}
  .lg-item .nm{font:500 11px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #drawhint{
    position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:28;display:none;
    background:var(--accent);color:#FBF8EE;border:1.5px solid #6E2D12;padding:9px 16px;
    font:600 12px var(--sans);letter-spacing:.3px;box-shadow:var(--hard);max-width:66vw;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;
  }
  #drawhint.on{display:block}
  #drawhint kbd{font:700 10px var(--mono);background:rgba(0,0,0,.28);padding:2px 6px;margin:0 2px}

  body.presenting main{grid-template-columns:1fr}
  body.presenting aside,
  body.presenting #toolbar,
  body.presenting #legend,
  body.presenting #zoomctrl,
  body.presenting #brushOpts,
  body.presenting #drawhint{display:none}
  #exitPresent{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:90;display:none}
  body.presenting #exitPresent{display:inline-flex}

  aside{background:var(--paper3);border-left:2px solid var(--ink);overflow-y:auto;display:flex;flex-direction:column}
  aside::-webkit-scrollbar{width:9px}
  aside::-webkit-scrollbar-thumb{background:var(--line);border:2px solid var(--paper3)}
  .p-head{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;border-bottom:1.5px solid var(--ink);
    position:sticky;top:0;background:var(--paper3);z-index:2}
  .p-head b{font:700 12px var(--mono);letter-spacing:2.5px}
  .p-head .count{font:700 10px var(--mono);background:var(--ink);color:var(--paper);padding:2px 7px}

  .p-search{padding:10px 14px 8px;border-bottom:1px solid var(--line)}
  .p-search .box{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);background:var(--paper);padding:7px 10px}
  .p-search input{border:none;outline:none;background:none;font:500 12px var(--sans);width:100%;color:var(--ink)}
  .p-search svg{color:var(--ink2);flex:none}
  .chips{display:flex;flex-wrap:wrap;gap:5px;padding:8px 12px 10px;border-bottom:1px solid var(--line)}
  .chip{font:600 10px var(--sans);border:1px solid var(--ink);background:var(--paper);padding:3px 8px;cursor:pointer;color:var(--ink2)}
  .chip.on{background:var(--ink);color:var(--paper)}

  #zoneList{list-style:none;padding:6px 8px}
  .zitem{display:flex;align-items:center;gap:8px;padding:8px 9px;cursor:pointer;
    border:1.5px solid transparent;margin-bottom:3px}
  .zitem:hover{border-color:var(--line)}
  .zitem.sel{background:var(--ink);color:var(--paper)}
  .zitem.sel .zname{color:var(--paper)}
  .zitem.hidden-zone{opacity:.45}
  .zsw{width:15px;height:15px;flex:none;border:1px solid rgba(20,22,16,.45)}
  .zitem.sel .zsw{border-color:rgba(248,244,231,.7)}
  .zcode{font:700 12px var(--mono);width:32px;flex:none}
  .zname{font:500 11.5px var(--sans);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .zitem .mini{border:none;background:none;cursor:pointer;padding:3px;color:inherit;display:flex;flex:none}
  .zitem .mini:hover{color:var(--accent)}

  #editor{padding:12px 16px 18px;border-top:1.5px solid var(--ink);flex:1}
  .ed-title{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .ed-title .sw{width:18px;height:18px;border:1.5px solid var(--ink)}
  .ed-title b{font:700 13px var(--sans)}
  .ed-empty{border:1.5px dashed var(--line);padding:22px 16px;text-align:center;color:var(--ink2);
    font:500 12px var(--sans);line-height:1.65}
  .field{margin-bottom:12px}
  .field label{display:block;font:700 9.5px var(--mono);letter-spacing:2px;color:var(--ink2);margin-bottom:5px;text-transform:uppercase}
  .field input[type=text],.field textarea,.field select{
    width:100%;border:1.5px solid var(--ink);background:var(--paper);padding:8px 10px;
    font:600 13px var(--sans);color:var(--ink);outline:none;
  }
  .field select{font:600 12px var(--sans);cursor:pointer}
  .field textarea{font:500 12px var(--sans);resize:vertical;min-height:50px}
  .field input.code{font:700 14px var(--mono);letter-spacing:1px;text-transform:uppercase;width:110px}
  .field :focus{box-shadow:2px 2px 0 rgba(36,39,29,.25)}
  .rot-row{display:flex;gap:8px;align-items:center}
  .rot-row input[type=number]{width:64px;border:1.5px solid var(--ink);background:var(--paper);padding:6px 6px;
    font:700 13px var(--mono);outline:none;text-align:right}
  .rot-row .btn{padding:6px 8px;font-size:12px;font-family:var(--mono)}
  .swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .swb{width:23px;height:23px;border:1.5px solid rgba(20,22,16,.5);cursor:pointer}
  .swb.on{outline:2px solid var(--ink);outline-offset:2px}
  .swatches input[type=color]{width:29px;height:26px;border:1.5px dashed var(--ink);background:var(--paper);cursor:pointer;padding:2px}
  .meta-row{font:400 10.5px var(--mono);color:var(--ink2);line-height:1.75;border-top:1px dashed var(--line);padding-top:9px;margin-top:4px}
  .ed-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .ed-btns .btn{padding:7px 11px;font-size:11.5px}
  .btn.danger{border-color:var(--danger);color:var(--danger)}
  .btn.danger:hover{background:var(--danger);color:#FBF8EE}
  .btn.danger.confirm{background:var(--danger);color:#FBF8EE}
  .locknote{border:1.5px dashed var(--accent);color:var(--accent);padding:9px 11px;font:600 11.5px var(--sans);margin-bottom:12px}
  .p-foot{padding:10px 16px;border-top:1.5px solid var(--ink);font:400 10px var(--mono);color:var(--ink2);letter-spacing:.6px}
  .p-foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4E8C3A;margin-right:6px}

  #modalWrap{position:fixed;inset:0;background:rgba(30,33,25,.55);display:none;place-items:center;z-index:60}
  #modalWrap.on{display:grid}
  .modal{background:var(--paper3);border:2px solid var(--ink);box-shadow:7px 7px 0 rgba(30,33,25,.35);
    width:min(480px,92vw);padding:22px;max-height:88vh;overflow-y:auto;position:relative}
  .mclose{position:absolute;top:8px;right:8px;width:30px;height:30px;border:1.5px solid var(--ink);
    background:var(--paper);font:700 16px var(--sans);cursor:pointer;line-height:1}
  .mclose:hover{background:var(--ink);color:var(--paper)}
  .modal h3{font:800 16px var(--sans);letter-spacing:.3px;text-transform:uppercase;margin-bottom:4px;padding-right:30px}
  .modal .m-sub{font:400 11px var(--mono);color:var(--ink2);letter-spacing:1px;margin-bottom:16px}
  .modal p{font:500 13px var(--sans);line-height:1.6}
  .modal .m-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
  .help-keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font:500 12px var(--sans);margin:6px 0 4px}
  .help-keys kbd{font:700 10px var(--mono);background:var(--paper);border:1px solid var(--ink);padding:2px 7px;box-shadow:1.5px 1.5px 0 rgba(36,39,29,.25)}
  .check{display:flex;align-items:center;gap:9px;font:600 12.5px var(--sans);padding:7px 0;cursor:pointer}
  .check input{width:15px;height:15px;accent-color:var(--ink);cursor:pointer}
  .pvbox{border:1.5px solid var(--ink);background:#fff;padding:6px;margin-bottom:10px}
  .pvbox img{width:100%;display:block}

  #toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:250;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{background:var(--ink);color:var(--paper);font:600 12px var(--sans);padding:11px 18px;
    border:1px solid #10120C;box-shadow:var(--hard);opacity:0;transform:translateY(12px);transition:all .25s;max-width:78vw}
  .toast.on{opacity:1;transform:translateY(0)}
  .toast.warn{background:var(--accent);border-color:#6E2D12}
  .toast.err{background:var(--danger)}

  @media (max-width:900px){
    main{grid-template-columns:1fr;grid-template-rows:60vh 1fr}
    aside{border-left:none;border-top:2px solid var(--ink)}
    #legend{width:205px}
  }
</style>
</head>
<body>

<div id="errbar" title="Clic para cerrar el aviso"></div>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 2.5h6.5l3.5 3.5V13.5H3z"/><path d="M9.5 2.5v3.5H13"/><path d="M5.5 8.5h5M5.5 11h5" stroke-width="1.1"/></svg>
    </div>
    <div>
      <h1>Croquis</h1>
      <div class="sub">Editor de plano</div>
    </div>
  </div>
  <div class="actions">
    <button class="btn icon" id="btnPresent" title="Modo presentación: plano a pantalla completa (ESC para salir)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="3" width="12" height="8.5" rx="1"/><path d="M6 14h4M8 11.5V14"/></svg>
    </button>
    <button class="btn icon" id="btnHelp" title="Guía de uso y atajos">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6.4"/><path d="M6.2 6.2a1.9 1.9 0 1 1 2.6 1.8c-.6.25-.8.6-.8 1.3"/><circle cx="8" cy="11.6" r=".4" fill="currentColor"/></svg>
    </button>
    <button class="btn" id="btnPNG" title="Exportar PNG: el plano completo con cartela y leyenda">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v8M5 7.5 8 10.5 11 7.5M3 13.5h10"/></svg>
      <span class="lbl">PNG</span>
    </button>
    <button class="btn accent" id="btnPDF" title="Guardar PDF (con vista previa): plano completo + registro de zonas">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 2h7l3 3v9H3z"/><path d="M10 2v3h3M5.5 11.5h5M5.5 9h5" stroke-width="1.1"/></svg>
      <span class="lbl">PDF</span>
    </button>
    <div class="dd" id="ddData">
      <button class="btn" id="btnData" title="Datos y ajustes del documento">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/><circle cx="5.5" cy="4" r="1.4" fill="currentColor"/><circle cx="10.5" cy="8" r="1.4" fill="currentColor"/><circle cx="6.5" cy="12" r="1.4" fill="currentColor"/></svg>
        <span class="lbl">Datos</span>
      </button>
      <div class="dd-menu">
        <button id="miSettings"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v2M8 12.2v2M1.8 8h2M12.2 8h2M3.6 3.6l1.4 1.4M11 11l1.4 1.4M12.4 3.6 11 5M5 11l-1.4 1.4"/></svg>Ajustes del documento</button>
        <button id="miExport"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 2v8M5 7.5 8 10.5 11 7.5M3 13.5h10"/></svg>Exportar JSON</button>
        <button id="miImport"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 10V2M5 4.5 8 1.5l3 3M3 13.5h10"/></svg>Importar JSON…</button>
      </div>
    </div>
    <button class="btn icon" id="btnUndo" title="Deshacer (Ctrl+Z)">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3.5 7h6.5a3.5 3.5 0 0 1 0 7H7M3.5 7 6 4.5M3.5 7 6 9.5"/></svg>
    </button>
    <button class="btn icon" id="btnReset" title="Restablecer el croquis original">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 8A5 5 0 1 1 11.4 4.3M13 2.5v3.2H9.8"/></svg>
    </button>
  </div>
</header>

<main>
  <section id="stage">
    <svg id="map" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
          <circle cx="3" cy="3" r="0.7" fill="#8F8A74" opacity="0.09"/>
        </pattern>
        <pattern id="grass" width="15" height="15" patternUnits="userSpaceOnUse">
          <circle cx="4" cy="4" r="1.2" fill="#A9BC84"/><circle cx="11.5" cy="11" r="1.2" fill="#A9BC84"/>
        </pattern>
        <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="6" stroke="#3A3E30" stroke-width="1" stroke-opacity="0.16"/>
        </pattern>
        <pattern id="pav" width="13" height="13" patternUnits="userSpaceOnUse">
          <path d="M13 0H0V13" fill="none" stroke="#D8D0B8" stroke-width="0.7"/>
        </pattern>

}

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => v.toFixed(1).replace('.', ',');
const fmtA = v => v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

function el(tag, attrs = {}, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs){ if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(n);
  return n;
}
function txt(parent, s, attrs = {}){
  const t = el('text', attrs, parent); t.textContent = s; return t;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const hashId = s => [...String(s)].reduce((a,c) => (a*33 + c.charCodeAt(0)) | 0, 5381);

function drawTreeAt(parent, x, y, r, tone){

/* ---------- geometría ---------- */
const polyPath = pts => 'M' + pts.map(p => p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join('L') + 'Z';
function polyBBox(pts){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const p of pts){ if(p.x<x0)x0=p.x; if(p.y<y0)y0=p.y; if(p.x>x1)x1=p.x; if(p.y>y1)y1=p.y; }
  return {x:x0, y:y0, w:x1-x0, h:y1-y0};
}
function polyArea(pts){
  let a = 0;
  for (let i = 0; i < pts.length; i++){
    const p = pts[i], q = pts[(i+1)%pts.length];
    a += p.x*q.y - q.x*p.y;
  }
  return Math.abs(a)/2;
}
function polyPerim(pts){
  let s = 0;
  for (let i = 0; i < pts.length; i++){
    const p = pts[i], q = pts[(i+1)%pts.length];
    s += Math.hypot(q.x-p.x, q.y-p.y);
  }
  return s;
}
function polyCentroid(pts){
  let a=0, cx=0, cy=0;
  for (let i = 0; i < pts.length; i++){
    const p = pts[i], q = pts[(i+1)%pts.length];
    const cr = p.x*q.y - q.x*p.y;
    a += cr; cx += (p.x+q.x)*cr; cy += (p.y+q.y)*cr;
  }
  a *= .5;
  if (Math.abs(a) < 1e-6){ const b = polyBBox(pts); return {x:b.x+b.w/2, y:b.y+b.h/2}; }
  return {x: cx/(6*a), y: cy/(6*a)};
}
function pointInPoly(x, y, pts){
  let inn = false;
  for (let i = 0, j = pts.length-1; i < pts.length; j = i++){
    const a = pts[i], b = pts[j];
    if ((a.y > y) !== (b.y > y) && x < (b.x-a.x)*(y-a.y)/(b.y-a.y) + a.x) inn = !inn;
  }
  return inn;
}
function distToSeg(p, a, b){
  const dx = b.x-a.x, dy = b.y-a.y, L = dx*dx + dy*dy;
  if (!L) return Math.hypot(p.x-a.x, p.y-a.y);
  let t = ((p.x-a.x)*dx + (p.y-a.y)*dy) / L;
  t = clamp(t, 0, 1);
  return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
}
function douglasPeucker(pts, tol){
  if (pts.length < 3) return pts.slice();
  const keep = new Array(pts.length).fill(false);
  keep[0] = keep[pts.length-1] = true;
  const stack = [[0, pts.length-1]];
  while (stack.length){
    const [i, j] = stack.pop();
    let mx = 0, mi = -1;
    for (let k = i+1; k < j; k++){
      const d = distToSeg(pts[k], pts[i], pts[j]);
      if (d > mx){ mx = d; mi = k; }
    }
    if (mx > tol){ keep[mi] = true; stack.push([i, mi], [mi, j]); }
  }
  return pts.filter((_, k) => keep[k]);
}
const rectPts = (x, y, w, h) => [{x, y}, {x:x+w, y}, {x:x+w, y:y+h}, {x, y:y+h}];
function tfPoint(p, t){
  if (t.kind === 'move') return {x: p.x + t.dx, y: p.y + t.dy};
  if (t.kind === 'scale') return {x: t.ax + (p.x-t.ax)*t.sx, y: t.ay + (p.y-t.ay)*t.sy};
  return p;
}
const tfAttr = t => `translate(${t.dx} ${t.dy})`;

const norm360 = v => ((v % 360) + 360) % 360;
const itemCenter = z => polyCentroid(z.poly);
function rotatePoint(p, c, deg){
  const a = deg * Math.PI/180, s = Math.sin(a), co = Math.cos(a), dx = p.x-c.x, dy = p.y-c.y;
  return {x: c.x + dx*co - dy*s, y: c.y + dx*s + dy*co};
}
function worldPt(z, p){ return z.rot ? rotatePoint(p, itemCenter(z), z.rot) : p; }
function localPt(z, p){ return z.rot ? rotatePoint(p, itemCenter(z), -z.rot) : p; }
function rotStr(z){
  if (!z.rot) return null;
  const c = itemCenter(z);
  return `rotate(${(+z.rot).toFixed(2)} ${c.x.toFixed(1)} ${c.y.toFixed(1)})`;
}

function TREES_DEFAULT(){
  const rnd = mulberry32(7), T = TERRAIN_DEFAULT(), out = [];
  for (let i = 0; i < 260 && out.length < 56; i++){
    const x = 40 + rnd()*1520, y = 40 + rnd()*920;
    if (pointInPoly(x, y, T)) continue;
    let near = false;
    for (let k = 0; k < T.length && !near; k++){
      const a = T[k], b = T[(k+1)%T.length];
      if (distToSeg({x, y}, a, b) < 20) near = true;
    }
    if (near) continue;
    out.push({x: Math.round(x), y: Math.round(y), r: 6 + Math.round(rnd()*4.5), tone: rnd()});
  }
  return out;
}

/* terreno: parameterizado para reutilizarlo en el export */
function buildTerrainInto(parent, terrain){
  const d = polyPath(terrain.points);
  el('path', {d, transform:'translate(8 9)', fill:'rgba(36,39,29,.16)'}, parent);
  el('path', {d, fill:'#E3E9D1', stroke:'#AEBB90', 'stroke-width':1}, parent);

  el('path', {d, fill:'none', stroke:'#F0EADA', 'stroke-width':7, opacity:.55}, parent);
  el('path', {d, fill:'none', stroke:'#C7351F', 'stroke-width':4, 'stroke-dasharray':'18 10', 'stroke-linejoin':'round'}, parent);
  let top = terrain.points[0];
  for (const p of terrain.points) if (p.y < top.y) top = p;
  txt(parent, 'LÍMITE DEL CAMPUS', {x: top.x, y: top.y - 16, class:'ft-m', 'font-size':11, 'letter-spacing':2.2,
    fill:'#A5301A', 'text-anchor':'middle', stroke:'#F2EDDF', 'stroke-width':4, 'paint-order':'stroke'});
}
function buildTerrain(){ gTerrain.innerHTML = ''; buildTerrainInto(gTerrain, state.terrain); }

function renderTrees(){ gTrees.innerHTML = ''; state.trees.forEach(t => drawTreeAt(gTrees, t.x, t.y, t.r, t.tone)); }
function plantTree(p){
  const t = {x: Math.round(p.x), y: Math.round(p.y), r: doc().brushR, tone: Math.random()};
  state.trees.push(t); drawTreeAt(gTrees, t.x, t.y, t.r, t.tone);
  return t;
}
function eraseNear(p, radius){
  const before = state.trees.length;
  state.trees = state.trees.filter(t => Math.hypot(t.x-p.x, t.y-p.y) > radius);
  if (state.trees.length !== before) renderTrees();
  return before - state.trees.length;
}

function fBld(g, b){
  const m = Math.min(b.w, b.h)*.06 + 4;
  const x = b.x+m, y = b.y+m, w = b.w-2*m, h = b.h-2*m;
  el('rect', {x:x+5, y:y+6, width:w, height:h, fill:'#CFC7B0'}, g);
  el('rect', {x, y, width:w, height:h, fill:'#FBF7EC', stroke:'#2C3024', 'stroke-width':1.4}, g);
  el('rect', {x, y, width:w, height:h, fill:'url(#hatch)'}, g);
}
function fPitch(g, b){
  const x = b.x+4, y = b.y+4, w = b.w-8, h = b.h-8;
  el('rect', {x, y, width:w, height:h, fill:'#5F8C46', stroke:'#F2F5E8', 'stroke-width':3}, g);
  for (let i = 0; i < 6; i++)
    if (i % 2) el('rect', {x:x + i*w/6, y, width:w/6, height:h, fill:'#F2F5E8', opacity:.05}, g);
  const cx = x+w/2, cy = y+h/2, L = {stroke:'#F2F5E8', 'stroke-width':2, fill:'none'};
  el('line', {x1:cx, y1:y, x2:cx, y2:y+h, ...L}, g);
  el('circle', {cx, cy, r:Math.min(w,h)*.13, ...L}, g);
  el('rect', {x, y:cy-h*.17, width:w*.12, height:h*.34, ...L}, g);
  el('rect', {x:x+w*.88, y:cy-h*.17, width:w*.12, height:h*.34, ...L}, g);
  el('circle', {cx:x+w*.06, cy, r:2.4, fill:'#F2F5E8'}, g);
  el('circle', {cx:x+w*.94, cy, r:2.4, fill:'#F2F5E8'}, g);
}
function fLot(g, b, z){
  const rnd = mulberry32(hashId(z.id));
  el('rect', {x:b.x+4, y:b.y+4, width:b.w-8, height:b.h-8, fill:'#DED8C4', stroke:'#C4BBA3', 'stroke-width':1}, g);
  const depth = Math.min(44, b.h*.22), aisle = depth*.65;
  let y = b.y + 10, flip = false;
  while (y + depth*2 + aisle < b.y + b.h - 12){
    for (let row = 0; row < 2; row++){
      const ry = y + row*(depth + aisle);
      for (let xx = b.x + 12; xx < b.x + b.w - 16; xx += 22){
        el('line', {x1:xx, y1:ry, x2:xx, y2:ry+depth, stroke:'#FBF7EC', 'stroke-width':2}, g);
        if (rnd() < .35){
          const cols = ['#B9B0A0','#8F9AA0','#A08F85','#93A08D','#B0A38F'];
          el('rect', {x:xx+3, y:ry+4, width:16, height:depth-8, rx:3.5,
            fill:cols[Math.floor(rnd()*cols.length)], stroke:'#6B6656', 'stroke-width':.6}, g);
        }
      }
    }
    const ay = y + depth + aisle*.5;
    [b.x+b.w*.32, b.x+b.w*.66].forEach((ax, i) => {
      const dir = (flip ? -1 : 1) * (i ? 1 : -1);
      el('path', {d:`M${ax-5},${ay-3} L${ax+5*dir},${ay} L${ax-5},${ay+3} Z`, fill:'#8F8A74'}, g);
    });
    flip = !flip;
    y += depth*2 + aisle;
  }
}
function fPlaza(g, b, z){
  const rnd = mulberry32(hashId(z.id));
  el('rect', {x:b.x+3, y:b.y+3, width:b.w-6, height:b.h-6, fill:'#EFE9D8', stroke:'#D8D0B8', 'stroke-width':1}, g);
  el('rect', {x:b.x+3, y:b.y+3, width:b.w-6, height:b.h-6, fill:'url(#pav)'}, g);
  const cx = b.x+b.w/2, cy = b.y+b.h/2, r = Math.min(b.w, b.h)*.32;
  el('circle', {cx, cy, r:r+7, fill:'#E4DCC6', stroke:'#C4BBA3', 'stroke-width':1}, g);
  el('circle', {cx, cy, r, fill:'#DCE3C4', stroke:'#B7C498', 'stroke-width':1.2}, g);
  el('circle', {cx, cy, r:r*.3, fill:'#EFE9D8', stroke:'#C4BBA3', 'stroke-width':1}, g);
  el('rect', {x:cx-2, y:cy-9, width:4, height:18, fill:'#24271D'}, g);
  [[.28,.86],[.72,.86],[.28,.12],[.72,.12]].forEach(p =>
    el('rect', {x:b.x+b.w*p[0]-8, y:b.y+b.h*p[1]-2.5, width:16, height:5, rx:1.5, fill:'#24271D', opacity:.6}, g));
  [[.08,.35],[.08,.68],[.92,.35],[.92,.68]].forEach(p =>
    drawTreeAt(g, b.x+b.w*p[0], b.y+b.h*p[1], 6.5 + rnd()*2, rnd()));
}
function fAud(g, b){
  const x = b.x+6, y = b.y+6, w = b.w-12, h = b.h-12;
  el('rect', {x:x+5, y:y+6, width:w, height:h, rx:10, fill:'#CFC7B0'}, g);
  el('rect', {x, y, width:w, height:h, rx:10, fill:'#FBF7EC', stroke:'#2C3024', 'stroke-width':1.5}, g);
  el('rect', {x, y, width:w, height:h, rx:10, fill:'url(#hatch)'}, g);
  const cx = x+w/2, cy = y+h*.5;
  el('rect', {x:x+w*.32, y:y+h*.1, width:w*.36, height:h*.2, fill:'#2C3024', opacity:.22}, g);
  for (let i = 1; i <= 3; i++)
    el('ellipse', {cx, cy, rx:w*(.42-i*.1), ry:h*(.38-i*.09), fill:'none', stroke:'#2C3024',
      'stroke-width':1, opacity:.32, 'stroke-dasharray':'4 4'}, g);
  el('rect', {x:x+w*.3, y:y+h*.78, width:w*.4, height:h*.15, fill:'#EFE9D8', stroke:'#2C3024', 'stroke-width':1.2}, g);
}
const INTERIORS = {bldg:fBld, pitch:fPitch, lot:fLot, plaza:fPlaza, aud:fAud};

function textOn(hex){
  try{
    const c = hex.replace('#','');
    const r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
    return (r*299 + g*587 + b*114)/1000 >= 150 ? '#20241A' : '#FBF8EE';
  } catch(e){ return '#FBF8EE'; }
}
function wrapText(str, maxChars, maxLines){
  const words = String(str || '').trim().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const lines = []; let cur = '';
  for (const w of words){
    if ((cur ? cur+' ' : '').length + w.length <= maxChars) cur = cur ? cur+' '+w : w;
    else { lines.push(cur); cur = w; if (lines.length >= maxLines) break; }
  }
  if (cur && lines.length < maxLines) lines.push(cur);
  if (lines.join(' ') !== words.join(' ')) lines[lines.length-1] += '…';
  return lines.slice(0, maxLines);
}

function buildItemNodeInto(z, clipParent, forExport){
  const g = el('g', {'data-id': z.id});

  (INTERIORS[z.kind] || (()=>{}))(inner, b, z);

  el('path', {d: polyPath(z.poly), fill: z.color, 'fill-opacity': z.opacity ?? .24, stroke: z.color,
    'stroke-width': 2.4, 'stroke-linejoin':'round', class:'ov'}, rw);

          'font-size':10.5, fill:'#4B4E40', stroke:'#F4F0E1', 'stroke-width':3.5, 'paint-order':'stroke'});
    }

  if (!forExport) applyZoneStyle(z);

    const p = svgPoint(e);

    if (state.tool === 'stamp'){ placeStamp(p); return; }
    if (state.tool === 'poly' || state.tool === 'terrainDraw'){ addDrawVertex(p); return; }
    if (state.tool === 'brush'){ const snap = snapshot(); drag = {type:'brush', last: plantTree(p), added: 1, snap}; return; }
    if (state.tool === 'eraser'){ const snap = snapshot(); const n = eraseNear(p, doc().eraserR); drag = {type:'erase', erased: n, snap}; return; }
    if (state.tool === 'free'){ state.drawing = {pts:[{x:grid(p.x), y:grid(p.y)}], mode:'free'}; drag = {type:'free'}; return; }

    const t = e.target;
    const vAttr = t.getAttribute && t.getAttribute('data-vidx');
    if (vAttr !== null && vAttr !== undefined && !isNaN(+vAttr)){
      const owner = t.getAttribute('data-owner');
      if (e.altKey){ deleteVertex(owner, +vAttr); return; }
      const arr = owner === 'terrain' ? state.terrain.points : (getSel() && !getSel().locked ? getSel().poly : null);
      if (arr) drag = {type:'vertex', owner, idx:+vAttr, z: owner === 'item' ? getSel() : null, snap:snapshot(), moved:false};
      return;
    }
    const mAttr = t.getAttribute && t.getAttribute('data-mid');
    if (mAttr !== null && mAttr !== undefined && !isNaN(+mAttr)){
      const owner = t.getAttribute('data-owner');
      const arr = owner === 'terrain' ? state.terrain.points : (getSel() && !getSel().locked ? getSel().poly : null);
      if (arr){
        const i = +mAttr;
        pushUndo();
        arr.splice(i+1, 0, {x: arr[i].x, y: arr[i].y});
        drag = {type:'vertex', owner, idx:i+1, z: owner === 'item' ? getSel() : null, snap:null, moved:true};
        if (owner === 'terrain') buildTerrain(); else updateItemNode(getSel());
        renderHandles();
      }
      return;
    }
    const sAttr = t.getAttribute && t.getAttribute('data-scale');
    if (sAttr){
      const z = getSel(); if (!z || z.locked) return;
      drag = {type:'scale', z, key:sAttr, orig: z.poly.map(q => ({...q})), snap:snapshot()};
      return;
    }
    if (t.getAttribute && t.getAttribute('data-rot')){
      const z = getSel(); if (!z || z.locked) return;
      const c = itemCenter(z);
      drag = {type:'rot', z, c, a0: Math.atan2(p.y-c.y, p.x-c.x), rot0: z.rot || 0, snap:snapshot()};
      return;
    }

    const zg = t.closest ? t.closest('g[data-id]') : null;
    if (zg){
      const z = itemById(zg.getAttribute('data-id'));
      if (z){
        if (state.sel !== z.id) select(z.id);
        if (!z.locked) drag = {type:'move', z, start:p, snap:snapshot(), moved:false};
        else { drag = {type:'pan', start:{x:e.clientX, y:e.clientY}, orig:{...view}}; stage.classList.add('panning'); }
      }
      return;
    }
    if (t.closest && t.closest('#gTerrain')){
      if (state.sel !== '__terrain' || !state.terrainEdit) select('__terrain');
      if (state.terrainEdit) return;
    }
    drag = {type:'pan', start:{x:e.clientX, y:e.clientY}, orig:{...view}, moved:false};
    stage.classList.add('panning');
  }catch(err){ fail('plano (clic)', err); drag = null; stage.classList.remove('panning'); }
});

let fullRaf = null;
function scheduleFullItem(z){
  if (fullRaf) return;
  fullRaf = requestAnimationFrame(() => { fullRaf = null; updateItemNode(z); renderHandles(); });
}

window.addEventListener('pointermove', e => {
  try{
    if (drag){
      if (drag.type === 'pan'){
        const sc = screenScale();
        view.x = drag.orig.x - (e.clientX - drag.start.x)/sc;
        view.y = drag.orig.y - (e.clientY - drag.start.y)/sc;
        applyView();
      }
      else if (drag.type === 'free'){
        const p = svgPoint(e), d = state.drawing;
        if (d){
          const last = d.pts[d.pts.length-1];
          if (Math.hypot(p.x-last.x, p.y-last.y) > 6/screenScale()) d.pts.push({x:grid(p.x), y:grid(p.y)});
          gPreview.innerHTML = ''; drawDrawingPreview(p);
        }
      }
      else if (drag.type === 'brush'){
        const p = svgPoint(e);
        if (Math.hypot(p.x-drag.last.x, p.y-drag.last.y) > doc().brushR*1.05){ drag.last = plantTree(p); drag.added++; }
        gPreview.innerHTML = ''; drawToolGhost(p);
      }
      else if (drag.type === 'erase'){
        const p = svgPoint(e);
        drag.erased += eraseNear(p, doc().eraserR);
        gPreview.innerHTML = ''; drawToolGhost(p);
      }
      else if (drag.type === 'move'){
        const p = svgPoint(e), z = drag.z;
        if (!drag.moved && Math.hypot(p.x-drag.start.x, p.y-drag.start.y) < 4/screenScale()) return;
        drag.moved = true;
        const step = doc().snap ? 10 : 5;
        const dx = Math.round((p.x-drag.start.x)/step)*step, dy = Math.round((p.y-drag.start.y)/step)*step;
        drag.tf = {kind:'move', dx, dy};
        const g = gItems.querySelector(`g[data-id="${z.id}"]`);
        if (g) g.setAttribute('transform', tfAttr(drag.tf));
        gUi.setAttribute('transform', tfAttr(drag.tf));
        const b = polyBBox(z.poly);
        ttShow(`<span class="tt-name">${areaOf(z)} m² · ${fmt(b.w*M)} × ${fmt(b.h*M)} m</span>`, e.clientX, e.clientY);
      }
      else if (drag.type === 'vertex'){
        const p = svgPoint(e), z = drag.z;
        drag.moved = true;
        const arr = drag.owner === 'terrain' ? state.terrain.points : (z ? z.poly : null);
        if (arr){
          const lp = z ? localPt(z, p) : p;
          arr[drag.idx] = {x: grid(lp.x), y: grid(lp.y)};
          if (drag.owner === 'terrain'){
            buildTerrain();
          } else if (z){
            const g = gItems.querySelector(`g[data-id="${z.id}"]`);
            if (g){
              g.querySelector('.ov').setAttribute('d', polyPath(z.poly));
              const cp = document.getElementById('clip-'+z.id);
              if (cp) cp.querySelector('path').setAttribute('d', polyPath(z.poly));
              const c = itemCenter(z), lg = g.querySelector('.lbl');
              if (lg) lg.setAttribute('transform', `translate(${c.x.toFixed(1)} ${c.y.toFixed(1)})`);
            }
            scheduleFullItem(z);
          }
          renderHandles();
          const cur = drag.owner === 'terrain' ? state.terrain.points : z.poly;
          ttShow(`<span class="tt-name">${fmtA(polyArea(cur)*M2)} m² · ${cur.length} vértices</span>`, e.clientX, e.clientY);
        }
      }
      else if (drag.type === 'scale'){
        const p = svgPoint(e), z = drag.z, o = polyBBox(drag.orig);
        const lp = localPt(z, p);
        let x0=o.x, y0=o.y, x1=o.x+o.w, y1=o.y+o.h;
        if (drag.key.includes('w')) x0 = Math.min(lp.x, x1-40);
        if (drag.key.includes('e')) x1 = Math.max(lp.x, x0+40);
        if (drag.key.includes('n')) y0 = Math.min(lp.y, y1-32);
        if (drag.key.includes('s')) y1 = Math.max(lp.y, y0+32);
        const ax = drag.key.includes('w') ? x1 : x0, ay = drag.key.includes('n') ? y1 : y0;
        const tf = {kind:'scale', ax, ay, sx:(x1-x0)/o.w, sy:(y1-y0)/o.h};
        drag.tf = tf;
        z.poly = drag.orig.map(q => tfPoint(q, tf));
        scheduleFullItem(z);
        ttShow(`<span class="tt-name">${fmt((x1-x0)*M)} × ${fmt((y1-y0)*M)} m</span>`, e.clientX, e.clientY);
      }
      else if (drag.type === 'rot'){
        const p = svgPoint(e), z = drag.z;
        let deg = drag.rot0 + (Math.atan2(p.y-drag.c.y, p.x-drag.c.x) - drag.a0) * 180/Math.PI;
        if (e.shiftKey) deg = Math.round(deg/15)*15;
        z.rot = norm360(deg);
        const rw = gItems.querySelector(`g[data-id="${z.id}"] .rotwrap`);
        if (rw) rw.setAttribute('transform', rotStr(z));
        renderHandles();
        ttShow(`<span class="tt-name">${(z.rot).toFixed(1)}° · Shift: ajuste a 15°</span>`, e.clientX, e.clientY);
      }
      return;
    }
    if (e.target.closest && (e.target.closest('#toolbar') || e.target.closest('#legend') || e.target.closest('#brushOpts') || e.target.closest('aside') || e.target.closest('header'))) return;
    const p = svgPoint(e);
    if (state.tool === 'stamp'){ gPreview.innerHTML = ''; drawStampGhost(p); return; }
    if (state.tool === 'brush' || state.tool === 'eraser'){ gPreview.innerHTML = ''; drawToolGhost(p); return; }
    if (state.drawing){ gPreview.innerHTML = ''; drawDrawingPreview(p); return; }
    const zg = e.target.closest ? e.target.closest('g[data-id]') : null;
    if (zg){
      const id = zg.getAttribute('data-id'), z = itemById(id);
      if (z && z.visible !== false){
        if (hoverZone !== id){ hoverZone = id; state.items.forEach(applyZoneStyle); }
        const r = stage.getBoundingClientRect();
        ttShow(`<span class="tt-code" style="background:${z.color};color:${textOn(z.color)}">${escapeHtml(z.code || '—')}</span>
          <div class="tt-name">${escapeHtml(z.name || 'Sin nombre')}</div>
          ${z.desc ? `<div class="tt-desc">${escapeHtml(z.desc)}</div>` : ''}
          <div class="tt-hint">${areaOf(z)} m² · ${z.rot ? z.rot.toFixed(0)+'° · ' : ''}${z.locked ? 'bloqueada' : 'clic: editar · doble clic: enfocar'}</div>`, e.clientX - r.left, e.clientY - r.top);
        return;
      }
    }
    if (hoverZone){ hoverZone = null; state.items.forEach(applyZoneStyle); ttHide(); }
  }catch(err){ fail('plano (movimiento)', err); }
});

window.addEventListener('pointerup', () => {
  if (!drag) return;
  try{
    if (drag.type === 'free'){
      const d = state.drawing;
      if (d && d.pts.length > 2){
        const pts = douglasPeucker(d.pts, 5);
        state.drawing = null; gPreview.innerHTML = '';
        if (pts.length >= 3) openNewZone(pts);
        else { toast('El trazo fue demasiado corto.', 'warn'); setHint(HINTS.free); }
      } else { cancelDrawing(); setHint(HINTS.free); }
    }
    else if (drag.type === 'brush'){
      if (drag.added > 0) pushUndoAt(drag.snap);
      gPreview.innerHTML = ''; save();
    }
    else if (drag.type === 'erase'){
      if (drag.erased > 0){ pushUndoAt(drag.snap); save(); toast(drag.erased + ' árboles eliminados.'); }
      gPreview.innerHTML = '';
    }
    else if (drag.type === 'move'){
      const g = gItems.querySelector(`g[data-id="${drag.z.id}"]`);
      if (g) g.removeAttribute('transform');
      gUi.removeAttribute('transform');
      if (drag.moved && drag.tf){
        drag.z.poly = drag.z.poly.map(p => tfPoint(p, drag.tf));
        updateItemNode(drag.z); pushUndoAt(drag.snap); save(); renderEditor();
      }
      renderHandles(); ttHide();
    }
    else if (drag.type === 'vertex' && drag.moved){
      if (drag.snap) pushUndoAt(drag.snap);
      if (drag.z) updateItemNode(drag.z);
      save(); renderHandles(); renderEditor();
      ttHide();
    }
    else if (drag.type === 'scale' && drag.tf){
      updateItemNode(drag.z); pushUndoAt(drag.snap); save(); renderEditor();
      ttHide();
    }
    else if (drag.type === 'rot'){
      updateItemNode(drag.z); pushUndoAt(drag.snap); save(); renderEditor();
      ttHide();
    }
  }catch(err){ fail('plano (soltar)', err); }
  stage.classList.remove('panning');
  drag = null;
});

function deleteVertex(owner, idx){
  const arr = owner === 'terrain' ? state.terrain.points : (getSel() && !getSel().locked ? getSel().poly : null);
  if (!arr) return;
  if (arr.length <= 3){ toast('Un polígono necesita al menos 3 vértices.', 'warn'); return; }
  pushUndo();
  arr.splice(idx, 1);
  if (owner === 'terrain') buildTerrain();
  else updateItemNode(getSel());
  renderHandles(); save(); renderEditor();
}

svg.addEventListener('dblclick', e => {
  try{
    if (state.drawing && state.drawing.mode === 'click'){ closeDrawing(); return; }
    const t = e.target;
    const vAttr = t.getAttribute && t.getAttribute('data-vidx');
    if (vAttr !== null && vAttr !== undefined && !isNaN(+vAttr)){ deleteVertex(t.getAttribute('data-owner'), +vAttr); return; }
    const zg = t.closest ? t.closest('g[data-id]') : null;
    if (zg){ const z = itemById(zg.getAttribute('data-id')); if (z){ select(z.id); focusPoly(z.poly); return; } }
    if (t.closest && t.closest('#gTerrain')) setTerrainEdit(!state.terrainEdit);
  }catch(err){ fail('doble clic', err); }
});
svg.addEventListener('mouseleave', () => {
  hoverZone = null; state.items.forEach(applyZoneStyle); ttHide();
  if (state.tool === 'stamp' || state.tool === 'brush' || state.tool === 'eraser') gPreview.innerHTML = '';
});

/* =====================================================================
   PAN / ZOOM
==================================================================== */
function applyView(){ svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`); }
function zoomAt(mx, my, factor){
  const nw = clamp(view.w/factor, 140, 4000), nh = nw/RATIO;
  view.x = mx - (mx-view.x)*(nw/view.w);
  view.y = my - (my-view.y)*(nh/view.h);
  view.w = nw; view.h = nh;
  applyView();
}
svg.addEventListener('wheel', e => {
  e.preventDefault();
  const p = svgPoint(e);
  zoomAt(p.x, p.y, Math.pow(1.0016, -e.deltaY));
}, {passive:false});

function animateViewTo(target){
  cancelAnimationFrame(animId);
  const s = {...view}, t0 = performance.now(), dur = 500;
  const step = t => {
    const k = Math.min(1, (t-t0)/dur), e = 1 - Math.pow(1-k, 3);
    view.x = s.x + (target.x-s.x)*e; view.y = s.y + (target.y-s.y)*e;
    view.w = s.w + (target.w-s.w)*e; view.h = s.h + (target.h-s.h)*e;
    applyView();
    if (k < 1) animId = requestAnimationFrame(step);
  };
  animId = requestAnimationFrame(step);
}
function fitBounds(b, padRatio){
  let w = b.w, h = b.h;
  if (w/h < RATIO) w = h*RATIO; else h = w/RATIO;
  if (w < 600){ w = 600; h = w/RATIO; }
  animateViewTo({x: b.x + b.w/2 - w/2, y: b.y + b.h/2 - h/2, w, h});
}
function focusPoly(poly, pad = 100){
  const b = polyBBox(poly);
  let w = b.w + pad*2, h = b.h + pad*2;
  if (w/h < RATIO) w = h*RATIO; else h = w/RATIO;
  animateViewTo({x: b.x + b.w/2 - w/2, y: b.y + b.h/2 - h/2, w, h});
}

function renderLegend(){
  const body = $('lgBody'); body.innerHTML = '';
  state.items.filter(z => z.visible !== false).forEach(z => {

    d.className = 'lg-item';
    d.innerHTML = `<span class="sw" style="background:${z.color}"></span><span class="cd">${escapeHtml(z.code || '—')}</span><span class="nm">${escapeHtml(z.name || 'Sin nombre')}</span>`;
    d.onclick = () => { select(z.id); focusPoly(z.poly); };
    d.onmouseenter = () => { hoverZone = z.id; applyZoneStyle(z); };
    d.onmouseleave = () => { hoverZone = null; applyZoneStyle(z); };
    body.appendChild(d);
  });
}

      <div class="swatches" id="edSw">
        ${PALETTE.map(c => `<button class="swb${c.toLowerCase() === String(z.color).toLowerCase() ? ' on' : ''}" data-c="${c}" style="background:${c}" title="${c}"></button>`).join('')}

      </div>
    </div>
    <div class="ed-btns">
      <button class="btn" id="edFocus">Enfocar</button>
      <button class="btn" id="edDup">Duplicar</button>
      <button class="btn" id="edFront" title="Traer al frente">Frente</button>
      <button class="btn" id="edBack" title="Enviar al fondo">Fondo</button>
      <button class="btn ${locked ? 'primary' : ''}" id="edLock">${locked ? 'Desbloquear' : 'Bloquear'}</button>
      <button class="btn danger" id="edDel">Eliminar</button>
    </div>
    <div class="meta-row">
      ${z.poly.length} vértices · superficie ≈ ${areaOf(z)} m² · rotación ${Math.round(z.rot || 0)}°<br>
      ${locked ? 'Contorno protegido' : 'Editá la forma arrastrando los puntos (◇ inserta vértice).'}
    </div>`;

  const refresh = () => { updateItemNode(z); renderLegend(); renderList(); save(); };
  const zoneHead = box.querySelector('.ed-title');
  $('edCode').addEventListener('input', e => { z.code = e.target.value.toUpperCase(); refresh(); });
  $('edName').addEventListener('input', e => { z.name = e.target.value; refresh(); zoneHead.querySelector('b').textContent = z.name || 'Sin nombre'; });
  $('edDesc').addEventListener('input', e => { z.desc = e.target.value; save(); });
  if (!locked) $('edKind').addEventListener('change', e => { pushUndo(); z.kind = e.target.value; refresh(); });

  const setRot = deg => {
    z.rot = norm360(Math.round(deg));
    updateItemNode(z); renderHandles(); renderEditor(); save();
  };
  $('edRotM').onclick = () => { pushUndo(); setRot((z.rot||0) - 90); };
  $('edRotP').onclick = () => { pushUndo(); setRot((z.rot||0) + 90); };
  $('edRot').addEventListener('change', e => { pushUndo(); setRot(clamp(+e.target.value || 0, 0, 359)); });

  $('edOpa').addEventListener('input', e => { z.opacity = (+e.target.value)/100; applyZoneStyle(z); save(); });
  $('edSw').addEventListener('click', e => {
    const b = e.target.closest('.swb'); if (!b) return;
    pushUndo(); z.color = b.dataset.c; refresh(); renderEditor();
  });
  $('edColor').addEventListener('input', e => { z.color = e.target.value; refresh(); });
  $('edFocus').onclick = () => focusPoly(z.poly);
  $('edDup').onclick = () => {
    pushUndo();
    const c = {id: uid(), kind: z.kind, code: nextCode('Z'), name: (z.name || '') + ' (copia)', desc: z.desc,
      color: z.color, visible: true, rot: z.rot || 0, opacity: z.opacity, poly: z.poly.map(p => ({x: p.x+26, y: p.y+26}))};
    state.items.push(c); renderItems(); select(c.id); focusPoly(c.poly); save();
    toast('Zona duplicada.');
  };
  $('edFront').onclick = () => {
    pushUndo();
    state.items.splice(state.items.indexOf(z), 1);
    state.items.push(z); renderItems(); save();
  };
  $('edBack').onclick = () => {
    pushUndo();
    state.items.splice(state.items.indexOf(z), 1);
    state.items.unshift(z); renderItems(); save();
  };
  $('edLock').onclick = () => { z.locked = !z.locked; renderList(); renderHandles(); renderEditor(); save(); };
  const del = $('edDel');
  let armed = false, armT;
  del.onclick = () => {
    if (!armed){
      armed = true; del.classList.add('confirm'); del.textContent = '¿Confirmar?';
      armT = setTimeout(() => { armed = false; renderEditor(); }, 2800);
      return;
    }
    clearTimeout(armT);
    if (z.locked){ toast('La zona está bloqueada: desbloqueala para eliminarla.', 'warn'); renderEditor(); return; }
    pushUndo();
    state.items.splice(state.items.indexOf(z), 1);
    state.sel = null;
    gItems.querySelector(`g[data-id="${z.id}"]`)?.remove();
    document.getElementById('clip-'+z.id)?.remove();
    renderLegend(); renderList(); renderHandles(); renderEditor(); save();
    toast('Zona eliminada — podés deshacer con Ctrl+Z.');
  };
}

const LS = 'croquis_campus_v4';
const snapshot = () => JSON.stringify({terrain: state.terrain, items: state.items, trees: state.trees, doc: state.doc});
const undoStack = [];
function pushUndoAt(snap){
  if (undoStack[undoStack.length-1] !== snap){ undoStack.push(snap); if (undoStack.length > 40) undoStack.shift(); }
  updateUndoBtn();
}
function pushUndo(){ pushUndoAt(snapshot()); }
function undo(){
  if (!undoStack.length){ toast('No hay cambios que deshacer.', 'warn'); return; }
  const s = JSON.parse(undoStack.pop());
  state.terrain = s.terrain; state.items = s.items; state.trees = s.trees; state.doc = s.doc;
  state.sel = state.sel && (state.sel === '__terrain' || itemById(state.sel)) ? state.sel : null;
  state.terrainEdit = false; setHint('');
  buildTerrain(); renderTrees(); renderItems(); renderEditor();
  setGrid(doc().grid); renderBrushOpts(); save(); updateUndoBtn();
  toast('Último cambio deshecho.');
}
function updateUndoBtn(){ const b = $('btnUndo'); if (b) b.disabled = !undoStack.length; }

let saveT;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try{ localStorage.setItem(LS, snapshot()); }catch(e){}
    $('savedLbl').textContent = 'Guardado localmente · ' + new Date().toLocaleTimeString('es-SV', {hour:'2-digit', minute:'2-digit'});
  }, 350);
}

function sanitizeItem(z){
  return {
    id: z.id || uid(), kind: KIND_LABEL[z.kind] ? z.kind : 'area',
    code: String(z.code || 'Z'), name: String(z.name || 'Sin nombre'), desc: String(z.desc || ''),
    color: /^#[0-9a-fA-F]{6}$/.test(z.color) ? z.color : '#6E6E66',
    visible: z.visible !== false, locked: !!z.locked,
    rot: clamp(+z.rot || 0, 0, 359), opacity: z.opacity != null ? clamp(+z.opacity, 0, .68) : .24,
    poly: (Array.isArray(z.poly) && z.poly.length >= 3) ? z.poly : rectPts(300, 300, 200, 120)
  };
}
function loadState(){
  const d = DOC_DEFAULT();
  try{
    const raw = localStorage.getItem(LS) || localStorage.getItem('croquis_campus_v3');
    if (raw){
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.items) && s.terrain && Array.isArray(s.terrain.points)){
        state.terrain = s.terrain;
        state.items = s.items.map(sanitizeItem);
        state.trees = Array.isArray(s.trees) ? s.trees : TREES_DEFAULT();
        Object.assign(d, s.doc || {});
        state.doc = d;
        return;
      }
    }
    const old = localStorage.getItem('ugb_croquis_libre_v1');
    if (old){
      const s = JSON.parse(old);
      if (s && Array.isArray(s.items) && s.terrain){
        state.terrain = s.terrain;
        state.items = s.items.map(sanitizeItem);
        state.trees = TREES_DEFAULT();
        state.doc = d;
        toast('Croquis anterior migrado a la nueva versión.');
        return;
      }
    }
  }catch(e){ fail('carga de datos', e); }
  state.terrain = {points: TERRAIN_DEFAULT(), name: 'Campus'};
  state.items = ITEMS_DEFAULT();
  state.trees = TREES_DEFAULT();
  state.doc = d;
}

/* rectángulo real que ocupa todo el dibujo */
function contentBounds(){
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  const add = (x, y) => { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; };
  state.terrain.points.forEach(p => add(p.x, p.y));
  state.items.forEach(z => {
    if (z.visible === false) return;
    z.poly.forEach(p => { const w = worldPt(z, p); add(w.x, w.y); });
  });
  state.trees.forEach(t => add(t.x, t.y));
  if (x0 === Infinity) return {x:0, y:0, w:W, h:H};
  const pad = 80;
  x0 -= pad; y0 -= pad; x1 += pad; y1 += pad;
  if (x1 - x0 < 300){ const cx = (x0+x1)/2; x0 = cx-150; x1 = cx+150; }
  if (y1 - y0 < 240){ const cy = (y0+y1)/2; y0 = cy-120; y1 = cy+120; }
  return {x:x0, y:y0, w:x1-x0, h:y1-y0};
}

/* SVG nuevo y limpio, dibujado desde el estado */
function buildExportSVG(b, withCartela){
  const root = document.createElementNS(NS, 'svg');
  root.setAttribute('xmlns', NS);
  const defs = document.createElementNS(NS, 'defs');
  const liveDefs = svg.querySelector('defs');
  if (liveDefs){
    const dc = liveDefs.cloneNode(true);
    const cs = dc.querySelector('#clipStore'); if (cs) cs.remove();
    while (dc.firstChild) defs.appendChild(dc.firstChild);
  }
  const clips = el('g', {id:'clipStore'}, defs);
  root.appendChild(defs);
  const st = document.createElementNS(NS, 'style');
  st.textContent = ".ft-s{font-family:'Archivo','Trebuchet MS',sans-serif}.ft-m{font-family:'IBM Plex Mono','Courier New',monospace}";
  root.appendChild(st);

  const paperY = withCartela ? b.y - 176 : b.y;
  const paperH = b.h + (withCartela ? 176 : 0);
  el('rect', {x:b.x, y:paperY, width:b.w, height:paperH, fill:'#F2EDDF'}, root);
  el('rect', {x:b.x, y:paperY, width:b.w, height:paperH, fill:'url(#dots)'}, root);

  buildTerrainInto(root, state.terrain);
  state.trees.forEach(t => drawTreeAt(root, t.x, t.y, t.r, t.tone));
  const itemsG = el('g', {}, root);
  state.items.forEach(z => { if (z.visible !== false) itemsG.appendChild(buildItemNodeInto(z, clips, true)); });

  if (withCartela) root.appendChild(buildCartela(b));
  return root;
}

/* cartela para el PNG, relativa al encuadre real */
function buildCartela(b){
  const g = el('g');
  const d = doc();
  const items = state.items.filter(z => z.visible !== false);
  const top = b.y - 176;
  el('rect', {x:b.x, y:top, width:b.w, height:176, fill:'#F2EDDF'}, g);
  el('rect', {x:b.x, y:b.y - 3, width:b.w, height:3, fill:'#24271D'}, g);
  txt(g, (d.title || 'CROQUIS DEL CAMPUS').toUpperCase(), {x:b.x+36, y:top+56, class:'ft-s', 'font-weight':800, 'font-size':30, fill:'#24271D'}, g);
  txt(g, d.subtitle || 'Plano de delimitación libre', {x:b.x+36, y:top+79, class:'ft-m', 'font-size':12, fill:'#565A4A', 'letter-spacing':1.8}, g);
  const fecha = new Date().toLocaleDateString('es-SV', {day:'numeric', month:'long', year:'numeric'});
  txt(g, `${items.length} zonas delimitadas · ${state.trees.length} árboles registrados · generado el ${fecha}${d.author ? ' · ' + d.author : ''}`,
    {x:b.x+36, y:top+134, class:'ft-m', 'font-size':11, fill:'#565A4A'}, g);
  const lx = b.x + Math.max(b.w - 660, 430);
  txt(g, 'LEYENDA', {x:lx, y:top+18, class:'ft-m', 'font-weight':700, 'font-size':10, fill:'#565A4A', 'letter-spacing':2}, g);
  const shown = items.slice(0, 18);
  const cols = Math.min(3, Math.max(1, Math.ceil(shown.length / 6)));
  const colW = 660 / cols;
  shown.forEach((z, i) => {
    const col = Math.floor(i/6), row = i % 6;
    const x = lx + col*colW, y = top + 42 + row*22;
    el('rect', {x, y:y-10, width:13, height:13, fill:z.color, stroke:'rgba(20,22,16,.45)', 'stroke-width':1}, g);
    txt(g, `${z.code || '—'} — ${(z.name || '').slice(0, 30)}`, {x:x+19, y, class:'ft-m', 'font-size':11, fill:'#24271D'}, g);
  });
  if (items.length > 18) txt(g, `… y ${items.length-18} más`, {x:lx, y:top+42+6*22, class:'ft-m', 'font-size':11, fill:'#565A4A'}, g);
  return g;
}

async function embedFonts(svgRoot){
  try{
    const cssURL = 'https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=IBM+Plex+Mono:wght@400;700&display=swap';
    let css = await (await fetch(cssURL)).text();
    const urls = [...new Set([...css.matchAll(/url\((https:\/\/[^)]+)\)/g)].map(m => m[1]))];
    for (const u of urls){
      const blob = await (await fetch(u)).blob();
      const dataUrl = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
      css = css.split(u).join(dataUrl);
    }
    const st = document.createElementNS(NS, 'style');
    st.textContent = css;
    svgRoot.insertBefore(st, svgRoot.firstChild);
  }catch(e){ console.warn('Fuentes no incrustadas en la exportación.'); }
}

async function renderMapCanvas(targetLong, withCartela){
  const b = contentBounds();
  const totalH = b.h + (withCartela ? 176 : 0);
  const scale = targetLong / Math.max(b.w, totalH);
  const root = buildExportSVG(b, withCartela);
  const vbY = withCartela ? b.y - 176 : b.y;
  root.setAttribute('viewBox', `${b.x} ${vbY} ${b.w} ${totalH}`);
  const pw = Math.round(b.w * scale), ph = Math.round(totalH * scale);
  root.setAttribute('width', pw); root.setAttribute('height', ph);
  await embedFonts(root);
  const xml = new XMLSerializer().serializeToString(root);
  const url = URL.createObjectURL(new Blob([xml], {type:'image/svg+xml;charset=utf-8'}));
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = url; });
  const cv = document.createElement('canvas');
  cv.width = pw; cv.height = ph;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#F2EDDF';
  ctx.fillRect(0, 0, pw, ph);
  ctx.drawImage(img, 0, 0, pw, ph);
  URL.revokeObjectURL(url);
  return cv;
}

async function exportPNG(){
  toast('Generando PNG del croquis completo…');
  try{
    const cv = await renderMapCanvas(3200, true);
    cv.toBlob(b => { downloadBlob(b, 'croquis-campus.png'); toast('PNG exportado: croquis completo (3200 px de lado mayor).'); }, 'image/png');
  }catch(e){ fail('PNG', e); toast('No se pudo generar el PNG en este navegador.', 'err'); }
}

/* vista previa con confirmación antes de armar el PDF */
function previewAndConfirm(dataUrl, w, h){
  return new Promise(res => {
    let done = false;
    const finish = v => { if (done) return; done = true; closeModal(); res(v); };
    openModal(`
      <h3>Vista previa del PDF</h3>
      <div class="m-sub">PÁGINA 1 · PLANO COMPLETO · ${w} × ${h} px</div>
      <div class="pvbox"><img src="${dataUrl}" alt="Vista previa del plano"></div>
      <p style="font-size:11.5px;color:var(--ink2)">El plano se ajusta automáticamente para incluir <b>todo</b> el contenido
      (campus, zonas y vegetación), sin importar el zoom actual o si dibujaste fuera del área inicial.
      Después de esta página va el registro de zonas con sigla, nombre, tipo, área y descripción.</p>
      <div class="m-btns">
        <button class="btn" id="pvCancel">Cancelar</button>
        <button class="btn primary" id="pvOk">Guardar PDF</button>
      </div>`);
    $('pvOk').onclick = () => finish(true);
    $('pvCancel').onclick = () => finish(false);
    $('modalWrap').addEventListener('modalclosed', () => finish(false), {once:true});
  });
}

function hexRGB(hex){
  try{
    const c = hex.replace('#','');
    return [parseInt(c.substr(0,2),16), parseInt(c.substr(2,2),16), parseInt(c.substr(4,2),16)];
  }catch(e){ return [110,110,102]; }
}

async function exportPDF(){
  if (!window.jspdf || !window.jspdf.jsPDF){ toast('No se pudo cargar el generador PDF (revisá la conexión).', 'err'); return; }
  toast('Dibujando el croquis completo…');
  try{
    /* 1) plano completo desde los datos */
    const cv = await renderMapCanvas(2800, false);
    const mapUrl = cv.toDataURL('image/png');

    /* 2) vista previa y confirmación */
    const ok = await previewAndConfirm(mapUrl, cv.width, cv.height);
    if (!ok){ toast('Exportación de PDF cancelada.'); return; }

    /* 3) armado del documento */
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
    const d = doc();
    const fecha = new Date().toLocaleDateString('es-SV', {day:'numeric', month:'long', year:'numeric'});
    const title = d.title || 'Croquis del campus';
    const sub = d.subtitle || 'Plano de delimitación libre';

    pdf.setDrawColor(30,33,25); pdf.setLineWidth(.9); pdf.rect(8, 8, 281, 194);
    pdf.setLineWidth(.25); pdf.rect(10.5, 10.5, 276, 189);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(17); pdf.setTextColor(30,33,25);
    pdf.text(title, 14, 21.5);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(96,100,86);
    pdf.text(sub, 14, 27.5);
    pdf.text(fecha, 283, 21.5, {align:'right'});
    if (d.author) pdf.text(d.author, 283, 27.5, {align:'right'});
    pdf.setDrawColor(30,33,25); pdf.setLineWidth(.5); pdf.line(14, 31, 283, 31);

    /* imagen ajustada al marco conservando la proporción real del croquis */
    const availW = 262, availH = 152;
    const ar = cv.width / cv.height;
    let iw = availW, ih = availW / ar;
    if (ih > availH){ ih = availH; iw = availH * ar; }
    pdf.addImage(mapUrl, 'PNG', (297-iw)/2, 36 + (availH-ih)/2, iw, ih);

    const items = state.items.filter(z => z.visible !== false);
    const hidden = state.items.length - items.length;
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(96,100,86);
    pdf.text(`Zonas: ${items.length}${hidden ? ' (+ ' + hidden + ' ocultas)' : ''}  ·  Vegetación: ${state.trees.length} árboles  ·  Campus: ${fmtA(polyArea(state.terrain.points)*M2)} m2 aprox.`, 14, 197.5);

    const HEAD = [['SW', 12, 12], ['SIGLA', 15, 17], ['NOMBRE', 55, 32], ['TIPO', 30, 87], ['ÁREA', 14, 117], ['DESCRIPCIÓN', 150, 131]];
    let y = 0, rowIdx = 0;
    const drawTableHead = () => {
      pdf.setFillColor(36,39,25); pdf.rect(12, 24, 273, 8, 'F');
      pdf.setFont('helvetica','bold'); pdf.setFontSize(7.5); pdf.setTextColor(242,237,223);
      HEAD.forEach(([h, w]) => pdf.text(h, w + 1.5, 29.3));
      y = 34; rowIdx = 0;
    };
    const newTablePage = () => {
      pdf.addPage();
      pdf.setFont('helvetica','bold'); pdf.setFontSize(12); pdf.setTextColor(30,33,25);
      pdf.text('REGISTRO DE ZONAS', 12, 16);
      pdf.setDrawColor(30,33,25); pdf.setLineWidth(.5); pdf.line(12, 19, 285, 19);
      drawTableHead();
    };
    newTablePage();

    for (const z of items){
      const desc = (z.desc || '').trim() || '—';
      const descLines = pdf.splitTextToSize(desc, 148);
      const nameLines = pdf.splitTextToSize(z.name || z.code || '—', 53);
      const rowH = Math.max(9, descLines.length*4.3 + 4.5, nameLines.length*4.3 + 4.5);
      if (y + rowH > 192) newTablePage();
      if (rowIdx % 2 === 0){ pdf.setFillColor(245,242,232); pdf.rect(12, y, 273, rowH, 'F'); }
      const [r, g, b] = hexRGB(z.color);
      pdf.setFillColor(r, g, b); pdf.rect(13.5, y + rowH/2 - 3, 6, 6, 'F');
      pdf.setDrawColor(30,33,25); pdf.setLineWidth(.3); pdf.rect(13.5, y + rowH/2 - 3, 6, 6);
      pdf.setTextColor(30,33,25);
      pdf.setFont('helvetica','bold'); pdf.setFontSize(8);
      pdf.text(String(z.code || '—'), 18.5, y + 5.8);
      pdf.text(nameLines, 33.5, y + 5.8);
      pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5); pdf.setTextColor(96,100,86);
      pdf.text(KIND_LABEL[z.kind] || 'Zona', 88.5, y + 5.8);
      pdf.text(fmtA(polyArea(z.poly)*M2) + ' m2', 118.5, y + 5.8);
      pdf.setTextColor(52,55,44);
      pdf.text(descLines, 132.5, y + 5.8);
      y += rowH; rowIdx++;
    }

    const T = state.terrain;
    const lines = [
      `Vértices del límite: ${T.points.length}`,
      `Perímetro del campus: ${fmtA(polyPerim(T.points)*M)} m`,
      `Superficie del campus: ${fmtA(polyArea(T.points)*M2)} m2 (aprox.)`,
      `Zonas delimitadas: ${items.length}  ·  Vegetación registrada: ${state.trees.length} árboles`
    ];
    const need = 26 + lines.length*6;
    if (y + need > 192) pdf.addPage();
    const hy = y > 34 ? y + 12 : 34;
    pdf.setFont('helvetica','bold'); pdf.setFontSize(11); pdf.setTextColor(30,33,25);
    pdf.text('DELIMITACIÓN DEL CAMPUS', 12, hy);
    let ry = hy + 6;
    pdf.setDrawColor(30,33,25); pdf.setLineWidth(.5); pdf.line(12, ry - 2.5, 285, ry - 2.5);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9); pdf.setTextColor(52,55,44);
    lines.forEach(l => { pdf.text(l, 12, ry + 4); ry += 6; });

    const n = pdf.internal.getNumberOfPages();
    for (let i = 1; i <= n; i++){
      pdf.setPage(i);
      pdf.setDrawColor(30,33,25); pdf.setLineWidth(.3); pdf.line(12, 202, 285, 202);
      pdf.setFont('helvetica','normal'); pdf.setFontSize(7.5); pdf.setTextColor(96,100,86);
      pdf.text(`${title} · ${fecha}`, 12, 206);
      pdf.text(`Página ${i} de ${n}`, 283, 206, {align:'right'});
    }
    const slug = (d.title || 'croquis-campus').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0, 48);
    pdf.save(slug + '.pdf');
    toast('PDF guardado: croquis completo + registro de ' + items.length + ' zonas.');
  }catch(e){ fail('PDF', e); toast('No se pudo generar el PDF.', 'err'); }
}

/* =====================================================================
   TECLADO · TOASTS
===================================================================== */
function toast(msg, tone = 'ok'){
  const t = document.createElement('div');
  t.className = 'toast ' + tone; t.textContent = msg;
  $('toasts').appendChild(t);
  requestAnimationFrame(() => t.classList.add('on'));
  setTimeout(() => { t.classList.remove('on'); setTimeout(() => t.remove(), 300); }, 3200);
}

document.addEventListener('keydown', e => {
  try{
    const inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !inField){
      e.preventDefault(); undo(); return;
    }
    if (e.key === 'Escape'){
      if ($('modalWrap').classList.contains('on')){ closeModal(); return; }
      if (state.drawing){ cancelDrawing(); setHint(HINTS[state.tool] || ''); return; }
      if (state.terrainEdit){ setTerrainEdit(false); return; }
      if (document.body.classList.contains('presenting')){ setPresenting(false); return; }
      if (state.tool !== 'select'){ setTool('select'); return; }
      if (state.sel){ state.sel = null; state.items.forEach(applyZoneStyle); renderHandles(); renderEditor(); renderList(); }
      return;
    }
    if (inField || e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (state.drawing){
      if (e.key === 'Enter'){ e.preventDefault(); closeDrawing(); return; }
      if (k === 'backspace'){ e.preventDefault(); popDrawVertex(); return; }
    }
    const tools = {v:'select', p:'poly', f:'free', t:'terrainDraw', n:'brush', x:'eraser'};
    const stamps = {b:'bldg', a:'aud', c:'pitch', e:'lot', g:'plaza'};
    if (tools[k]){ setTool(tools[k]); return; }
    if (stamps[k]){ setStamp(stamps[k]); return; }
    if (k === 'r' && state.sel && state.sel !== '__terrain'){
      const z = getSel();
      if (z && !z.locked){ pushUndo(); z.rot = norm360((z.rot||0) + 90); updateItemNode(z); renderHandles(); renderEditor(); save(); }
      return;
    }
    if ((k === 'delete' || k === 'backspace') && state.sel && state.sel !== '__terrain'){
      const z = getSel();
      if (z){
        if (z.locked){ toast('La zona está bloqueada: desbloqueala para eliminarla.', 'warn'); return; }
        e.preventDefault();
        pushUndo();
        state.items.splice(state.items.indexOf(z), 1);
        state.sel = null;
        gItems.querySelector(`g[data-id="${z.id}"]`)?.remove();
        document.getElementById('clip-'+z.id)?.remove();
        renderLegend(); renderList(); renderHandles(); renderEditor(); save();
        toast('Zona eliminada — Ctrl+Z para deshacer.');
      }
    }
  }catch(err){ fail('teclado', err); }
});

/* =====================================================================
   CONEXIÓN DE LA INTERFAZ
===================================================================== */
function wireTools(){
  document.querySelectorAll('.tool').forEach(btn => {
    if (btn.dataset.wired) return;
    btn.dataset.wired = '1';
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      try{
        if (btn.dataset.tool) setTool(btn.dataset.tool);
        else if (btn.dataset.stamp) setStamp(btn.dataset.stamp);
      }catch(err){ fail('herramienta', err); }
    });
  });
}

function wireUI(){
  wireTools();
  $('btnHelp').onclick = openHelp;
  $('btnPresent').onclick = () => setPresenting(true);
  $('exitPresent').onclick = () => setPresenting(false);
  $('btnPNG').onclick = exportPNG;
  $('btnPDF').onclick = exportPDF;
  $('btnUndo').onclick = undo;
  $('btnData').onclick = e => { e.stopPropagation(); $('ddData').classList.toggle('open'); };
  $('miSettings').onclick = () => { $('ddData').classList.remove('open'); openSettings(); };
  $('miExport').onclick = () => {
    $('ddData').classList.remove('open');
    downloadBlob(new Blob([JSON.stringify({version:4, terrain: state.terrain, items: state.items, trees: state.trees, doc: state.doc}, null, 2)],
      {type:'application/json'}), 'croquis-campus.json');
    toast('Datos del croquis exportados (JSON).');
  };
  $('miImport').onclick = () => $('fileIn').click();
  $('fileIn').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        let terrain = null, items = null, trees = null, docO = null;
        if (Array.isArray(d)){
          const map = {cd:'pitch', est:'lot', au:'aud', plz:'plaza'};
          items = d.map(z => sanitizeItem({...z, kind: map[z.id] || 'area', poly: rectPts(+z.x || 300, +z.y || 300, +z.w || 200, +z.h || 120)}));
        } else if (d.items && d.terrain){
          terrain = d.terrain; items = d.items.map(sanitizeItem);
          trees = Array.isArray(d.trees) ? d.trees : null; docO = d.doc || null;
        } else throw new Error('formato desconocido');
        if (!items.length) throw new Error('sin zonas');
        pushUndo();
        if (terrain && Array.isArray(terrain.points) && terrain.points.length >= 3)
          state.terrain = {points: terrain.points, name: terrain.name || 'Campus'};
        state.items = items;
        if (trees) state.trees = trees;
        if (docO) Object.assign(state.doc, docO);
        state.sel = null; state.terrainEdit = false;
        buildTerrain(); renderTrees(); renderItems(); renderEditor(); setGrid(doc().grid); save();
        toast(`Croquis importado: ${state.items.length} zonas.`);
      }catch(err){ toast('El archivo no contiene un croquis válido.', 'err'); }
    };
    rd.readAsText(f);
    e.target.value = '';
  });
  document.addEventListener('click', e => { if (!e.target.closest('.dd')) $('ddData').classList.remove('open'); });
  $('btnReset').onclick = () => {
    openModal(`
      <h3>Restablecer croquis</h3>
      <div class="m-sub">VOLVER AL PLANO ORIGINAL</div>
      <p>Se descartarán la delimitación del campus, la vegetación plantada, las zonas nuevas y todos los
      cambios de nombres, colores, rotaciones y ajustes. Esta acción no se puede deshacer.</p>
      <div class="m-btns">
        <button class="btn" id="rsCancel">Cancelar</button>
        <button class="btn danger" id="rsOk">Restablecer</button>
      </div>`);
    $('rsCancel').onclick = closeModal;
    $('rsOk').onclick = () => {
      localStorage.removeItem(LS);
      localStorage.removeItem('croquis_campus_v3');
      localStorage.removeItem('ugb_croquis_libre_v1');
      state.terrain = {points: TERRAIN_DEFAULT(), name: 'Campus'};
      state.items = ITEMS_DEFAULT();
      state.trees = TREES_DEFAULT();
      state.doc = DOC_DEFAULT();
      state.sel = null; state.terrainEdit = false; undoStack.length = 0; updateUndoBtn();
      closeModal(); setTool('select');
      buildBase(); buildTerrain(); renderTrees(); renderItems(); renderEditor();
      fitBounds(contentBounds());
      toast('Croquis restablecido al plano original.');
    };
  };
  $('lgHead').onclick = () => $('legend').classList.toggle('closed');
  $('search').addEventListener('input', renderList);
  $('zin').onclick  = () => zoomAt(view.x+view.w/2, view.y+view.h/2, 1.3);
  $('zout').onclick = () => zoomAt(view.x+view.w/2, view.y+view.h/2, 1/1.3);
  $('zfit').onclick = () => fitBounds(contentBounds());
}

function selfTest(){
  const buttons = [...document.querySelectorAll('.tool')];
  const wired = buttons.filter(b => b.dataset.wired).length;
  const helpOk = typeof $('btnHelp').onclick === 'function';
  if (wired < buttons.length || !helpOk){
    wireTools(); wireUI();
    toast('Se reconectaron algunas herramientas que no respondían.', 'warn');
  }
  return {wired, total: buttons.length, helpOk};
}

/* =====================================================================
   ARRANQUE
===================================================================== */
function boot(){
  try{
    buildBase();
    loadState();
    buildTerrain();
    renderTrees();
    renderItems();
    renderChips();
    renderEditor();
    applyView();
    setTool('select');
    updateUndoBtn();
    $('savedLbl').textContent = state.items.length + ' zonas cargadas';
    const st = selfTest();
    toast(`Croquis listo · ${st.wired}/${st.total} herramientas · PNG y PDF exportan el contenido completo`);
  }catch(err){ fail('arranque', err); }
}

try{
  wireUI();
  boot();
}catch(err){ fail('inicio', err); }
</script>
